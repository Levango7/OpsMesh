name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # 镜像 tag 强制小写：Docker repository 名不允许大写（实测 GitHub owner 名
  # 'Levango7' 直接拼进 tag 报 invalid tag: repository name must be lowercase）。
  IMAGE_PREFIX: ghcr.io/levango7

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # keyless cosign 需要 id-token:write（Fulcio OIDC）；推送镜像需要 packages:write。
    # 不给 contents:write——本 job 不写仓库内容，权限按最小集给。
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        # 只列**常驻服务**：Dockerfile.service 假设 `services/<svc>/cmd/<svc>` 布局并以
        # `CMD ["svc"]` 起 HTTP 服务。`services/` 目录里不是所有模块都是服务——
        # tf-provider 是 Terraform 插件（main.go 里 plugin.Serve），装进容器会在启动瞬间
        # 打印"This binary is a plugin"并以码 1 退出，做成镜像就是一个必定 CrashLoop 的产物。
        # 它仍被 ci.yml 的 services job 逐个 `go build ./...` 覆盖（编译/测试不受影响）。
        # 这类"模块 vs 服务"的差集必须写进 validate-deploy-assets.sh 的豁免表（含理由），
        # 否则第 2/10 节会红——刻意不允许静默漂移。
        # 服务清单在 build-and-push 与 promote **两处各一份**（GitHub Actions 的
        # workflow 解析器不支持 YAML 锚点/别名——release.yml 曾用 &releaseServices/
        # *releaseServices 做单一清单源，结果整个 workflow 0 秒挂：GitHub 端解析
        # 直接拒绝，actionlint 同时判红，2026-10-05 修复）。新增服务必须两处同步改，
        # 漏一处就是「发出去的」与「提权的」不是同一批服务（本项目在孪生清单上吃过亏）。
        service:
          - auth-svc
          - device-svc
          - alert-svc
          - task-svc
          - config-svc
          - log-svc
          - aio-svc
          - autoscaler-svc
          - gpu-svc
          - incident-svc
          - portal-svc
          - runbook-svc
    steps:
      - uses: actions/checkout@v5

      - name: 版本源一致性（发布标签必须等于 Chart.yaml appVersion）
        # 为什么必须在构建**之前**：第一次切 v0.9.2 时，Chart.yaml 的 version/appVersion、
        # values-production 的三处 tag、gitops segment、internal/version 全都还写着 0.9.0。
        # 产物本身不受影响（版本号由标签经 goreleaser {{.Version}} / --build-arg VERSION 注入），
        # 但客户按 values-production 装到的是 0.9.0 —— 「发出去的版本」与「清单声明的版本」不一致，
        # 而此前没有任何一处核对：门禁第 1 节只保证版本源彼此一致，它不知道正在发哪个标签。
        run: |
          set -euo pipefail
          WANT="${GITHUB_REF_NAME#v}"
          HAVE="$(grep -E '^appVersion:' deploy/helm/opsmesh/Chart.yaml | sed -E 's/.*"([^"]*)".*/\1/')"
          if [ "$WANT" != "$HAVE" ]; then
              echo "::error::发布标签 v${WANT} 与 Chart.yaml appVersion=${HAVE} 不一致：请先 bump 版本源（Chart / values-production / gitops segment / internal-version）再打标签"
              exit 1
          fi
          echo "版本源一致：appVersion=${HAVE} == 标签 v${WANT}"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # 构建上下文=仓库根（services/<svc> 的 go.mod 均 replace opsmesh => ../..，
      # 上下文限单服务目录时容器内无主模块，go mod verify 必报
      # "replaced by ../../: open /go.mod"——首跑实测）。统一走根级
      # Dockerfile.service 模板，服务名经 --build-arg SERVICE 注入。
      # （此位置曾有一个拆分时遗留的悬空步骤头「Build Docker image」，缺 run/uses
      #   被 actionlint 判红，2026-10-05 删除；上面这段构建上下文理由属于下面的 buildx 步骤。）
      - name: Build Docker image（只推不可变的 :<sha>，版本 tag 与 :latest 交给 promote job）
        # 为什么拆两段（原形态是实测缺陷）：一条 buildx 同时推 :sha、:<版本> 与 :latest，
        # 而 Trivy（下一步，exit-code 1）、SBOM、签名全部排在推送**之后**——扫描判红的镜像
        # 早已是客户 `helm install` 能拉到的那一份（chart/文档默认值就是 :latest）。
        # 现在 :<sha> 只当"待验对象"落地；全部门禁绿了才由 promote job 在 registry 侧改标提权，
        # 不重建 ⇒ digest 不变 ⇒ "被扫的那份"与"被推的那份"是同一份。
        # 证据不用重出：cosign 的签名/attestation 挂在 **digest** 上而非 tag，
        # 提权后的 :<版本>/:latest 依旧能直接 `cosign verify` 问到。
        run: |
          docker buildx build \
            --file Dockerfile.service \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            --build-arg SERVICE=${{ matrix.service }} \
            --tag ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            --push \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      # 供应链证据：SBOM + 镜像签名。**放在 Trivy 之后**：不给会被判红的镜像留签名。
      # 为什么必须补在这里：核心镜像由 ci.yml 的 image job 签名，而这 12 个微服务镜像**只**
      # 由本 job 发布——此前本文件没有任何 cosign/SBOM 步骤，于是 v0.9.2 的 17 个镜像全部未签名
      # （实测 `auth-svc:0.9.2` 的 `.sig` → 404），抓取面上就是"两个核心镜像有签名、其余没有"。
      # 口径刻意与 ci.yml 逐字一致（同一 installer 钉同 commit、同一 cosign 版本、同一 keyless 模式），
      # 避免两条发布路径产出不同强度的证据。
      - name: 生成镜像 SBOM（syft v1.51.1，钉版）
        run: |
          set -euo pipefail
          command -v syft >/dev/null 2>&1 || {
              curl -sSfL "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz" -o /tmp/syft.tar.gz
              tar -xzf /tmp/syft.tar.gz -C /tmp syft
              sudo mv /tmp/syft /usr/local/bin/syft
          }
          syft version
          syft "${{ steps.meta.outputs.image }}:${{ github.sha }}" -o spdx-json > "sbom-${{ matrix.service }}-${GITHUB_SHA}.spdx.json"
          python3 -c 'import json,sys; ps=(json.load(open(sys.argv[1])) or {}).get("packages") or []; sys.exit("SPDX packages 为空——SBOM 没抓到任何组件，判红（空证据比没证据更坏）") if not ps else print("SBOM 包条目数:", len(ps))' "sbom-${{ matrix.service }}-${GITHUB_SHA}.spdx.json"
          # 第二份 CycloneDX 是给 `cosign attest --type cyclonedx` 当谓词用的：
          # cosign 的 attest 只认 cyclonedx/slsa/default 这几种谓词类型，SPDX 文档不能直接喂
          # （--type spdx 不存在）。SPDX 那份继续作为 workflow 产物原样保留，两者并存不替换。
          syft "${{ steps.meta.outputs.image }}:${{ github.sha }}" -o cyclonedx-json > "sbom-${{ matrix.service }}-${GITHUB_SHA}.cdx.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); cs=d.get("components") or []; sys.exit("CycloneDX components 为空或缺 bomFormat/specVersion——attest 谓词不可用，判红") if (not cs or "bomFormat" not in d or "specVersion" not in d) else print("CycloneDX 组件数:", len(cs), "/ bomFormat", d["bomFormat"], "/ specVersion", d["specVersion"])' "sbom-${{ matrix.service }}-${GITHUB_SHA}.cdx.json"

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          # 两份都留：SPDX 供人读/工具吃，CycloneDX 是 .att 的谓词原件（离线复核证据链时要对得上）
          path: sbom-${{ matrix.service }}-${{ github.sha }}.*.json
          retention-days: 30

      - name: 安装 cosign（官方 installer，钉死 commit）
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2
        with:
          cosign-release: 'v2.2.4'

      - name: cosign 签名镜像（keyless OIDC）
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          echo "已签名（keyless/OIDC）: ${{ steps.meta.outputs.image }}"

      - name: 自验证签名（签完必须验得过，否则这里就红）
        # 为什么要自验：`cosign sign` 变成空转（例如 OIDC 权限没给、或将来被人加 if 跳过）会让
        # job 保持绿色而镜像其实没签名——正是本项目反复抓到的"报告与实际不符"形态。
        # 用身份正则锁到本 workflow 文件，验不过直接失败。
        #
        # 为什么要重试（2026-09-27 首次真跑实测）：GHCR 存在**写后读窗口**——`cosign sign` 报告
        # `Pushing signature to: ghcr.io/levango7/<svc>` 并拿到 tlog 索引之后，紧接着的 verify
        # 仍报 `Error: no signatures found`；几分钟后复查同一个 digest 的 `.sig` → **200**。
        # 同一次运行里 aio-svc 等 4 个 job 的同一步骤是通过的，属竞态而非配置错。
        # 因此这里**退避重试而不是放宽判据**：5 次都验不过仍判红（那才是真没签上）。
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          for i in 1 2 3 4 5; do
              if cosign verify \
                  --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "${IMG}" >/dev/null; then
                  echo "签名已验证：${{ matrix.service }}（第 ${i} 次尝试）"
                  exit 0
              fi
              if [ "$i" = 5 ]; then
                  echo "::error::cosign verify 连续 5 次失败：不是 GHCR 写后读延迟，签名确实不在 ${IMG}"
                  exit 1
              fi
              echo "第 ${i} 次 verify 未命中（GHCR 写后读窗口），$((i * 10))s 后重试"
              sleep $((i * 10))
          done

      - name: cosign 出具 SBOM 证据（attest，产出 .att）
        # 为什么还要这一步：签名只回答"这镜像确实是我们发的"，回答不了"里面有什么"。
        # 此前 SBOM 仅作为 workflow 产物存在 ⇒ 客户必须登录 Actions 才能核对成分。
        # attest 之后，`cosign verify-attestation <image>` 可以直接**从镜像本身**问到成分。
        # 现状取证：v0.10.0 发布后 14 个镜像 `.sig` 全在位，`.att` 为 0/14（报告 §24.1）。
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type cyclonedx \
            --predicate "sbom-${{ matrix.service }}-${GITHUB_SHA}.cdx.json" \
            "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          echo "attestation 已出具（keyless/OIDC）: ${{ steps.meta.outputs.image }}"

      - name: 自验证 attestation（出完必须验得过）
        # 与签名同一套判据与退避：attest 空转（将来被加 if 跳过 / OIDC 权限没给）不能让 job 保持绿；
        # GHCR 的写后读窗口同样适用于 .att（§19.9 实测发生在 .sig 上）。
        # 判据不放宽：5 次退避后仍验不过就判红——那才是证据真不在注册表上。
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          for i in 1 2 3 4 5; do
              if cosign verify-attestation --type cyclonedx \
                  --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "${IMG}" >/dev/null; then
                  echo "SBOM 证据已验证：${{ matrix.service }}（第 ${i} 次尝试）"
                  exit 0
              fi
              if [ "$i" = 5 ]; then
                  echo "::error::cosign verify-attestation 连续 5 次失败：不是写后读延迟，attestation 确实不在 ${IMG}"
                  exit 1
              fi
              echo "第 ${i} 次 verify-attestation 未命中（GHCR 写后读窗口），$((i * 10))s 后重试"
              sleep $((i * 10))
          done

  # 提权（gate-before-promote）：build-and-push **整批** 12 个服务都过了 Trivy/SBOM/签名/attest
  # 自验，才把 :<sha> 复制成 :<版本> 与 :latest。
  # 为什么不直接在 build-and-push 末尾加一步：matrix 条目各自跑，某个服务判红时其余条目仍会
  # 跑到最后一步 ⇒ `:latest` 只对一半服务挪动，形成"半挪动的 latest 舰队"，而 chart 与文档默认值
  # 恰恰就是 :latest。needs 让整个 job 在任一条目红时根本不启动 ⇒ 要么 12 个一起提，要么一个都不提。
  # github-release 依赖本 job，所以提权失败连对外 Release 都不会有。
  # 范围说明：这里只管 12 个微服务镜像；opsmesh-binary / opsmesh-agent 由 ci.yml 的 image job 发布。
  promote:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # 只写包，不写仓库内容；id-token 不需要（证据已挂在 digest 上，提权不产生新签名）。
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # 与 build-and-push 的 matrix.service 是同一份清单（见该处的同步警告：
        # GitHub Actions 不支持锚点，只能两处各一份，新增服务必须两处同步改）。
        service:
          - auth-svc
          - device-svc
          - alert-svc
          - task-svc
          - config-svc
          - log-svc
          - aio-svc
          - autoscaler-svc
          - gpu-svc
          - incident-svc
          - portal-svc
          - runbook-svc
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提权 :<sha> → :<版本> + :latest（registry 侧改标，不重建）
        # 版本号的剥 v 规则必须与 build-and-push 的 "Extract metadata" 一致，否则提上去的 tag
        # 与 chart 里 pin 的值对不上——这正是 deda995 那次"pin 指向从未发布的版本"的成因形态。
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMG="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          docker buildx imagetools create \
            -t "${IMG}:${VERSION}" \
            -t "${IMG}:latest" \
            "${IMG}:${GITHUB_SHA}"
          echo "提权完成: ${IMG} -> ${VERSION} + latest（源 digest=${GITHUB_SHA}）"

      - name: 自验提权后的 digest 与被扫的那份是同一份
        # 判据不是"tag 存在"而是"digest 相同"：改标若被解析成重新构建，就会推出一份
        # 没被 Trivy 看过的镜像，而 job 依旧全绿。
        # 重试是必需的：GHCR 有写后读窗口（本文件 §19.9 在 .sig 上实测过），
        # 但 5 次退避后仍拿不到就判红，并**分开报**"读不到"与"digest 不一致"——
        # 前者该重跑，后者是发布事故。
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMG="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          # --raw 取回 manifest 原文，对其字节求 sha256 即该 tag 的 manifest digest。
          # 两边用同一个函数算，所以这里断言的是"两个 tag 指向同一份内容"，
          # 不是拿它去对 registry 报告的 digest 字符串。
          dig() { docker buildx imagetools inspect --raw "$1" | sha256sum | awk '{print "sha256:"$1}'; }
          SRC_DIGEST=""
          for i in 1 2 3 4 5; do
            if SRC_DIGEST=$(dig "${IMG}:${GITHUB_SHA}") && [ -n "$SRC_DIGEST" ]; then
              break
            fi
            if [ "$i" = 5 ]; then
              echo "::error::读不到 ${IMG}:${GITHUB_SHA} 的 manifest：源 tag 不在，提权前提就不成立"
              exit 1
            fi
            echo "第 ${i} 次未读到源 manifest（GHCR 写后读窗口），$((i * 10))s 后重试"
            sleep $((i * 10))
          done
          for tgt in "${IMG}:${VERSION}" "${IMG}:latest"; do
            got=""
            for i in 1 2 3 4 5; do
              if got=$(dig "$tgt") && [ -n "$got" ]; then break; fi
              if [ "$i" = 5 ]; then
                echo "::error::提权后读不到 ${tgt}——没能核对，不当它已提权"
                exit 1
              fi
              echo "第 ${i} 次未读到 ${tgt}，$((i * 10))s 后重试"
              sleep $((i * 10))
            done
            if [ "$got" != "$SRC_DIGEST" ]; then
              echo "::error::digest 不一致：${tgt}=${got} 而源 :${GITHUB_SHA}=${SRC_DIGEST}"
              echo "::error::⇒ 提权后的 tag 指向的不是被 Trivy/签名看过的那份，属发布事故"
              exit 1
            fi
            echo "digest 一致: ${tgt} = ${got}"
          done

  changelog:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          tag_prefix: ""
          release_branches: main

  github-release:
    runs-on: ubuntu-latest
    # 依赖从 build-and-push 换成 promote：对外 Release 必须在"版本 tag 真的提上去"之后才有意义。
    # promote 已经把 build-and-push 整批串在前面，这里不再重复列它——
    # 重复列反而会诱使人以为"build 绿了就会发 Release"，而中间还隔着提权这道闸。
    needs: [promote, changelog]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 组装发布说明（正文取自 docs/release-notes.md 的本版小节）
        id: notes
        # 为什么必须自己取而不是只用 github-tag-action 生成的那份：那个正文是"两个 tag 之间的
        # commit 标题清单"，而客户要的是**本版做了什么 + 哪些能力是降级的**（升级前必读的
        # 破坏性变更、以及"能力表里这条现在验不了"）。此前 Release 正文里这两样都不存在，
        # 明细只写在仓库内 docs/release-notes.md 里——GitHub 上的发布物看不到。
        # 小节缺失直接判红，而不是悄悄退化回 commit 清单（发出去的东西也必须"有锚点"）。
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test -f docs/release-notes.md || { echo "::error::仓库内缺 docs/release-notes.md"; exit 1; }
          awk -v t="## ${TAG}" '
            index($0, t " ") == 1 || $0 == t { found = 1 }
            found && /^## / && index($0, t " ") != 1 && $0 != t { exit }
            found { print }
          ' docs/release-notes.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::docs/release-notes.md 里没有 ${TAG} 的小节：请先补发布说明再打标签"
            exit 1
          fi
          if ! grep -q "能力降级清单" /tmp/release-notes.md; then
            echo "::error::${TAG} 的发布说明缺「能力降级清单」小节：降级能力必须随版本发布对外说明"
            exit 1
          fi
          if ! grep -q "破坏性" /tmp/release-notes.md; then
            echo "::error::${TAG} 的发布说明缺「破坏性 / 行为变更」小节（无此类变更也要显式写「无」）"
            exit 1
          fi
          echo "取到 $(wc -l < /tmp/release-notes.md) 行发布说明（首行：$(head -1 /tmp/release-notes.md)）"
          { echo "body<<__NOTES_EOF__"; cat /tmp/release-notes.md; echo "__NOTES_EOF__"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  # 发布物回核：把"这个 tag 的产物真的存在"变成一条自动断言。
  #
  # 为什么单独一个 job 而不是塞进 github-release：本仓库栽过两次同形状的跟头——
  #   · §19：v0.9.1 有 tag、Release 也建了，但 GHCR 没有该版本镜像矩阵（18 条全灭）；
  #   · §32.9：v0.12.0 归版把 Chart/values/gitops 的 tag 全钉到 0.12.0，却从未打 tag，
  #     客户按生产默认值 helm install 直接 ErrImagePull。
  # 两次的共性都是 **CI 全绿 ≠ 产物存在**：release job 只在 tag 上跑，而"打了 tag"这一步
  # 此前没有任何自动检查会回头核对产物。这里补上。
  verify-artifacts:
    name: 发布物回核（产物必须真实存在）
    runs-on: ubuntu-latest
    needs: [github-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: 安装 helm（钉版，与 ci.yml 的 chart 门禁同一版本）
        # 第 ④ 项判据要 `helm template` 渲染 chart 才能发现"清单引用了一个没人发布的镜像"。
        # runner 不预装 helm；沿用 ci.yml:405 的做法——从钉版的 alpine/helm 镜像里取二进制，
        # 不引外部安装脚本（那会让这道门禁的可用性取决于第三方站点的当下状态）。
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          docker run --rm -v "$HOME/.local/bin:/out" --entrypoint sh alpine/helm:3.14.4 \
            -c 'cp "$(command -v helm)" /out/helm && chmod +x /out/helm'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version --short
      - name: 五项判据核对（14 镜像 tag / .sig+.att / Release assets 与降级清单 / chart 引用 / 提权未重建）
        env:
          GHCR_ATTEMPTS: "5"
          # 第 ⑤ 项要拿"发布提交"与版本 tag 比 manifest digest。这里直接给 github.sha，
          # 不让脚本去 git 解析 tag——verify-artifacts job 的 checkout 深度不足以可靠拿到
          # tag 指向的提交，而解析不到时脚本会退成"未核对"，那就等于这道判据在 CI 里空转。
          RELEASE_SHA: ${{ github.sha }}
        # 三种结论分开处置（脚本自己已经分好，这里只是把它们接到 CI 语义上）：
        #   FAIL>0        ⇒ job 判红：核对到了缺失，属发布事故，必须人去看；
        #   UNVERIFIED>0  ⇒ 只出 warning 并放行：GHCR 是公网服务，传输失败可恢复，
        #                  重跑本 job 即可；把可恢复的抖动做成红色发布门禁，代价是
        #                  以后没人再看这条 job 的红。
        run: |
          set -uo pipefail
          VER="${GITHUB_REF_NAME#v}"
          out="$(bash deploy/scripts/verify-release-artifacts.sh "$VER" 2>&1)"; rc=$?
          printf '%s\n' "$out"
          summary="$(printf '%s\n' "$out" | grep '发布物验收' | tail -1)"
          fails="$(printf '%s' "$summary" | sed -n 's/.*FAIL=\([0-9][0-9]*\).*/\1/p')"
          unver="$(printf '%s' "$summary" | sed -n 's/.*UNVERIFIED=\([0-9][0-9]*\).*/\1/p')"
          fails="${fails:-0}"; unver="${unver:-0}"
          if [ "$fails" -gt 0 ]; then
            echo "::error::${VER} 的发布物核对到缺失（FAIL=${fails}）：客户按发布说明安装会拿不到产物（§19 / §32.9 就是这个形状）"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$unver" -eq 0 ] && [ -z "$summary" ]; then
            # 脚本没给出任何结论（崩溃、参数错、找不到 gh/helm 之外的意外）：
            # 这不是"未知"而是"没跑成"，必须判红——否则一条从未执行过的门禁会看起来像通过了。
            echo "::error::verify-release-artifacts.sh 未产出验收结论（exit=${rc}），无法判定发布物是否存在"
            exit 1
          fi
          if [ "$rc" -ne 0 ] || [ "$unver" -gt 0 ]; then
            # 注意：这里刻意用 ${GHCR_ATTEMPTS:-5} 而不是 ${GHCR_ATTEMPTS}——本 job 开了 set -u，
            # 未定义的变量会在这里直接把"警告并放行"变成 exit 1（本地跑分支时实测踩过）。
            # 一条负责区分"未知"与"缺陷"的门禁，不能因为自己的引用方式而伪装成缺陷。
            echo "::warning::有 ${unver} 项没能核对上（GHCR 传输失败，已重试 ${GHCR_ATTEMPTS:-5} 次）——既不是缺陷也不是通过，请重跑本 job"
            exit 0
          fi
          echo "✅ 发布物回核通过：${summary}"
