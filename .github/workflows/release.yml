name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # 镜像 tag 强制小写：Docker repository 名不允许大写（实测 GitHub owner 名
  # 'Levango7' 直接拼进 tag 报 invalid tag: repository name must be lowercase）。
  IMAGE_PREFIX: ghcr.io/levango7

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # keyless cosign 需要 id-token:write（Fulcio OIDC）；推送镜像需要 packages:write。
    # 不给 contents:write——本 job 不写仓库内容，权限按最小集给。
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        # 只列**常驻服务**：Dockerfile.service 假设 `services/<svc>/cmd/<svc>` 布局并以
        # `CMD ["svc"]` 起 HTTP 服务。`services/` 目录里不是所有模块都是服务——
        # tf-provider 是 Terraform 插件（main.go 里 plugin.Serve），装进容器会在启动瞬间
        # 打印"This binary is a plugin"并以码 1 退出，做成镜像就是一个必定 CrashLoop 的产物。
        # 它仍被 ci.yml 的 services job 逐个 `go build ./...` 覆盖（编译/测试不受影响）。
        # 这类"模块 vs 服务"的差集必须写进 validate-deploy-assets.sh 的豁免表（含理由），
        # 否则第 2/10 节会红——刻意不允许静默漂移。
        service:
          - auth-svc
          - device-svc
          - alert-svc
          - task-svc
          - config-svc
          - log-svc
          - aio-svc
          - autoscaler-svc
          - bot-svc
          - deploy-svc
          - gpu-svc
          - grafana-bridge
          - incident-svc
          - plugin-svc
          - portal-svc
          - runbook-svc
          - workflow-svc
    steps:
      - uses: actions/checkout@v5

      - name: 版本源一致性（发布标签必须等于 Chart.yaml appVersion）
        # 为什么必须在构建**之前**：第一次切 v0.9.2 时，Chart.yaml 的 version/appVersion、
        # values-production 的三处 tag、gitops segment、internal/version 全都还写着 0.9.0。
        # 产物本身不受影响（版本号由标签经 goreleaser {{.Version}} / --build-arg VERSION 注入），
        # 但客户按 values-production 装到的是 0.9.0 —— 「发出去的版本」与「清单声明的版本」不一致，
        # 而此前没有任何一处核对：门禁第 1 节只保证版本源彼此一致，它不知道正在发哪个标签。
        run: |
          set -euo pipefail
          WANT="${GITHUB_REF_NAME#v}"
          HAVE="$(grep -E '^appVersion:' deploy/helm/opsmesh/Chart.yaml | sed -E 's/.*"([^"]*)".*/\1/')"
          if [ "$WANT" != "$HAVE" ]; then
              echo "::error::发布标签 v${WANT} 与 Chart.yaml appVersion=${HAVE} 不一致：请先 bump 版本源（Chart / values-production / gitops segment / internal-version）再打标签"
              exit 1
          fi
          echo "版本源一致：appVersion=${HAVE} == 标签 v${WANT}"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        # 构建上下文=仓库根（services/<svc> 的 go.mod 均 replace opsmesh => ../..，
        # 上下文限单服务目录时容器内无主模块，go mod verify 必报
        # "replaced by ../../: open /go.mod"——首跑实测）。统一走根级
        # Dockerfile.service 模板，服务名经 --build-arg SERVICE 注入。
        run: |
          docker buildx build \
            --file Dockerfile.service \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            --build-arg SERVICE=${{ matrix.service }} \
            --tag ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} \
            --tag ${{ steps.meta.outputs.image }}:latest \
            --push \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      # 供应链证据：SBOM + 镜像签名。**放在 Trivy 之后**：不给会被判红的镜像留签名。
      # 为什么必须补在这里：核心镜像由 ci.yml 的 image job 签名，而这 17 个微服务镜像**只**
      # 由本 job 发布——此前本文件没有任何 cosign/SBOM 步骤，于是 v0.9.2 的 17 个镜像全部未签名
      # （实测 `auth-svc:0.9.2` 的 `.sig` → 404），抓取面上就是"两个核心镜像有签名、其余没有"。
      # 口径刻意与 ci.yml 逐字一致（同一 installer 钉同 commit、同一 cosign 版本、同一 keyless 模式），
      # 避免两条发布路径产出不同强度的证据。
      - name: 生成镜像 SBOM（syft v1.51.1，钉版）
        run: |
          set -euo pipefail
          command -v syft >/dev/null 2>&1 || {
              curl -sSfL "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz" -o /tmp/syft.tar.gz
              tar -xzf /tmp/syft.tar.gz -C /tmp syft
              sudo mv /tmp/syft /usr/local/bin/syft
          }
          syft version
          syft "${{ steps.meta.outputs.image }}:${{ github.sha }}" -o spdx-json > "sbom-${{ matrix.service }}-${GITHUB_SHA}.spdx.json"
          python3 -c 'import json,sys;print("SBOM 包条目数:", len(json.load(open(sys.argv[1]))["packages"]))' "sbom-${{ matrix.service }}-${GITHUB_SHA}.spdx.json"

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}-${{ github.sha }}.spdx.json
          retention-days: 30

      - name: 安装 cosign（官方 installer，钉死 commit）
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2
        with:
          cosign-release: 'v2.2.4'

      - name: cosign 签名镜像（keyless OIDC）
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          echo "已签名（keyless/OIDC）: ${{ steps.meta.outputs.image }}"

      - name: 自验证签名（签完必须验得过，否则这里就红）
        # 为什么要自验：`cosign sign` 变成空转（例如 OIDC 权限没给、或将来被人加 if 跳过）会让
        # job 保持绿色而镜像其实没签名——正是本项目反复抓到的"报告与实际不符"形态。
        # 用身份正则锁到本 workflow 文件，验不过直接失败。
        #
        # 为什么要重试（2026-09-27 首次真跑实测）：GHCR 存在**写后读窗口**——`cosign sign` 报告
        # `Pushing signature to: ghcr.io/levango7/<svc>` 并拿到 tlog 索引之后，紧接着的 verify
        # 仍报 `Error: no signatures found`；几分钟后复查同一个 digest 的 `.sig` → **200**。
        # 同一次运行里 aio-svc 等 4 个 job 的同一步骤是通过的，属竞态而非配置错。
        # 因此这里**退避重试而不是放宽判据**：5 次都验不过仍判红（那才是真没签上）。
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          for i in 1 2 3 4 5; do
              if cosign verify \
                  --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "${IMG}" >/dev/null; then
                  echo "签名已验证：${{ matrix.service }}（第 ${i} 次尝试）"
                  exit 0
              fi
              if [ "$i" = 5 ]; then
                  echo "::error::cosign verify 连续 5 次失败：不是 GHCR 写后读延迟，签名确实不在 ${IMG}"
                  exit 1
              fi
              echo "第 ${i} 次 verify 未命中（GHCR 写后读窗口），$((${i} * 10))s 后重试"
              sleep $((i * 10))
          done

  changelog:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          tag_prefix: ""
          release_branches: main

  github-release:
    runs-on: ubuntu-latest
    needs: [build-and-push, changelog]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.release_body }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
