name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint (H10 聚合静态分析)
        uses: golangci/golangci-lint-action@v6
        with:
          # 默认读取仓库根 .golangci.yml；args 限定扫描范围为全仓。
          args: ./...
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Test (unit, memory store, -race + coverage)
        # -race 启用竞态检测（H11）；-coverprofile 产出覆盖率（H12）；-timeout 120s 防单测挂死（问题8）。
        run: go test -race -timeout 120s -coverprofile=coverage.out ./...
      - name: 覆盖率门禁（整体 ≥40%，task 108）
        # task 108：整体覆盖率门禁。从 coverage.out 提取 total 行百分比，低于 40% 则 CI 失败。
        # awk 做浮点比较避免依赖 bc；gsub 去掉 % 号。
        run: |
          go tool cover -func=coverage.out > coverage.func.txt
          total=$(awk '/^total:/ {gsub("%","",$NF); print $NF}' coverage.func.txt)
          echo "整体覆盖率: ${total}%"
          awk -v t="$total" -v th=40 'BEGIN { if (t+0 < th) { printf "ERROR: 整体覆盖率 %.2f%% < %d%%\n", t, th; exit 1 } else { printf "OK: 整体覆盖率 %.2f%% >= %d%%\n", t, th } }'

      - name: 上传覆盖率到 Codecov (H12)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          # 未配 CODECOV_TOKEN 时不让 CI 失败（仅跳过上报），保证 fork/无 token PR 可跑。
          fail_ci_if_error: false

  # E1：SQL 后端集成测试 —— 默认 build-test 中 SQL Store 测试因无 DSN 被 Skip，
  # 此处起 mysql:8 + redis:7 真实后端，激活 OPSMESH_TEST_* 集成测试（报告 P1 缺口）。
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: opsmesh
          MYSQL_USER: opsmesh
          MYSQL_PASSWORD: opsmesh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # 真实后端 DSN：激活 sql_test.go 中 Skip 的集成用例（租户隔离 + schema 自举建表）。
      OPSMESH_TEST_MYSQL_DSN: "opsmesh:opsmesh@tcp(127.0.0.1:3306)/opsmesh?parseTime=true"
      OPSMESH_TEST_REDIS_ADDR: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Wait for MySQL
        run: until (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; do sleep 2; done
      - name: Wait for Redis
        run: until (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; do sleep 2; done
      - name: Run SQL/Redis store integration tests (含覆盖率，task 108)
        # task 108：加 -coverprofile 产出 store 包覆盖率，供后续 ≥60% 门禁消费。
        # 真实 mysql+redis 后端下 SQL store 用例全跑，store 包覆盖率比 build-test（仅 memory，32.9%）显著更高。
        run: go test -race -timeout 300s -v -coverprofile=store.cover.out ./internal/store/...
      - name: 覆盖率门禁（store 包 ≥60%，task 108）
        # task 108：store 包覆盖率门禁。从 store.cover.out 提取 total 行百分比，低于 60% 则 CI 失败。
        # 放 integration job（有真实后端）而非 build-test：store 包完整覆盖依赖 SQL+redis，build-test 无 DSN 仅 32.9%。
        # awk 做浮点比较避免依赖 bc；gsub 去掉 % 号。
        run: |
          store_total=$(go tool cover -func=store.cover.out | awk '/^total:/ {gsub("%","",$NF); print $NF}')
          echo "store 包覆盖率: ${store_total}%"
          awk -v t="$store_total" -v th=60 'BEGIN { if (t+0 < th) { printf "ERROR: store 包覆盖率 %.2f%% < %d%%\n", t, th; exit 1 } else { printf "OK: store 包覆盖率 %.2f%% >= %d%%\n", t, th } }'

  security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gosec (SAST 静态安全扫描)
        uses: securego/gosec@v2.22.5
        with:
          args: ./...
      - name: govulncheck（task 91：官方 Go 漏洞数据库扫描）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@v0.9.2  # task 91：钉死版本，防 @master 供应链漂移
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # M3-3A protobuf 契约守护：lint（STANDARD 规则）+ breaking（FILE 策略，禁止删字段/改类型/改字段号）。
  # buf 用 Docker 镜像，无需本机安装。breaking 对比 main 分支（PR 时检测破坏性变更）。
  # 生成 stub（internal/grpcx/pb/*.go）已提交仓库，本 job 只校验 .proto 契约，不重新生成。
  proto:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v4
        with:
          # breaking 检查需要对比 main 分支历史，fetch-depth=0 取全量历史。
          fetch-depth: 0
      - name: buf lint（STANDARD 规则集）
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking（FILE 策略，对比 main）
        # 仅在 PR 或非 main 分支 push 时检测破坏性变更（main 自身是基线，无对比意义）。
        if: github.ref != 'refs/heads/main'
        run: buf breaking --against ".git#branch=main,subdir=proto"

  # E4：镜像构建/推送 —— 推送路径须与 Helm values 的镜像引用逐字一致，
  # 否则 Argo CD 拉不到（registry.internal/opsmesh/opsmesh-binary:tag）。
  # 同时钉死 digest（不可变镜像），helm values.global.image.tag 在发布流程中替换为该 digest。
  # 注意：本 job 依赖仓库 secret REGISTRY/REGISTRY_USER/REGISTRY_TOKEN（私有镜像仓库凭证）。
  # 若未配置这些 secret，则整个 job 自动跳过（而非失败），保证 build-test/integration/security 仍可全绿。
  image:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check registry secret
        id: check
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "REGISTRY secret not set, skipping image build/push"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: 登录镜像仓库
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: 构建并推送（钉死 digest）
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 注意：repository 名 opsmesh-binary 必须与 charts/opsmesh-controlplane/values.yaml
          # 的 global.image.repository 逐字一致；REGISTRY 必须等于 global.imageRegistry。
          tags: ${{ secrets.REGISTRY }}/opsmesh-binary:${{ github.sha }}
      - name: Trivy 镜像扫描
        if: steps.check.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.9.2  # task 91：钉死版本，防 @master 供应链漂移
        with:
          image-ref: ${{ secrets.REGISTRY }}/opsmesh-binary:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      # E4 闭环：构建后把镜像 tag 钉死写回 GitOps chart（消除"发布流程手动替换"的部署脆弱点）。
      # 原 chart global.image.tag 硬编码 "0.1"，CI 却推 :sha，原样部署会去拉不存在的 :0.1。
      # 此处克隆独立 gitops 仓库，用 yq 把 tag 覆写为本Commit sha（与推送的 :sha 一致），
      # 并加守卫：写回后不得再含占位符 "0.1"，否则失败（证明写回真发生）。
      # 需仓库配置 secret：GITOPS_REPO（git@.../opsmesh-gitops.git）、GITOPS_PAT（可写 PAT）。
      # 若未配置这两个 secret，本步骤自动跳过（仅跳过写回，不影响镜像构建推送）。
      # TODO(H19): charts/opsmesh-controlplane/values.yaml 位于独立 GitOps 仓库，
      # 需先建立该 chart 仓库（含 opsmesh-controlplane chart 及 values.yaml）后本步骤方能生效。
      # 在 chart 仓库建立前，本步骤即使 secret 齐全也会因 clone 路径不存在而失败——
      # 故 chart 仓库的建立是本闭环的前置依赖（保留步骤以维持 E4 闭环设计完整性）。
      - name: 钉死镜像 tag 写回 GitOps values（E4 闭环）
        if: steps.check.outputs.skip != 'true' && env.GITOPS_REPO != '' && env.GITOPS_PAT != ''
        env:
          TAG: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "pinned tag = ${TAG}"
          echo "digest    = ${DIGEST}"
          command -v yq >/dev/null 2>&1 || {
            curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
          }
          git config --global user.email "ci@opsmesh"
          git config --global user.name "OpsMesh CI"
          git clone "https://${GITOPS_PAT}@${GITOPS_REPO}" /tmp/gitops
          cd /tmp/gitops
          yq -i '.global.image.tag = strenv(TAG)' charts/opsmesh-controlplane/values.yaml
          if grep -q 'tag: *"0.1"' charts/opsmesh-controlplane/values.yaml; then
            echo "ERROR: image tag 写回失败，仍含占位符 0.1"; exit 1
          fi
          git add charts/opsmesh-controlplane/values.yaml
          git commit -m "ci: pin opsmesh-binary to ${TAG}" && git push

  # Release：推送 v* tag 时触发 goreleaser 跨平台发布（linux/amd64+arm64）。
  # 产物：tar.gz 归档 + sha256 checksums + SBOM（配置见 .goreleaser.yml）。
  # 仅在 build-test/integration/security 全绿后执行，避免发布未验证产物。
  # fetch-depth: 0 取全量历史，goreleaser 据此生成 changelog。
  release:
    needs: [build-test, integration, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
