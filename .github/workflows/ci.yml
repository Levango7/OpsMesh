name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint (H10 聚合静态分析)
        uses: golangci/golangci-lint-action@v9
        with:
          # 默认读取仓库根 .golangci.yml；args 限定扫描范围为全仓。
          args: ./...
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Test (unit, memory store, -race + coverage)
        # -race 启用竞态检测（H11）；-coverprofile 产出覆盖率（H12）。
        # 超时从 120s 放宽到 300s：controlplane 非 race 实测 82s，
        # -race 开销约 2-5 倍，120s 在 CI 慢机器上必然超时（此前反复失败根因）。
        run: go test -race -timeout 300s -coverprofile=coverage.out ./...
      - name: Test (kafka tag, B-3 审计 WAL 兜底)
        # B-3：审计事件是合规关键数据，kafka 路径被 //go:build kafka 门控，默认构建零覆盖。
        # 此 step 显式传 -tags kafka 激活 internal/events/kafka*.go，跑 WAL 兜底/失败计数/重试测试。
        # 不含 -race/-cover：与主 Test 步骤解耦，失败不阻塞主覆盖率门禁，仅验证 kafka 标签构建与测试通过。
        # 依赖 github.com/segmentio/kafka-go（已在 go.mod）；测试用不可达 broker mock，无需真实 Kafka 容器。
        run: go test -tags kafka -timeout 120s ./internal/events/...
      - name: 覆盖率门禁（整体 ≥50%，原为 40%）
        # task 108：整体覆盖率门禁提升。从 coverage.out 提取 total 行百分比，低于 50% 则 CI 失败。
        run: |
          go tool cover -func=coverage.out > coverage.func.txt
          total=$(awk '/^total:/ {gsub("%","",$NF); print $NF}' coverage.func.txt)
          echo "整体覆盖率: ${total}%"
          awk -v t="$total" -v th=50 'BEGIN { if (t+0 < th) { printf "ERROR: 整体覆盖率 %.2f%% < %d%%\n", t, th; exit 1 } else { printf "OK: 整体覆盖率 %.2f%% >= %d%%\n", t, th } }'

      - name: 上传覆盖率到 Codecov (H12)
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # 已配置 CODECOV_TOKEN 时，上报失败阻断 CI；未配置 token（fork/无 secret PR）则不失败。
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  # E1：SQL 后端集成测试 —— 默认 build-test 中 SQL Store 测试因无 DSN 被 Skip，
  # 此处起 mysql:8 + redis:7 真实后端，激活 OPSMESH_TEST_* 集成测试（报告 P1 缺口）。
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: opsmesh
          MYSQL_USER: opsmesh
          MYSQL_PASSWORD: opsmesh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # 真实后端 DSN：激活 sql_test.go 中 Skip 的集成用例（租户隔离 + schema 自举建表）。
      OPSMESH_TEST_MYSQL_DSN: "opsmesh:opsmesh@tcp(127.0.0.1:3306)/opsmesh?parseTime=true"
      OPSMESH_TEST_REDIS_ADDR: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Wait for MySQL
        run: until (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; do sleep 2; done
      - name: Wait for Redis
        run: until (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; do sleep 2; done
      - name: Run SQL/Redis store integration tests (含覆盖率，task 108)
        # task 108：加 -coverprofile 产出 store 包覆盖率，供后续 ≥60% 门禁消费。
        # 真实 mysql+redis 后端下 SQL store 用例全跑，store 包覆盖率比 build-test（仅 memory，32.9%）显著更高。
        run: go test -race -timeout 300s -v -coverprofile=store.cover.out ./internal/store/...
      - name: 覆盖率门禁（store 包 ≥65%，原为 60%）
        run: |
          store_total=$(go tool cover -func=store.cover.out | awk '/^total:/ {gsub("%","",$NF); print $NF}')
          echo "store 包覆盖率: ${store_total}%"
          awk -v t="$store_total" -v th=65 'BEGIN { if (t+0 < th) { printf "ERROR: store 包覆盖率 %.2f%% < %d%%\n", t, th; exit 1 } else { printf "OK: store 包覆盖率 %.2f%% >= %d%%\n", t, th } }'

  security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gosec (SAST 静态安全扫描)
        uses: securego/gosec@v2.22.5
        with:
          args: ./...
      - name: govulncheck（task 91：官方 Go 漏洞数据库扫描）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@v0.9.2  # task 91：钉死版本，防 @master 供应链漂移
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # M3-3A protobuf 契约守护：lint（STANDARD 规则）+ breaking（FILE 策略，禁止删字段/改类型/改字段号）。
  # buf 用 Docker 镜像，无需本机安装。breaking 对比 main 分支（PR 时检测破坏性变更）。
  # 生成 stub（internal/grpcx/pb/*.go）已提交仓库，本 job 只校验 .proto 契约，不重新生成。
  proto:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v5
        with:
          # breaking 检查需要对比 main 分支历史，fetch-depth=0 取全量历史。
          fetch-depth: 0
      - name: buf lint（STANDARD 规则集）
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking（FILE 策略，对比 main）
        # 仅在 PR 或非 main 分支 push 时检测破坏性变更（main 自身是基线，无对比意义）。
        if: github.ref != 'refs/heads/main'
        run: buf breaking --against ".git#branch=main,subdir=proto"

  # E4：镜像构建/推送 —— 推送路径须与 Helm values 的镜像引用逐字一致，
  # 否则 Argo CD 拉不到（registry.internal/opsmesh/opsmesh-binary:tag）。
  # 同时钉死 digest（不可变镜像），helm values.global.image.tag 在发布流程中替换为该 digest。
  # 注意：本 job 依赖仓库 secret REGISTRY/REGISTRY_USER/REGISTRY_TOKEN（私有镜像仓库凭证）。
  # 若未配置这些 secret，则整个 job 自动跳过（而非失败），保证 build-test/integration/security 仍可全绿。
  image:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - name: Check registry secret
        id: check
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "REGISTRY secret not set, skipping image build/push"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - name: 登录镜像仓库
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: 构建并推送（钉死 digest）
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 注意：repository 名 opsmesh-binary 必须与 charts/opsmesh-controlplane/values.yaml
          # 的 global.image.repository 逐字一致；REGISTRY 必须等于 global.imageRegistry。
          tags: ${{ secrets.REGISTRY }}/opsmesh-binary:${{ github.sha }}
      - name: Trivy 镜像扫描
        if: steps.check.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.9.2  # task 91：钉死版本，防 @master 供应链漂移
        with:
          image-ref: ${{ secrets.REGISTRY }}/opsmesh-binary:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      # P2-4 供应链安全：对推送的镜像做 cosign 签名（key-based，非 keyless/OIDC）。
      # 条件守卫：registry secret 已配置（steps.check.outputs.skip != 'true'）且
      # COSIGN_PRIVATE_KEY secret 已配置（env.COSIGN_PRIVATE_KEY != ''）。
      # 若 COSIGN_PRIVATE_KEY 未配置，本步骤自动跳过，不影响 CI 流水线（与 image job 整体跳过机制一致）。
      # --tlog-upload=false：不上传透明日志（内网/无 OIDC 场景）；COSIGN_EXPERIMENTAL=1 启用非交互签名。
      - name: cosign 签名镜像（供应链安全，P2-4）
        if: steps.check.outputs.skip != 'true' && env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ secrets.REGISTRY }}/opsmesh-binary:${{ github.sha }}
        run: |
          echo "Signing image: ${IMAGE}"
          # 安装 cosign
          curl -sSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          # 签名镜像（keyless 模式需要 OIDC，这里用 key-based 签名）
          COSIGN_EXPERIMENTAL=1 cosign sign --key env://COSIGN_PRIVATE_KEY --tlog-upload=false ${IMAGE}
          echo "Image signed successfully"
      # E4 闭环：构建后把镜像 tag 钉死写回 GitOps chart。若 GitOps 仓库未就绪则安全跳过（不再失败）。
      # 启用条件：secrets.GITOPS_REPO 与 secrets.GITOPS_PAT 均已配置，且仓库中 charts/opsmesh-controlplane/values.yaml 存在。
      - name: 钉死镜像 tag 写回 GitOps values（E4，可选）
        if: steps.check.outputs.skip != 'true' && env.GITOPS_REPO != '' && env.GITOPS_PAT != ''
        env:
          TAG: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "pinned tag = ${TAG}, digest = ${DIGEST}"
          command -v yq >/dev/null 2>&1 || {
            curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
          }
          git config --global user.email "ci@opsmesh"
          git config --global user.name "OpsMesh CI"
          if ! git clone --depth 1 "https://${GITOPS_PAT}@${GITOPS_REPO}" /tmp/gitops; then
            echo "::warning::GitOps 仓库 clone 失败（未创建或无权限），跳过写回"
            exit 0
          fi
          cd /tmp/gitops
          if [ ! -f charts/opsmesh-controlplane/values.yaml ]; then
            echo "::warning::charts/opsmesh-controlplane/values.yaml 不存在，跳过（待 chart 仓库初始化）"
            exit 0
          fi
          yq -i '.global.image.tag = strenv(TAG)' charts/opsmesh-controlplane/values.yaml
          if grep -q 'tag: *"0.1"' charts/opsmesh-controlplane/values.yaml; then
            echo "::error::image tag 写回后仍含占位符 0.1"
            exit 1
          fi
          git add charts/opsmesh-controlplane/values.yaml
          git commit -m "ci: pin opsmesh-binary to ${TAG}" || exit 0
          git push || { echo "::warning::git push 失败，跳过"; exit 0; }

  # Release：推送 v* tag 时触发 goreleaser 跨平台发布（linux/amd64+arm64）。
  # 产物：tar.gz 归档 + sha256 checksums + SBOM（配置见 .goreleaser.yml）。
  # 仅在 build-test/integration/security 全绿后执行，避免发布未验证产物。
  # fetch-depth: 0 取全量历史，goreleaser 据此生成 changelog。
  release:
    needs: [build-test, integration, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # G3/B-5：前端 CI —— Vue3 Enterprise（web/enterprise）。
  # npm ci 严格按 lockfile 安装；lint 静态检查；build 产出生产包；vitest run 跑单测（非 watch 模式）。
  # setup-node cache-dependency-path 钉死 web/enterprise/package-lock.json，缓存 npm 依赖加速 CI。
  # 与后端 build-test 解耦（无 needs），前端/后端可并行跑，互不阻塞。
  frontend:
    name: Frontend (Vue3 Enterprise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/enterprise/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web/enterprise
      - name: Lint
        run: npm run lint
        working-directory: web/enterprise
      - name: Build
        run: npm run build
        working-directory: web/enterprise
      - name: Test
        run: npx vitest run
        working-directory: web/enterprise
      # Playwright mock 用例（现有 5 个 spec，覆盖页面渲染与交互）
      # 必须先 playwright install 下载浏览器，否则 CI 上浏览器二进制不存在（78 用例全挂）。
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web/enterprise
      - name: E2E (mock)
        run: npx playwright test
        working-directory: web/enterprise

  # 真实后端 E2E：docker compose 拉起整栈（controlplane+mysql+redis+agent），
  # 用 playwright.real.config.js 跑 e2e-real/，不 mock 任何 API。
  # 不阻塞 frontend job；失败告警提示有人改坏了真实前后端契约。
  e2e-real:
    name: E2E (real backend)
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/enterprise/package-lock.json
      - name: 启动整栈（docker compose）
        env:
          MYSQL_ROOT_PASSWORD: ciroot
          MYSQL_USER: opsmesh
          MYSQL_PASSWORD: opsmesh
          OPSMESH_JWT_SECRET: ci-e2e-jwt-secret-key-min-32-bytes-0123456789abcdef
        run: docker compose up -d --wait
      - name: 健康检查
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          echo "controlplane 未在 60s 内就绪"; docker compose logs; exit 1
      - name: 跑真实后端 E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          cd web/enterprise
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.real.config.js
      - name: 清理
        if: always()
        run: docker compose down -v
