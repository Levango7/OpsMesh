# OpsMesh golangci-lint 配置（golangci-lint v2，golangci/golangci-lint-action@v9）
#
# CI（.github/workflows/ci.yml）通过 golangci/golangci-lint-action@v9 引用本文件，
# args: ./... 全仓扫描。本配置由 v1 经 `golangci-lint migrate` 迁移而来（v2 格式）。
#
# 设计取舍（v2 收敛批次，2026-08-14）：
# - fieldalignment 是 v2 新增的 govet 子检查（v1 无），属性能建议非正确性，
#   存量代码一次性重排字段风险大（会破坏位置初始化测试），显式排除。
# - noctx/prealloc/wastedassign/durationcheck/contextcheck 等"建议型"linter
#   存量告警量大（noctx 412 项）且 v1 时代 CI 从未真正执行到 lint 阶段，
#   本轮收敛为"当前代码真实可达"的核心集，避免 CI 从首次执行就长期飘红。
#   存量债登记：docs/tech-debt.md TD-50（lint 存量收敛）。
# - 保留正确性/安全/风格核心：errcheck/govet/staticcheck/ineffassign/unused/
#   gosec/revive/misspell/bodyclose/sqlclosecheck/copyloopvar。
# - 测试文件放宽 errcheck/gosec/unparam（_test.go 中常故意忽略错误/含弱口令 fixture）。
# - errorlint：v1 时代从未真正执行（CI 从未跑到 lint），存量 19 项为历史债
#   （==/!= 比较 sentinel error），登记 TD-51 后续统一 errors.Is 改造；本轮先移除 enable。
#
# 注：gofmt/goimports 在 formatters 节。本地 Windows（core.autocrlf=true）
# 会因 CRLF 报 gofmt 噪音，属环境差异非代码问题（.gitattributes 已强制 Go 文件 LF）。

version: "2"
run:
  go: "1.26"
linters:
  default: standard
  enable:
    - bodyclose        # http.Response.Body 必须 Close
    - copyloopvar      # 循环变量拷贝检查（Go 1.22 loopvar 兼容）
    - gosec            # 安全静态分析
    - misspell         # 注释/字符串拼写
    - revive           # 替代 golint 的风格检查
    - sqlclosecheck    # sql.Rows/Stmt/Conn 必须 Close
  settings:
    errcheck:
      check-type-assertions: true
      # check-blank 启用：`_ =` 形式忽略返回值必须显式豁免，
      # 避免静默吞错。设计上可忽略的调用通过 exclude-functions 精细豁免，
      # 其余 `_ =` 必须有正当理由（已在 exclusions.rules 中按路径/text 豁免）。
      check-blank: true
      # exclude-functions：按函数豁免"设计上可忽略返回值"的调用——
      #   events.Bus.Publish：事件总线发布失败是可容忍的（noop/log 后端恒成功，
      #     调用方不因发布失败中断主流程）；
      #   bufio.Writer.WriteString / (io.Writer).Write：缓冲写入失败由后续
      #     Flush/错误处理兜底，单独检查每行写入是噪音。
      exclude-functions:
        - (opsmesh/internal/events.Bus).Publish
        - (*bufio.Writer).WriteString
        - (*bytes.Buffer).Write
        - (io.Writer).Write
        # json.Marshal 仅在遇到 channel/func 等不支持类型时才报错；
        # 仓库持久化/传输模型均为纯数据结构（map/slice/struct），序列化失败属不可能事件。
        - encoding/json.Marshal
        # HTTP 响应写回：状态码已发出后调用方无法补救（只能记日志），
        # 与 std-error-handling 预设对 net/http 的处理一致。
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        # csv.Writer 单行 Write 的错误在 Flush 后经 Error() 汇总检查（导出处已检查）。
        - (*encoding/csv.Writer).Write
    govet:
      enable-all: true
      # shadow 是 Go 官方 vet 默认关闭的争议检查（err 变量遮蔽在闭包/作用域
      # 里是常见且无害的写法），v1 时代 CI 从未执行到 lint，存量遮蔽遍布测试，
      # 整体排除避免噪音淹没真实 govet 问题。
      disable:
        - shadow
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      rules:
        - name: exported
          disabled: true  # MVP 不强制导出注释
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件放宽：常故意忽略 err / 含弱口令 fixture / 用空参数占位 /
      # 构造 Server struct 时给未读字段赋 nil（govet unusedwrite 子检查：
      # 测试构造惯例，结构体字段在真实链路才被读取，测试只断言个别字段/接口契约）。
      # 注：unusedwrite 归属 govet，须以 govet 名义豁免（配 path 限定测试文件）。
      - linters:
          - errcheck
          - gosec
          - unparam
          - wastedassign
        path: _test\.go
      - linters:
          - govet
        path: _test\.go
        text: "unusedwrite:"
      # main.go 中 os.Exit 后的 fmt.Fprintf 返回值无需检查。
      - linters:
          - errcheck
        path: cmd/opsmesh/main\.go
      # fieldalignment 是 golangci-lint v2 新增的 govet 子检查（v1 无此检查），
      # 属于性能建议而非正确性问题，存量代码一次性全改风险大，显式关闭。
      - linters:
          - govet
        text: "fieldalignment:"
      # SA1019: grpc.DialContext 已 deprecated 但官方注明"整个 1.x 都支持"，
      # 迁移到 grpc.NewClient 涉及连接语义变化（NewClient 无阻塞拨号语义、
      # 返回前不建连），agent 连接缓存与 gRPC 测试的惰性建连依赖现状，有意保留。
      # 注：告警文本为 "grpc.DialContext"（不带 google.golang.org/ 前缀）。
      - linters:
          - staticcheck
        text: "SA1019: grpc\\.DialContext is deprecated"
      # SA1012: logx.Trace 专项测试故意传 nil 验证不 panic（该用例即契约）。
      - linters:
          - staticcheck
        path: internal/logx/logx_test\.go
        text: "SA1012"
      # errcheck: defer tx.Rollback() 无法检查返回值，Go 惯用法（Commit 后为 no-op）。
      - linters:
          - errcheck
        text: "tx.Rollback"
      # === errcheck 精细豁免（设计上可忽略返回值的调用，与 exclude-functions 配套）===
      # agent 指标采集的服务探测：sc qc / systemctl is-enabled 退出码非 0 是常态
      # （服务不存在/disabled 即非 0），输出内容仍需解析，错误本身无信息量。
      - linters:
          - errcheck
        path: internal/agent/metrics_collect\.go
        text: "os/exec"
      # gRPC failover balancer 失败通知：MarkFailed 失败仅表示本次不切换主备，
      # 下次 invoke 会再次触发，无补救动作可做。
      - linters:
          - errcheck
        text: "MarkFailed"
      # logstore 日志桥接（agent 日志上报 / 任务结果落地）：日志落地失败不影响主流程。
      - linters:
          - errcheck
        text: "ls\\.Append"
      # 静默规则引擎同步（store 已落库成功，内存索引同步失败下次重启自愈）。
      - linters:
          - errcheck
        text: "alertSilencer\\."
      # K8s 连接测试失败时回写 offline 状态：状态回写失败仅影响面板展示，
      # 测试结果已正常返回给前端。
      - linters:
          - errcheck
        path: internal/controlplane/k8s_cluster\.go
        text: "SaveK8sCluster"
      # 灰度自动推进后台循环：checkAndAdvance 内部已 recordError 记录并自监控终态退出。
      - linters:
          - errcheck
        text: "checkAndAdvance"
      # 工作流运行历史写入：历史记录失败不影响主流程（Trigger 主链路已成功）。
      - linters:
          - errcheck
        text: "store\\.CreateRun"
      # provision SSH 超时/取消时向远端发 SIGTERM：会话即将 Close，信号失败无意义。
      - linters:
          - errcheck
        text: "session\\.Signal"
      # tenant 配额中间件的用量记账：EnforceQuota 通过后记账失败不影响放行
      # （下个周期会计入，语义为尽力而为），`_ =` 显式忽略即为设计意图。
      - linters:
          - errcheck
        text: "m\\.TrackUsage"
      # 静态服务发现启动注册：纯内存 map 写入不会失败（接口保留给未来 etcd 后端）。
      - linters:
          - errcheck
        path: internal/discovery/static\.go
        text: "d\\.Register"
      # G104（Errors unhandled）精细豁免：原 ci.yml gosec 整类排除 G104，
      # 现下放至 golangci-lint 做精细控制。以下路径/模式为设计上可忽略返回值的调用，
      # 与 errcheck exclude-functions 对齐（events.Bus.Publish / bufio/io 写入 / defer Rollback）。
      # 测试文件已通过 _test\.go 规则整体放宽 gosec，此处只覆盖生产代码。
      - linters:
          - gosec
        text: "G104"
        path: internal/events/bus\.go
      - linters:
          - gosec
        text: "G104"
        path: internal/store/sql\.go
      # G202: SQL 字符串拼接——仓库 SQL 均用参数占位符（? + args），
      # 拼接的只是固定 SQL 片段（WHERE 子句结构），无用户输入直接入 SQL，安全。
      - linters:
          - gosec
        text: "G202"
      # G204: agent/helm 的本质职责就是执行命令（exec.Command），
      # 参数来自控制面下发的受信任务，非用户直接输入，属产品核心功能。
      - linters:
          - gosec
        text: "G204"
      # G101: auth.go 的"credentials"实为 cookie 名称常量（opsmesh_at/rt），非凭据，误报。
      - linters:
          - gosec
        path: internal/controlplane/auth\.go
        text: "G101"
      # G124: cookie Secure 由 cfg.CookieSecure 显式控制（HTTPS 部署才置位），
      # 内网明文场景需 false，属有意识设计（README 生产加固章节有说明）。
      - linters:
          - gosec
        path: internal/controlplane/auth\.go
        text: "G124"
      # G106: SSH InsecureIgnoreHostKey 受 --provision-ssh-known-hosts 配置约束
      # （README 明确"生产务必配置"），空值回退为忽略是设计取舍，非静默漏洞。
      - linters:
          - gosec
        text: "G106"
      # G115: 值域安全转换——grpcx/stub.go 的 int→int32 是 protobuf 兼容层
      # 字段号/长度转换（值域有界），metrics_collect 的 uint64→int64 同理。
      - linters:
          - gosec
        text: "G115"
      # G704: 遗留 TODO 标记检查（存量 TODO 登记在 docs/tech-debt.md，非本轮范围）。
      - linters:
          - gosec
        text: "G704"
      # G118: SSH 推送为后台 goroutine，用 request context 会在 handler 返回时
      # 被取消导致推送中断，Background 是正确选择（gosec 规则不适用于 goroutine 语义）。
      - linters:
          - gosec
        text: "G118"
      # G404（弱随机数）—— device-sim：模拟数据生成工具，随机性本身就是职责
      # （伪造设备指标/状态/IP/序列号），输出用于测试与演示环境，非加密场景，
      # crypto/rand 反而拖慢模拟吞吐，整目录豁免。
      - linters:
          - gosec
        text: "G404"
        path: cmd/device-sim/
      # G404（弱随机数）—— pkg/retry：重试退避抖动（jitter）只需打散重试风暴，
      # 不需要不可预测性（攻击者无法利用抖动值），math/rand 是退避抖动的业界
      # 常态实现（grpc-go/awsgosdk 同样如此），非加密场景。
      - linters:
          - gosec
        text: "G404"
        path: pkg/retry/
      # G201（SQL 格式化）—— sql_slo.go 的 SLI 指标查询：拼入 SQL 的 column
      # 来自 metricColumn() 白名单 switch（仅返回固定列名 cpu_usage/latency 等，
      # 任意输入返回 "" 直接短路），用户可控的 metricName 永远进不了 SQL 字符串；
      # tenant_id/时间条件仍走 ? 参数占位符，无注入面。
      - linters:
          - gosec
        text: "G201"
        path: internal/store/sql_slo\.go
      # G705: XSS 污点分析误报——dashboard.go 写入的 data 来自 webFS.ReadFile
      # （go:embed 编译期打包的受信静态资源），非用户输入，无 XSS 面。
      - linters:
          - gosec
        path: internal/controlplane/dashboard\.go
        text: "G705"
      # ST1003: grpcx 手写 ServiceDesc 故意沿用 protoc 生成的命名
      # （Registration_ServiceDesc / _Registration_*_Handler），与 protobuf
      # 契约/文档一致，改名会破坏与代码生成 stub 的对应关系。
      - linters:
          - staticcheck
        path: internal/grpcx/service\.go
        text: "ST1003"
      # SA1012: 测试中传 nil context 到参数为 `_ context.Context` 的接口
      # （如 MemoryCiStore.GetCIs 忽略 ctx），nil 无害且多数为既有断言。
      - linters:
          - staticcheck
        path: _test\.go
        text: "SA1012"
      # grpcx/service.go 是手写 protoc 风格 ServiceDesc 模板：`srv.(RegistrationServer)`
      # 类型断言是 gRPC 框架约定（srv 类型由 grpc.Server 保证），protoc 生成代码
      # 同样如此；check-type-assertions 对此模板语义误报，整文件豁免 errcheck。
      - linters:
          - errcheck
        path: internal/grpcx/service\.go
    paths:
      - .*\.gen\.go$
      - .*\.pb\.go$
      - vendor
      - docs
      - third_party$
      - builtin$
      - examples$
      - node_modules
      - web/enterprise/node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - opsmesh
  exclusions:
    generated: lax
    paths:
      - .*\.gen\.go$
      - .*\.pb\.go$
      - vendor
      - docs
      - third_party$
      - builtin$
      - examples$
      - node_modules
      - web/enterprise/node_modules
