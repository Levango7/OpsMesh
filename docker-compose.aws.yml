# AWS 本地模拟 (LocalStack)
# 使用方法：docker compose -f docker-compose.aws.yml up -d
version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ec2,ec2-instance,iam,lambda,dynamodb,sqs,sns,ses,kinesis,redshift,es,cloudformation,cloudformation,cloudwatch,apigateway,route53,r53,r53r,route53resolver,directconnect
      - DEBUG=1
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack
    networks:
      - localstack-net

networks:
  localstack-net:
    driver: bridge

volumes:
  localstack-data:
