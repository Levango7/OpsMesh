# OpsMesh 一键体验环境（开发/演示用，非生产）。
# 生产部署请使用 Helm Chart + values-production.yaml，配合外部托管 MySQL/Redis、TLS 证书、认证鉴权等。
# 启动：docker compose up -d
# 停止：docker compose down
# 清理数据卷：docker compose down -v
#
# 服务拓扑：
#   controlplane (HTTP 8080 / gRPC 9090 / metrics 9091) → mysql:3306 + redis:6379
#   agent → controlplane:8080
services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsmesh/controlplane:dev
    command:
      - --mode=controlplane
      - --store=mysql
      - --mysql-dsn=${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:-opsmesh}@tcp(mysql:3306)/opsmesh?parseTime=true
      - --redis-addr=redis:6379
      - --advertise-addr=http://controlplane:8080
      # --demo：保持默认 admin/admin123 可登录（非 demo 模式会随机化 admin 密码，
      # 导致 e2e-real 登录 401）。compose 本就是开发/演示用途（README 已注明非生产）。
      - --demo
    ports:
      - "8080:8080"   # HTTP API / Web UI
      - "9090:9090"   # gRPC
      - "9091:9091"   # Prometheus metrics
    # 生产 JWT 密钥：本一键体验环境为开发演示，可留空（dev 随机兜底）；
    # 若当生产使用，务必注入 32 字节强随机密钥（openssl rand -hex 32）。
    environment:
      OPSMESH_JWT_SECRET: ${OPSMESH_JWT_SECRET:-}
      # ── 安全相关 flag 环境变量映射（config.go 中对应 flag）──
      # 开发/演示环境默认值见各项注释；生产部署请改用 Helm chart + values-production.yaml。
      #
      # Cookie Secure（--cookie-secure）：控制 at/rt HttpOnly Cookie 的 Secure 属性。
      # 开发默认 false（明文 HTTP 下 Secure Cookie 会被浏览器拒绝回传，导致会话丢失）；
      # 生产 HTTPS 环境务必 true（防中间人窃取会话）。
      OPSMESH_COOKIE_SECURE: ${OPSMESH_COOKIE_SECURE:-false}
      #
      # 公开注册开关（--public-register）：true=开放 /api/v1/auth/register 但新用户须管理员审批；
      # false=关闭公开注册（仅管理员可创建用户）。开发默认 true，生产默认 false。
      OPSMESH_PUBLIC_REGISTER: ${OPSMESH_PUBLIC_REGISTER:-true}
      #
      # 公开注册免审批（--allow-public-register）：true=注册即激活并立即签发 token（仅演示/内网受信）；
      # false=所有注册走 pending 审批流程（安全基线）。默认 false，生产务必关闭。
      OPSMESH_ALLOW_PUBLIC_REGISTER: ${OPSMESH_ALLOW_PUBLIC_REGISTER:-false}
      #
      # 生产模式（--production）：开启后默认 require-auth=true、cookie-secure=true、grpc-require-signature=true，
      # 并对 store=memory 强告警、强制 TLS 与 jwt-secret≥32 字节。开发环境不开启。
      # OPSMESH_PRODUCTION: "false"
      #
      # 强制鉴权（--require-auth）：要求网关注入 X-Tenant-ID，缺失则拒绝。开发默认 false。
      # OPSMESH_REQUIRE_AUTH: "false"
      #
      # 联邦共享 HMAC 密钥（--federation-secret）：联邦 peer 间签名/验签身份头，防跨不可信网段伪造。
      # 启用联邦（OPSMESH_FEDERATION_PEERS 非空）时必填。空=不签名（仅内网信任）。
      # OPSMESH_FEDERATION_SECRET: ""
      # OPSMESH_FEDERATION_PEERS: "http://peer1:8080,http://peer2:8080"
      #
      # 自动纳管 install token HMAC 密钥（--provision-secret）：多副本需一致；空=本实例随机生成。
      # OPSMESH_PROVISION_SECRET: ""
      #
      # gRPC agent 身份绑定（--grpc-require-signature）：强制 agent 请求携带 HMAC 签名。
      # demo 模式强制关闭；生产模式默认开启。开发默认 false。
      # OPSMESH_GRPC_REQUIRE_SIGNATURE: "false"
      #
      # 信任反向代理（--trust-proxy）：开启后 clientIP 取 X-Forwarded-For 首段。
      # 默认 false=仅用 RemoteAddr 防 XFF 伪造绕过限流。仅当有可信 LB/网关前置时启用。
      # OPSMESH_TRUST_PROXY: "false"
      #
      # JWT 验签公钥（--jwt-public-key，RS256）：网关剥离 + 内核二次校验的纵深防御。空=关闭回退头注入。
      # OPSMESH_JWT_PUBLIC_KEY: ""
      # OPSMESH_JWT_ISSUER: ""
      #
      # metrics 访问控制（--metrics-allow-cidr）：CIDR 白名单，空=不限制。生产建议配置内网监控网段。
      # OPSMESH_METRICS_ALLOW_CIDR: "10.0.0.0/8"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # distroless/static-debian12 无 curl/wget/sh，无法用 CMD-SHELL 探 /healthz，
    # 也无法用 ["CMD-SHELL","exit 0"] 跳过（无 sh）。故采用 Go 二进制内置 --health
    # 子命令做真实 /healthz 探测（不依赖 curl/shell，仅依赖二进制自身）。
    # 实现：cmd/opsmesh/main.go 中 --health 短路 → GET http://localhost:8080/healthz，
    # 200→exit 0，否则 exit 1。3s 超时与下方 timeout 对齐。
    healthcheck:
      test: ["CMD", "/usr/local/bin/opsmesh", "--health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # 可选：挂载 TLS 证书启用 HTTPS（需同时在 command 追加 --tls-cert/--tls-key 参数）
    # volumes:
    #   - ./tls/server.crt:/etc/opsmesh/tls/server.crt:ro
    #   - ./tls/server.key:/etc/opsmesh/tls/server.key:ro
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      # 生产/正式环境必须显式注入 MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD（见 .env 或外部环境），
      # 缺失时 fail-fast（docker compose 对未设置的 .Var 会告警；下方用 :- 默认值仅为本地一键体验便利，
      # 正式部署请复制 .env.example 为 .env 并改成强口令）。修复原硬编码弱口令风险。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: opsmesh
      MYSQL_USER: ${MYSQL_USER:-opsmesh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opsmesh}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用环境变量密码（CMD-SHELL 才能展开 ${MYSQL_ROOT_PASSWORD}）。
      # 曾硬编码 -prootpass：与外部注入的 MYSQL_ROOT_PASSWORD 不一致时
      # healthcheck 永远失败 → controlplane 的 service_healthy 依赖永不满足，
      # 与 store 启动竞态叠加导致 seedRBAC 未执行、admin 用户缺失。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: opsmesh/agent:dev
    command:
      - --mode=agent
      - --control-addr=http://controlplane:8080
      - --segment=default
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data: