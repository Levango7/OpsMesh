<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OpsMesh 控制台</title>
    <style>
        body { font-family: system-ui; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #38bdf8; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
        .card h2 { color: #38bdf8; font-size: 16px; margin-bottom: 12px; }
        input { padding: 8px 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; width: 200px; }
        button { padding: 8px 16px; border-radius: 4px; border: none; background: #0284c7; color: white; cursor: pointer; margin-right: 8px; }
        button:hover { background: #0369a1; }
        .result { background: #0f172a; padding: 12px; border-radius: 4px; margin-top: 12px; font-size: 12px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
        .ok { color: #34d399; }
        .err { color: #f87171; }
        .service { display: inline-block; padding: 4px 8px; margin: 4px; border-radius: 4px; font-size: 12px; }
        .service.ok { background: #064e3b; color: #34d399; }
        .service.err { background: #450a0a; color: #f87171; }
        .row { margin-bottom: 8px; }
        .row label { display: inline-block; width: 60px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpsMesh 控制台</h1>
        <div class="card">
            <h2>服务状态</h2>
            <div id="services">检查中...</div>
        </div>
        <div class="card">
            <h2>用户认证</h2>
            <div class="row"><label>用户名</label><input id="username" value="viewer"></div>
            <div class="row"><label>密码</label><input id="password" type="password" value="viewer123"></div>
            <div class="row">
                <button onclick="doLogin()">登录</button>
                <button onclick="doRegister()">注册</button>
                <button onclick="doChangePassword()">改密</button>
            </div>
            <div class="result" id="result">未登录</div>
        </div>
    </div>

    <script>
        var API = 'http://localhost:8080';
        var token = '';
        var changeToken = '';

        function doLogin() {
            var u = document.getElementById('username').value;
            var p = document.getElementById('password').value;
            document.getElementById('result').textContent = '登录中...';
            
            fetch(API + '/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.token) {
                    token = data.token;
                    document.getElementById('result').className = 'result ok';
                    document.getElementById('result').textContent = '登录成功! Token: ' + data.token.substring(0, 30) + '...';
                } else if (data.mustChangePassword) {
                    changeToken = data.changePasswordToken;
                    document.getElementById('result').className = 'result err';
                    document.getElementById('result').textContent = '需改密! 点击改密按钮';
                } else {
                    document.getElementById('result').className = 'result err';
                    document.getElementById('result').textContent = '失败: ' + JSON.stringify(data);
                }
            })
            .catch(function(e) {
                document.getElementById('result').className = 'result err';
                document.getElementById('result').textContent = '错误: ' + e.message;
            });
        }

        function doRegister() {
            var u = document.getElementById('username').value;
            var p = document.getElementById('password').value;
            document.getElementById('result').textContent = '注册中...';
            
            fetch(API + '/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p, email: u + '@test.com' })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                document.getElementById('result').className = 'result ok';
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            })
            .catch(function(e) {
                document.getElementById('result').className = 'result err';
                document.getElementById('result').textContent = '错误: ' + e.message;
            });
        }

        function doChangePassword() {
            var p = document.getElementById('password').value;
            document.getElementById('result').textContent = '改密中...';
            
            fetch(API + '/api/v1/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldPassword: p, newPassword: 'NewPass123', changePasswordToken: changeToken })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                document.getElementById('result').className = data.token ? 'result ok' : 'result err';
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            })
            .catch(function(e) {
                document.getElementById('result').className = 'result err';
                document.getElementById('result').textContent = '错误: ' + e.message;
            });
        }

        function checkServices() {
            var services = [
                { name: 'Controlplane', port: 8080 },
                { name: 'Auth-svc', port: 8100 },
                { name: 'Device-svc', port: 8101 },
                { name: 'Task-svc', port: 8102 },
                { name: 'Alert-svc', port: 8103 }
            ];
            var html = '';
            services.forEach(function(s) {
                var url = 'http://localhost:' + s.port + '/health';
                if (s.port === 8080) url = 'http://localhost:8080/healthz';
                fetch(url, { mode: 'no-cors' })
                .then(function() {
                    html += '<span class="service ok">' + s.name + ' ✓</span>';
                    document.getElementById('services').innerHTML = html;
                })
                .catch(function() {
                    html += '<span class="service err">' + s.name + ' ✗</span>';
                    document.getElementById('services').innerHTML = html;
                });
            });
        }

        checkServices();
        setInterval(checkServices, 5000);
    </script>
</body>
</html>
