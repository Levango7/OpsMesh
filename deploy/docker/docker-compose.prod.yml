# OpsMesh 生产部署 —— 控制面直连 HTTPS（默认形态）
#
# 用法：
#   bash scripts/deploy.sh init      # 生成 .env（随机口令/密钥）+ 自签证书
#   bash scripts/deploy.sh up        # = docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# 必需变量（全部无内置默认值，缺失时 compose 直接报错，而不是拿预置弱口令跑起来）：
#   OPSMESH_VERSION        镜像标签（禁止 latest 浮动标签）
#   OPSMESH_ADVERTISE_ADDR 控制面对外可达地址，用于拼接 bootstrap 安装命令
#   MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / REDIS_PASSWORD
#   JWT_SECRET（≥32 字节）/ ENCRYPTION_KEY（base64 的 32 字节）
#   ADMIN_PASSWORD（初始 admin 口令）/ GRAFANA_ADMIN_PASSWORD / CONFIG_ENCRYPTION_KEY
#   生成：openssl rand -base64 48（JWT_SECRET）/ openssl rand -base64 32（其余）
#
# 项目名：见文件顶部 name: opsmesh。
#   不写 name 时 Compose 用「目录名」当项目名（本目录名是 docker）——任何同样放在名为
#   docker 的目录下的 compose 项目都会与此处共享项目名，`docker compose down
#   --remove-orphans` 会把那个项目的容器一并删除（实测：本机 `compose ps -a` 曾列出
#   17 个属于另一套 Dify 栈的容器）。显式 name 后各栈互不可见。
#
# 版本要求：Docker Compose ≥ 2.24.4（name 字段 + 反代 overlay 的 !override 标签）。
#
# TLS：本文件为「控制面直连 HTTPS」形态——浏览器与 agent 直连 8080/9090，
#   证书挂载自 ${OPSMESH_TLS_DIR}（默认 ./certs，需含 tls.crt + tls.key）。
#   agent 侧需以 --client-ca=<ca> 信任该证书（自签场景），否则 gRPC 校验失败。
#   若由 Nginx/Ingress 终止 TLS，叠加反代 overlay：
#     docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.prod-proxy.yml up -d
#   （overlay 用 !override 重置端口映射）
#
# 端口暴露策略：仅控制面 HTTP(8080)/gRPC(9090) 对外；MySQL/Redis/监控组件/各微服务
#   端口仅绑 127.0.0.1（运维经 SSH 隧道或 docker exec 访问），避免内网直连数据库。
#
# MySQL 库规划（表名冲突规避）：
#   - `opsmesh` 主库：仅 controlplane（主模块 internal/store 建表）使用，MYSQL_DATABASE 保持 opsmesh。
#   - `opsmesh_<svc>` 独立库：device/task/alert/config/log 各微服务使用。
#     原因：controlplane 主模块与微服务的 devices/users/agents/alerts/ci_items 等表名相同但结构不一致，
#     共库时 CREATE TABLE IF NOT EXISTS 会静默让位给先建表的一方，后启动服务的 INSERT 因列不匹配而失败。
#     微服务各自 schema.sql 均为 CREATE TABLE IF NOT EXISTS，服务启动 initSchema 自建表，
#     只需预建库并授权——已由 mysql 服务挂载 scripts/init-databases.sql 到
#     /docker-entrypoint-initdb.d/ 自动完成（仅首次初始化数据卷时执行）。
#     注意：不要改挂 scripts/init-mysql.sql（那是含全量表 DDL 的单库合并脚本，
#     会让结构不一致的同名表抢先落地，详见 init-databases.sql 内注释）。
#
# 镜像构建（踩坑记录）：
#   微服务统一用「仓库根上下文 + 根级 Dockerfile.service + --build-arg SERVICE=<svc>」，
#   与 .github/workflows/release.yml 同一契约。原因：services/*/go.mod 均含
#   `replace opsmesh => ../..`，若把 context 限定在 services/<svc> 单服务目录，
#   容器内没有主模块，`go mod verify` 必失败——实测报
#   `go: github.com/Levango7/OpsMesh@v0.0.0-... (replaced by ../../): reading /go.mod: no such file`。
#   VERSION 供 -ldflags 注入版本号，取自 OPSMESH_VERSION（与镜像 tag 同源）。

name: opsmesh

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

x-restart: &restart-policy
  restart: unless-stopped

services:
  # ============================================================
  # Infrastructure Layer
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: opsmesh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD（openssl rand -base64 32）}
      MYSQL_DATABASE: opsmesh
      MYSQL_USER: ${MYSQL_USER:-opsmesh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD（openssl rand -base64 32）}
      # root 仅限容器内 localhost（镜像默认会额外创建 root@'%'，等于把全库管理权开放给整个网络）。
      MYSQL_ROOT_HOST: localhost
    ports:
      # 仅本机可达：数据库不对外暴露，运维经 SSH 隧道/容器内客户端访问。
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../monitoring/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
      # 首次初始化（数据目录为空）时建微服务独立库并授权；已有数据卷不重跑。
      # 只建库不建表：表由各服务启动时按自身 schema 创建（详见脚本内注释）。
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    # 参数说明（MySQL 8.0 实测）：
    #   - 不含 --query-cache-type/--query-cache-size：8.0 已移除查询缓存，
    #     带该参数会 [ERROR] [MY-000067] unknown variable + Aborting 直接启动失败。
    #   - 不含 --default-authentication-plugin=mysql_native_password：8.0.46 起弃用、8.4 移除；
    #     且无必要——go-sql-driver/mysql v1.10.0 原生支持 caching_sha2_password，
    #     非 TLS 连接走 RSA 公钥交换，实测（8.0 容器 + 非 TLS DSN）Ping/DDL/SELECT 均通过。
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=1
      --innodb-flush-method=O_DIRECT
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=2
    healthcheck:
      # -h localhost 走容器内 socket，命中 root@localhost（root 已被限制为 localhost）。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging
    <<: *restart-policy

  redis:
    image: redis:7-alpine
    container_name: opsmesh-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD（Redis --requirepass 口令）}
      --tcp-keepalive 300
      --timeout 0
    environment:
      # 供健康检查在容器内取用（避免把口令写进 compose 渲染出的命令行）。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD（Redis --requirepass 口令）}
    ports:
      # 仅本机可达：未认证 Redis 可被任意容器读取会话黑名单/限流计数或直接 FLUSHALL。
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  # ============================================================
  # Observability Stack
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: opsmesh-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging
    <<: *restart-policy

  # Alertmanager：把「已产生的告警状态」变成「有人会收到」。
  #
  # 为什么出厂栈里必须有它（2026-10-02）：此前 prometheus.yml 的 `alerting:` 段是注释状态、
  # 栈里也没有 alertmanager 容器，于是 30+ 条出厂规则**只产生状态、不送达任何人**——
  # 客户按"会打电话"理解就验收错了对象。现在默认起 AM，配置由 deploy.sh 从
  # `deploy/monitoring/alertmanager.yml.template` 渲染到 `deploy/docker/generated/alertmanager.yml`：
  #   • .env 设了 ALERT_WEBHOOK_URL ⇒ 渲染出真实外发段；
  #   • 没设 ⇒ 生成"合法但无外发"的 receiver，并由 deploy.sh **大声 WARN**，
  #     因为 Alertmanager 不读环境变量，把死配置挂进容器只会让人以为外发已生效。
  # 生成物含 bearer token，故 deploy/docker/generated/ 已进 .gitignore。
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opsmesh-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9094}:9093"
    volumes:
      # 必须是 ./ 开头的路径：短语法里不带 ./ 的 `名字:容器路径` 会被 compose 当**命名卷**，
      # 渲染直接报 "refers to undefined volume generated/alertmanager.yml"（本条由门禁 §4 抓到）。
      - ${ALERTMANAGER_CONFIG:-./generated/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy

  # 黑盒拨测（blackbox_exporter）：prometheus.yml 的 opsmesh-mysql / opsmesh-redis
  # 用 metrics_path=/probe + module=tcp_connect（即本 exporter 的协议）。
  #
  # 为什么必须真的部署它（2026-09-25 实测）：此前栈内没有 blackbox-exporter，且这两个
  # job 缺 relabel_configs，等价于让 Prometheus 直接向 MySQL/Redis 发 HTTP /probe 请求
  # → target 恒 DOWN；叠加 alerts.yml 的 up==0 / MySQLDown / RedisDown，一个完全健康的
  # 栈在 /api/v1/alerts 上常驻 5 条 critical 假告警（MySQLDown、RedisDown、
  # ServiceDown×3）。假告警会让值班人员整体忽略告警，比不配告警更危险。
  #
  # 不发布宿主端口：只由 Prometheus 经内网抓取（排障看 Prometheus targets 页即可）。
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: opsmesh-blackbox
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ../monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9115/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      # backend_net 用于拨测 mysql:3306 / redis:6379；monitoring_net 供 Prometheus 抓取。
      - monitoring_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: opsmesh-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana 仅绑本机，root URL 用 localhost（远程访问走 SSH 隧道）。
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: "console file"
      GF_LOG_LEVEL: "info"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/opsmesh-overview.json"
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - monitoring_net
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  loki:
    image: grafana/loki:3.2.0
    container_name: opsmesh-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: opsmesh-otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_METRICS_PORT:-8888}:8888"
      # health_check 扩展端口：发布到宿主 127.0.0.1，供外部探活/排障。
      # 为什么容器内不做 healthcheck：otel/opentelemetry-collector-contrib 是
      # distroless 镜像（无 shell、无 wget），`test: ["CMD","wget",...]` 无法执行，
      # 实测报 executable file not found in $PATH，容器会恒为 unhealthy 并让
      # deploy.sh 判定失败。该镜像唯一可用二进制是 /otelcol-contrib 本身，故健康
      # 判定改由外部（宿主/Docker 编排/K8s httpGet）访问本端口完成。
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13134}:13134"
    volumes:
      - ../monitoring/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - monitoring_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy

  # ============================================================
  # OpsMesh Core Services
  # ============================================================

  controlplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.controlplane
      # 构建元信息注入（P1-6 /version 据此报告版本）。缺省值 dev/unknown 表示未提供，
      # 而非"构建失败"——Dockerfile 里的 ARG 默认值承担这一点。
      # 注意：-X 的包路径必须是模块路径，写成 opsmesh/... 会被链接器静默忽略。
      args:
        VERSION: ${OPSMESH_VERSION}
        COMMIT: ${OPSMESH_BUILD_COMMIT:-dev}
        BUILD_DATE: ${OPSMESH_BUILD_DATE:-unknown}
    # 生产禁用 latest 浮动标签：镜像内容不可追溯，回滚无法定位版本。
    image: opsmesh/controlplane:${OPSMESH_VERSION:?请在 .env 设置 OPSMESH_VERSION（如 0.13.0，禁止 latest）}
    container_name: opsmesh-controlplane
    command:
      - --mode=controlplane
      - --store=mysql
      - --mysql-dsn=${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@tcp(mysql:3306)/opsmesh?parseTime=true
      - --redis-addr=redis:6379
      # 口令经 OPSMESH_REDIS_PASSWORD 注入（不写进命令行，避免出现在 ps/inspect 的 argv 中）。
      - --session-store=redis://redis:6379
      # Web/REST 协议：auto=证书齐备即 HTTPS（本文件已挂载证书）；gRPC 同样启用 TLS。
      - --http-tls=auto
      - --tls-cert=/etc/opsmesh/tls/tls.crt
      - --tls-key=/etc/opsmesh/tls/tls.key
      # 自动纳管 bootstrap 命令使用该地址，必须是对 agent 可达的真实地址。
      - --advertise-addr=${OPSMESH_ADVERTISE_ADDR:?请在 .env 设置 OPSMESH_ADVERTISE_ADDR（如 https://ops.example.com:8080）}
      # M6 日志检索：查 Loki（日志由 agent 直接推送）；endpoint 必填，否则启动期校验拒绝。
      - --log-backend=loki
      - --loki-endpoint=http://loki:3100
      # P1-3 审计日志保留：超龄行由 leader 搬入 audit_log_archive 后从在线表删除（0=永久保留）。
      - --audit-retention-days=${AUDIT_RETENTION_DAYS:-180}
    ports:
      - "${CONTROLPLANE_HTTP_PORT:-8080}:8080"
      - "${CONTROLPLANE_GRPC_PORT:-9090}:9090"
      # metrics 只给监控网段与本机用；Prometheus 经 backend_net 抓取，无需对外。
      - "127.0.0.1:${CONTROLPLANE_METRICS_PORT:-9091}:9091"
    volumes:
      - ${OPSMESH_TLS_DIR:-./certs}:/etc/opsmesh/tls:ro
    environment:
      # ---- 密钥（全部必填：无内置默认口令，缺失即拒绝启动）----
      OPSMESH_JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET（≥32 字节，openssl rand -base64 48）}
      OPSMESH_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 设置 ENCRYPTION_KEY（kubeconfig AES-256-GCM 密钥，base64 的 32 字节）}
      # 初始 admin 口令交付：生产模式且此处为空时，控制面 fail-fast 拒绝启动
      # （替代此前"随机口令不输出导致管理员被静默锁死"）。生成：openssl rand -base64 24
      OPSMESH_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD（初始 admin 口令，至少 8 位含大小写与数字）}
      OPSMESH_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD（Redis --requirepass 口令）}
      # ---- 预迁移子命令（deploy.sh migrate，TD-83）----
      # deploy.sh migrate 经 `compose run controlplane migrate` 覆盖服务 command，
      # 命令行上的 --store/--mysql-dsn/--tls-cert/--tls-key 随之失效。
      # 这里经环境变量补齐同一组值（config.Load 优先级：命令行显式 > 环境变量 > 默认，
      # 正常启动路径仍以 command 的显式 flag 为准，行为不变）。
      OPSMESH_STORE: mysql
      OPSMESH_MYSQL_DSN: ${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@tcp(mysql:3306)/opsmesh?parseTime=true
      OPSMESH_TLS_CERT: /etc/opsmesh/tls/tls.crt
      OPSMESH_TLS_KEY: /etc/opsmesh/tls/tls.key
      # ---- 运行模式与安全开关 ----
      OPSMESH_PRODUCTION: ${PRODUCTION_MODE:-true}
      # M7 业务告警外发（notifyLoop）。刻意与 Alertmanager 的 ALERT_WEBHOOK_URL **分开配**：
      # 两者的告警来源不同（规则触发 vs 落库的业务告警），填成同一个地址会收到两类内容，
      # 填成不同地址则各发各的——分工见 docs/operations.md §4.6.0。留空=该通道不启动。
      OPSMESH_ALERT_WEBHOOK_URL: ${CONTROLPLANE_ALERT_WEBHOOK_URL:-}
      # 内网收件端开关：SSRF 闸默认拒绝私网/环回地址，指向集群内或内网 IM 网关时需显式放行。
      # 链路本地/云元数据段（169.254.0.0/16 等）任何取值都不放行。
      OPSMESH_WEBHOOK_ALLOW_PRIVATE: ${ALERT_WEBHOOK_ALLOW_PRIVATE:-false}
      OPSMESH_REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      # 直连 HTTPS：Cookie 必须带 Secure（明文形态由反代 overlay 覆盖）。
      OPSMESH_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPSMESH_PUBLIC_REGISTER: ${PUBLIC_REGISTER:-false}
      OPSMESH_ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      OPSMESH_TRUST_PROXY: ${TRUST_PROXY:-false}
      # ---- 微服务转发后端（TD-60）----
      # 这三个变量此前**从未被设置**，聚合代理因此回落到源码里的硬编码 localhost
      # 默认值，其中 autoscaler/portal 的默认值 127.0.0.1:8080 正是控制面自己的
      # 监听端口：/api/v1/portal/quotas 会被改写成 /api/v1/quotas 并**静默转发回
      # 自己**，返回单体的配额数据、无错误、无告警。控制面现已对该情况硬拦为 503
      # （service_proxy.go proxySelfLoopTarget），但根因是这里必须显式给地址。
      #
      # 地址用 compose 服务名（容器网络内可解析），端口与文件下方各服务
      # *_SVC_HTTP_PORT 保持一致。
      # runbook/incident/autoscaler 三域已转正入栈（TD-60 §5.11，2026-10-01；服务定义见本文件
      # 下方 runbook-svc / incident-svc / autoscaler-svc 段），故一并显式给出地址。
      # 此前不设置这三条时，请求会得到 503（可见故障）而不是指向不存在的服务——
      # 该“可见故障”行为仍由控制面的 proxySelfLoopTarget/预检失败路径保留给未接通的域。
      # 一域当前由谁处理、后端是什么、自检结论如何，查 GET /api/v1/admin/service-routing。
      GPU_SVC_URL: http://gpu-svc:8107
      PORTAL_SVC_URL: http://portal-svc:8109
      DEVICE_SVC_URL: http://device-svc:8101
      INCIDENT_SVC_URL: http://incident-svc:8104
      RUNBOOK_SVC_URL: http://runbook-svc:8110
      AUTOSCALER_SVC_URL: http://autoscaler-svc:8111
      # task-svc（TD-60 阶段 2 三域接通第二域）：HTTP 网关监听 8102 在下方本栈内。
      # auth-svc 暂不接通（HTTP 网关默认关闭 + 独立内存用户库，双轨 Cookie/数据边界
      # 待裁决），故此处不设 AUTH_SVC_URL——设了也没有对应域的代理规则可读。
      TASK_SVC_URL: http://task-svc:8102
      # 可逆切流开关（默认空=全部转发）。回退某域到单体本地实现：
      #   OPSMESH_SERVICE_PROXY=gpu,portal
      # 全部停用用 off。取值非法会被忽略并按「全转发」继续——宁可不动，也不误切。
      OPSMESH_SERVICE_PROXY: ${OPSMESH_SERVICE_PROXY:-}
      # 可支撑性（P1-6）：日志级别与 pprof 开关（pprof 开启后仍受 METRICS_ALLOW_CIDR 准入）。
      # 默认 info/false；debug 仅排障期间使用（日志量级显著上升）。
      OPSMESH_LOG_LEVEL: ${LOG_LEVEL:-info}
      OPSMESH_DEBUG_PPROF: ${DEBUG_PPROF:-false}
      OPSMESH_GRPC_REQUIRE_SIGNATURE: ${GRPC_REQUIRE_SIGNATURE:-true}
      # 重启/多副本后 bootstrap 安装令牌仍需有效时须固定该密钥（空=进程内随机，重启即失效）。
      OPSMESH_PROVISION_SECRET: ${PROVISION_SECRET:-}
      OPSMESH_FEDERATION_SECRET: ${FEDERATION_SECRET:-}
      # metrics 白名单（P1-5 起生产模式必填）：为空则 /metrics 一律 403（fail-closed）。
      # 必须含 172.28.0.0/16：Docker Desktop(WSL2) 的端口转发【不保留真实来源 IP】——
      # 2026-09-25 实测（探针容器白名单=127.0.0.1/32）：宿主 curl、宿主经局域网 IP、
      # 默认桥容器经 host.docker.internal 三种来源，容器侧看到的 remote 均为 172.28.1.1
      # （frontend 网桥网关），故漏掉该网段连宿主都抓不到；反之它也【无法区分】局域网/公网来源。
      # 因此 Docker 部署下真正的边界是「端口只发布到需要的地址」+ 宿主防火墙；CIDR 白名单
      # 在裸机/systemd（真实来源 IP 保留）与 K8s（Pod IP）部署下才具备来源区分能力。
      OPSMESH_METRICS_ALLOW_CIDR: ${METRICS_ALLOW_CIDR:-127.0.0.0/8,172.28.0.0/16}
      # API 限流（P1-5）：空=代码侧默认（生产 200 req/s/IP）；0=显式关闭（打印告警）。
      OPSMESH_CB_RATE_LIMIT_PER_SEC: ${CB_RATE_LIMIT_PER_SEC:-}
      # ---- 可观测性 ----
      OPSMESH_OTEL_ENDPOINT: "otel-collector:4317"
      OPSMESH_OTEL_SERVICE_NAME: "opsmesh-controlplane"
      OPSMESH_SHUTDOWN_TIMEOUT: 30s
      TZ: ${TZ:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # --health 探针自行尝试 https 与 http（等价 curl -k），直连 HTTPS 与反代明文两种形态均可。
      test: ["CMD", "/usr/local/bin/opsmesh", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging
    <<: *restart-policy

  auth-svc:
    build:
      context: ../..
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth-svc
        VERSION: ${OPSMESH_VERSION}
    image: opsmesh/auth-svc:${OPSMESH_VERSION:?请在 .env 设置 OPSMESH_VERSION（如 0.13.0，禁止 latest）}
    container_name: opsmesh-auth-svc
    ports:
      - "127.0.0.1:${AUTH_SVC_HTTP_PORT:-8100}:8100"
    environment:
      AUTH_SVC_GRPC_PORT: 50050
      AUTH_SVC_HTTP_PORT: 8100
      AUTH_SVC_JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      # 与 controlplane 的 OPSMESH_ADMIN_PASSWORD 同源：同一套初始口令，避免两处不一致。
      AUTH_SVC_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD}
      AUTH_SVC_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TTL:-900s}
      AUTH_SVC_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TTL:-168h}
      AUTH_SVC_REDIS_ADDR: "redis:6379"
      # 口令经 REDIS_PASSWORD 读取（cache.NewWithAddr / NewSessionStore 均取该变量）。
      # 缺失时 Redis AUTH 失败会静默降级为进程内缓存（登录态不跨副本共享），故此处必填。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy

