      PROMETHEUS_URL: "http://prometheus:9090"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8108/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  incident-svc:
    build:
      context: ../..
      dockerfile: Dockerfile.service
      args:
        SERVICE: incident-svc
        VERSION: ${OPSMESH_VERSION}
    image: opsmesh/incident-svc:${OPSMESH_VERSION:?请在 .env 设置 OPSMESH_VERSION}
    container_name: opsmesh-incident-svc
    ports:
      - "127.0.0.1:${INCIDENT_SVC_HTTP_PORT:-8104}:8104"
    environment:
      INCIDENT_SVC_HTTP_PORT: 8104
      INCIDENT_SVC_STORE_TYPE: ${INCIDENT_STORE_TYPE:-sql}
      INCIDENT_SVC_DSN: "${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@tcp(mysql:3306)/opsmesh_incident?parseTime=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8104/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy

  runbook-svc:
    build:
      context: ../..
      dockerfile: Dockerfile.service
      args:
        SERVICE: runbook-svc
        VERSION: ${OPSMESH_VERSION}
    image: opsmesh/runbook-svc:${OPSMESH_VERSION:?请在 .env 设置 OPSMESH_VERSION}
    container_name: opsmesh-runbook-svc
    ports:
      - "127.0.0.1:${RUNBOOK_SVC_HTTP_PORT:-8110}:8110"
    environment:
      RUNBOOK_SVC_HTTP_PORT: 8110
      RUNBOOK_SVC_STORE_TYPE: ${RUNBOOK_STORE_TYPE:-sql}
      RUNBOOK_SVC_DSN: "${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@tcp(mysql:3306)/opsmesh_runbook?parseTime=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8110/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy

  autoscaler-svc:
    build:
      context: ../..
      dockerfile: Dockerfile.service
      args:
        SERVICE: autoscaler-svc
        VERSION: ${OPSMESH_VERSION}
    image: opsmesh/autoscaler-svc:${OPSMESH_VERSION:?请在 .env 设置 OPSMESH_VERSION}
    container_name: opsmesh-autoscaler-svc
    ports:
      - "127.0.0.1:${AUTOSCALER_SVC_HTTP_PORT:-8111}:8111"
    environment:
      AUTOSCALER_SVC_HTTP_PORT: 8111
      PROMETHEUS_URL: "http://prometheus:9090"
      # 扩缩容执行器（autoscaler-svc/pkg/config.go:K8sExecutor）。
      #   simulated  = 只改本进程内存，**不会改动任何集群**（响应与决策历史都会标
      #                executor=memory-simulated）；出厂栈默认这个，因为容器里没有集群凭据。
      #   in-cluster / kubeconfig = 真实改动 Deployment 的 spec.replicas。
      # 明确要求真实执行而凭据配不上时，本容器启动即失败，不会静默退回 simulated。
      AUTOSCALER_K8S_EXECUTOR: ${AUTOSCALER_K8S_EXECUTOR:-simulated}
      AUTOSCALER_KUBECONFIG: ${AUTOSCALER_KUBECONFIG:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8111/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy
# ============================================================
# Networks
# ============================================================

networks:
  frontend_net:
    driver: bridge
    name: opsmesh-frontend
    ipam:
      config:
        - subnet: 172.28.1.0/24
    labels:
      opsmesh.network.role: "frontend"

  # 为什么不给这两个网络加 internal: true（2026-09-25 实测，勿回退）：
  #   1) internal 与「发布宿主端口」互斥。Docker Desktop(WSL2) 下若某容器所连网络
  #      【全部】是 internal，宿主端口转发器无法路由进该网络（internal 桥无网关/NAT），
  #      publish 会被【静默丢弃】：容器照常 Up/healthy，但 NetworkSettings.Ports 为空、
  #      `docker port` 无输出、宿主 curl 连不上，compose up 也不报任何错。
  #      对照实验（同镜像 prom/prometheus:v2.55.0、同宿主端口写法、仅网络不同）：
  #        --network opsmesh-backend  → NS={"9090/tcp":[]}   curl 000
  #        --network opsmesh-frontend → NS=[127.0.0.1:28102] curl 200
  #        两个网络都连              → NS=[127.0.0.1:28103] curl 200
  #      受影响面：mysql/redis/prometheus/loki/otel 及全部微服务共 13 个容器 15 个端口
  #      （compose 声明了 127.0.0.1 发布却全部无效，deploy.sh 冒烟测试因此失败）。
  #   2) internal 无网关 = 无外网出口，出站 DNS 也不通。实测 opsmesh-alert-svc 内
  #      `getent hosts events.pagerduty.com` 直接解析失败，而本文件为 alert-svc 配了
  #      PAGERDUTY_API_URL=https://events.pagerduty.com/... —— 即 PagerDuty 集成
  #      在 internal 网络上永远不可用。
  #   入站边界由「端口只发布到 127.0.0.1（仅本机可达）」保证，不依赖 internal；
  #   若需限制微服务出站，请用宿主防火墙或 K8s NetworkPolicy（compose 层不提供该能力）。
  backend_net:
    driver: bridge
    name: opsmesh-backend
    ipam:
      config:
        - subnet: 172.28.2.0/24
    labels:
      opsmesh.network.role: "backend"

  monitoring_net:
    driver: bridge
    name: opsmesh-monitoring
    ipam:
      config:
        - subnet: 172.28.3.0/24
    labels:
      opsmesh.network.role: "monitoring"

# ============================================================
# Volumes
# ============================================================

volumes:
  mysql_data:
    driver: local
    name: opsmesh-mysql-data
  redis_data:
    driver: local
    name: opsmesh-redis-data
  prometheus_data:
    driver: local
    name: opsmesh-prometheus-data
  alertmanager_data:
    driver: local
    name: opsmesh-alertmanager-data
  grafana_data:
    driver: local
    name: opsmesh-grafana-data
  loki_data:
    driver: local
    name: opsmesh-loki-data
