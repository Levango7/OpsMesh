      # 变量名必须是 TASK_SVC_DSN：此前写作 MYSQL_DSN（无人读取），
      # 叠加 STORE_TYPE=sql 时服务静默退回内存存储——生产重启即丢任务。
      TASK_SVC_DSN: "${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@tcp(mysql:3306)/opsmesh_task?parseTime=true"
      # 与 controlplane 同源：HTTP 网关校验调用方 token。
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
