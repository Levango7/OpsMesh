  log-svc:
    build:
      context: ../..
      dockerfile: Dockerfile.service
      args:
        SERVICE: log-svc
        VERSION: ${OPSMESH_VERSION}
    image: opsmesh/log-svc:${OPSMESH_VERSION:?请在 .env 设置 OPSMESH_VERSION}
    container_name: opsmesh-log-svc
    ports:
      - "127.0.0.1:${LOG_SVC_HTTP_PORT:-8105}:8105"
      - "127.0.0.1:${LOG_SVC_GRPC_PORT:-9095}:9095"
    environment:
      LOG_SVC_GRPC_ADDR: ":9095"
      LOG_SVC_HTTP_PORT: 8105
      LOG_SVC_BACKEND: ${LOG_BACKEND:-loki}
      # 端点此前无任何环境变量入口（服务只读 LOG_SVC_BACKEND），
      # 容器化部署下 loki 永远拿到空 endpoint；现已支持 LOG_SVC_LOKI_ENDPOINT / LOG_SVC_SQL_DSN。
      LOG_SVC_LOKI_ENDPOINT: "http://loki:3100"
      LOG_SVC_SQL_DSN: "${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@tcp(mysql:3306)/opsmesh_log?parseTime=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      # 探针路径为 /health（TD-77 统一口径：12 个微服务一律 /health 存活探针）。
      # 本服务此前只提供 /healthz，探针指向不存在的路径 → 容器永远 unhealthy；
      # 现已同时注册 /health 与历史别名 /healthz，两者指向同一 handler。
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8105/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    <<: *restart-policy

