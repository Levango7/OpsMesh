# OpenTelemetry Collector Configuration for OpsMesh Production
# Receives OTLP, exports to Prometheus, Loki, Jaeger, and console

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://localhost:8080"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  resource:
    attributes:
      - key: environment
        value: production
        action: upsert
      - key: service.namespace
        value: opsmesh
        action: upsert

  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 1000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow
        type: latency
        latency: {threshold_ms: 1000}
      # TD-75：默认策略此前只留 10%——那是「没有查询后端、span 落日志即丢」
      # 时代的节流参数。Jaeger 入栈后，链路追踪的价值就是「能打开一张
      # 完整的调用链图」，默认策略改为全量保留（错误/慢请求两条策略本就
      # 100%）。自托管小规模部署全量保留无压力；若流量上来后存储吃紧，
      # 把这里的 sampling_percentage 调低即可（ Jaeger 侧仍保有错误/慢
      # 请求的完整样本）。
      - name: default
        type: probabilistic
        probabilistic: {sampling_percentage: 100}

exporters:
  prometheus:
    endpoint: "0.0.0.0:8888"
    namespace: opsmesh
    const_labels:
      source: otel

  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 2

  # Jaeger export（TD-75：查询侧入栈——此前 traces pipeline 只接
  # logging exporter，span 落日志后即丢，仓库内没有查询后端；
  # 启用后 Jaeger UI（compose 的 jaeger 服务，宿主 127.0.0.1:16686）
  # 提供按服务/操作/标签检索的调用链图）。
  jaeger:
    endpoint: "jaeger:14250"
    tls:
      insecure: true

  # Uncomment for OTLP export to external system
  # otlp/external:
  #   endpoint: "tempo:4317"
  #   tls:
  #     insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      # 关键：otelcol-contrib 0.110.0 的内部遥测监听地址默认仍是 :8888（旧版 address 字段），
      # 与下方 exporters.prometheus 的 0.0.0.0:8888 撞端口，collector 启动即失败并无限重启：
      #   listen tcp 0.0.0.0:8888: bind: address already in use（实测 crash-loop）
      # 显式把内部遥测挪到 8889：8888 留给应用侧指标（prometheus.yml 抓 otel-collector:8888），
      # 采集器自身指标（队列/丢弃/导出失败）由 prometheus.yml 的 otel-collector-internal job 抓 8889。
      address: "0.0.0.0:8889"
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch, resource]
      exporters: [jaeger, logging]

extensions:
  health_check:
    endpoint: "0.0.0.0:13134"
    path: "/"
    check_collector_pipeline:
      enabled: true
      interval: "5s"
      # otelcol-contrib 0.110.0：check_collector_pipeline 不再接受 exporter_names
      # （镜像钉 0.110.0，保留该键会让 collector 启动即失败：'check_collector_pipeline'
      # has invalid keys: exporter_names ——实测）。改为新版的失败阈值语义。
      exporter_failure_threshold: 5
