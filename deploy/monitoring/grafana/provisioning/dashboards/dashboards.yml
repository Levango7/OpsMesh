# Grafana Dashboard Provisioning
# Tells Grafana where to find pre-built dashboards

apiVersion: 1

providers:
  - name: 'OpsMesh Dashboards'
    orgId: 1
    folder: 'OpsMesh'
    folderUid: 'opsmesh'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
