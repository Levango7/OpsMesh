# Prometheus Configuration for OpsMesh Production
# Scrapes all OpsMesh services and infrastructure

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: opsmesh-prod
    environment: production

# Alert rules
rule_files:
  - "alerts.yml"

# Alertmanager (uncomment when alertmanager is deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

scrape_configs:
  # Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # OpsMesh Controlplane
  - job_name: "opsmesh-controlplane"
    static_configs:
      - targets: ["controlplane:9091"]
    metrics_path: /metrics
    scrape_interval: 10s

  # OpsMesh Microservices
  # metrics 端口统一 9091（与 helm values.yaml metricsPort 对齐，ServiceMonitor 亦采此端口）
  - job_name: "auth-svc"
    static_configs:
      - targets: ["auth-svc:9091"]
    metrics_path: /metrics

  - job_name: "device-svc"
    static_configs:
      - targets: ["device-svc:9091"]
    metrics_path: /metrics

  - job_name: "task-svc"
    static_configs:
      - targets: ["task-svc:9091"]
    metrics_path: /metrics

  - job_name: "alert-svc"
    static_configs:
      - targets: ["alert-svc:9091"]
    metrics_path: /metrics

  - job_name: "config-svc"
    static_configs:
      - targets: ["config-svc:9091"]
    metrics_path: /metrics

  - job_name: "log-svc"
    static_configs:
      - targets: ["log-svc:9091"]
    metrics_path: /metrics

  - job_name: "gpu-svc"
    static_configs:
      - targets: ["gpu-svc:9091"]
    metrics_path: /metrics

  - job_name: "aio-svc"
    static_configs:
      - targets: ["aio-svc:9091"]
    metrics_path: /metrics

  - job_name: "portal-svc"
    static_configs:
      - targets: ["portal-svc:9091"]
    metrics_path: /metrics

  # Infrastructure
  - job_name: "opsmesh-mysql"
    static_configs:
      - targets: ["mysql:3306"]
    metrics_path: /probe
    params:
      module: [tcp_connect]

  - job_name: "opsmesh-redis"
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: /probe
    params:
      module: [tcp_connect]

  # OTel Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: /metrics

  # Docker daemon metrics (if available)
  - job_name: "docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]
    metrics_path: /metrics
