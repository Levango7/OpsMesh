# Prometheus Alert Rules for OpsMesh Production

groups:
  - name: opsmesh_service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}."

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency on {{ $labels.job }}"
          description: "P99 latency is {{ $value }}s for {{ $labels.job }}."

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is {{ $value }}% for {{ $labels.job }}."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is {{ $value }}MB for {{ $labels.job }}."

  - name: opsmesh_infrastructure_alerts
    interval: 30s
    rules:
      - alert: MySQLDown
        expr: up{job="opsmesh-mysql"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MySQL is down"
          description: "MySQL database has been unreachable for 30 seconds."

      - alert: RedisDown
        expr: up{job="opsmesh-redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been unreachable for 30 seconds."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Less than 10% disk space remaining."

  - name: opsmesh_business_alerts
    interval: 1m
    rules:
      - alert: DeviceOffline
        expr: opsmesh_device_status{status="offline"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} devices are offline"
          description: "More than 10 devices have been offline for 5+ minutes."

      - alert: TaskExecutionFailed
        expr: rate(opsmesh_tasks_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High task failure rate"
          description: "Task failure rate is {{ $value }} per second."

  - name: opsmesh_audit_chain_alerts
    interval: 30s
    rules:
      # P1-3 审计防篡改：链完整性校验失败必须立刻可见。
      # 语义：supported=1 表示当前存储后端提供链式校验（SQL 后端），ok=0 表示校验发现
      # 不一致（行被改写/删除，或尾部被截断）。内存后端/老库 supported=0，表达式为假，
      # 不会误报；非 leader 副本也从不写指标（supported 渲染为 0），同样不误报。
      - alert: OpsMeshAuditChainBroken
        expr: opsmesh_audit_chain_supported == 1 and opsmesh_audit_chain_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "审计哈希链完整性校验失败（疑似篡改或审计行被删除）"
          description: "opsmesh_audit_chain_ok=0 且 supported=1 已持续 5m：请立即调用 GET /api/v1/audit/verify 查看 firstBadID/reason，并核对 audit_log 的 DBA 操作记录。"

      # 自检循环停摆（leader 挂掉/被抢主后无人自检）——「没有结果」也是一种失效，需可见。
      - alert: OpsMeshAuditChainCheckStale
        expr: increase(opsmesh_audit_chain_checks_total[15m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "审计链自检 15 分钟内未执行"
          description: "leader 周期任务（归档 + 自检）疑似停摆：检查控制面 leader 状态与 auditMaintenanceLoop 日志。"

  - name: opsmesh_agent_signature_alerts
    interval: 30s
    rules:
      # P1-2 agent 身份绑定：验签被拒必须可见。
      # 语义：require-signature 开启时，agent 忘配密钥/密钥与库内不一致/时间戳漂移/伪造尝试
      # 都会落在 {result="rejected"}。零流量（无 agent）时 rate 为 0，表达式为假，不误报。
      # 排查：控制面日志中的 "agent-signature mismatch" / "no signing secret" / "out of skew"，
      # 以及 GET /api/v1/agents 确认该 agent 是否有 per-agent 密钥（secret 非空）。
      - alert: OpsMeshAgentSignatureRejected
        expr: rate(opsmesh_agent_signature_verifications_total{result="rejected"}[5m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "agent gRPC 请求持续被验签拒绝"
          description: "近 10 分钟持续存在被拒验签（{{ $value }} 次/秒）：agent 密钥缺失/不匹配或有人伪造上报。请核对控制面日志与 agents 表的 secret 列。"

      # 遗留算法仍在生产使用（滚动升级未收尾）：v1 不覆盖载荷，同秒内可被改写重放。
      # 仅在确实有 v1 流量时告警；升级完成（全部 v2）后自动清零。
      - alert: OpsMeshAgentSignatureLegacyAlg
        expr: rate(opsmesh_agent_signature_verifications_total{alg="v1",result="ok"}[10m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "仍有 agent 使用 v1 签名算法（不覆盖载荷）"
          description: "v1 签名不含载荷摘要，同秒内任务结果可被篡改重放已持续 30 分钟：请按构建顺序升级 agent 到 v2（控制面已兼容 v1/v2，可先升级控制面）。"

      # 全舰队预共享密钥兜底仍在被使用 = 密钥未按 agent 隔离（单机泄漏即全舰队可冒充）。
      - alert: OpsMeshAgentFleetKeyInUse
        expr: rate(opsmesh_agent_signing_key_source_total{source="fleet"}[10m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "仍有 agent 依赖全舰队预共享签名密钥"
          description: "近 30 分钟存在以 --grpc-signature-key 兜底验签通过（{{ $value }} 次/秒）：建议改用 install token + TLS 纳管，使每台 agent 持有独立密钥，实现单机吊销与轮换。"
