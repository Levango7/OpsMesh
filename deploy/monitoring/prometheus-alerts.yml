# Prometheus Alert Rules for OpsMesh Production

groups:
  - name: opsmesh_service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      # HTTP 错误率/延迟：**必须同时覆盖两套命名**。
      # 控制面（internal/metrics）导出 opsmesh_http_requests_total，而微服务（pkg/metrics）
      # 导出无前缀的 http_requests_total；prometheus.yml 两类 job 都抓（controlplane:9091 +
      # device/task/alert-svc）。只写其中一边 ⇒ 另一半目标恒无数据，规则看起来全局生效实则只覆盖一半。
      # 彻底统一命名是破坏性变更（客户已有面板/告警按现名写死），此处先用 __name__ 正则并集，
      # 统一方案记在报告 §23 的待办里。分母用 clamp_min(...,1) 而不是裸除：零流量时 0/0 会得到 NaN，
      # 而 NaN 在 Prometheus 里等于"不评估"——正好是本轮要消灭的那种静默失效。
      - alert: HighErrorRate
        expr: sum(rate({__name__=~"opsmesh_http_requests_total|http_requests_total",status=~"5.."}[5m])) / clamp_min(sum(rate({__name__=~"opsmesh_http_requests_total|http_requests_total"}[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "5xx 占比 {{ $value | humanizePercentage }} 已持续 5m（覆盖控制面与已开 /metrics 的微服务）。"

      - alert: HighLatency
        expr: histogram_quantile(0.99, sum by (le) (rate({__name__=~"opsmesh_http_request_duration_seconds_bucket|http_request_duration_seconds_bucket"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency on {{ $labels.job }}"
          description: "P99 延迟 {{ $value }}s 已持续 5m。sum by (le) 是必须的：不聚合会把每个 method/path/status 各算一条曲线。"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is {{ $value }}% for {{ $labels.job }}."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is {{ $value }}MB for {{ $labels.job }}."

  - name: opsmesh_infrastructure_alerts
    interval: 30s
    rules:
      - alert: MySQLDown
        expr: up{job="opsmesh-mysql"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MySQL is down"
          description: "MySQL database has been unreachable for 30 seconds."

      - alert: RedisDown
        expr: up{job="opsmesh-redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been unreachable for 30 seconds."

      # 磁盘类规则不在此文件：它们依赖 node_* 序列，而本栈没有 node_exporter
      # ⇒ 放进默认加载的文件里就是一条永久静默的死规则。见 prometheus-alerts.host.example.yml。

  - name: opsmesh_business_alerts
    interval: 1m
    rules:
      - alert: DeviceOffline
        expr: sum(opsmesh_device_status{status="offline"}) / clamp_min(sum(opsmesh_device_status{status="online"}) + sum(opsmesh_device_status{status="offline"}), 1) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "离线设备占比 {{ $value | humanizePercentage }}"
          # 口径说明：用**占比**而不是旧写的 "> 10 台"——10 台的阈值对 20 台的小集群等于永不触发，
          # 对 5000 台的集群又太迟钝。分母只含 online+offline（不含 discovered/provisioning），
          # clamp_min(...,1) 保证一台设备都没有时结果是 0 而不是 NaN。
          description: "超过 20% 的已纳管设备处于 offline 已持续 5m：检查 agent 心跳、网络分区与控制面 --agent-offline-after 设置。"

      - alert: TaskExecutionFailed
        expr: sum(rate(opsmesh_tasks_total{status="failed"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High task failure rate"
          description: "Task failure rate is {{ $value }} per second."

  - name: opsmesh_audit_chain_alerts
    interval: 30s
    rules:
      # P1-3 审计防篡改：链完整性校验失败必须立刻可见。
      # 语义：supported=1 表示当前存储后端提供链式校验（SQL 后端），ok=0 表示校验发现
      # 不一致（行被改写/删除，或尾部被截断）。内存后端/老库 supported=0，表达式为假，
      # 不会误报；非 leader 副本也从不写指标（supported 渲染为 0），同样不误报。
      - alert: OpsMeshAuditChainBroken
        expr: opsmesh_audit_chain_supported == 1 and opsmesh_audit_chain_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "审计哈希链完整性校验失败（疑似篡改或审计行被删除）"
          description: "opsmesh_audit_chain_ok=0 且 supported=1 已持续 5m：请立即调用 GET /api/v1/audit/verify 查看 firstBadID/reason，并核对 audit_log 的 DBA 操作记录。"

      # 自检循环停摆（leader 挂掉/被抢主后无人自检）——「没有结果」也是一种失效，需可见。
      - alert: OpsMeshAuditChainCheckStale
        expr: increase(opsmesh_audit_chain_checks_total[15m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "审计链自检 15 分钟内未执行"
          description: "leader 周期任务（归档 + 自检）疑似停摆：检查控制面 leader 状态与 auditMaintenanceLoop 日志。"

  - name: opsmesh_agent_signature_alerts
    interval: 30s
    rules:
      # P1-2 agent 身份绑定：验签被拒必须可见。
      # 语义：require-signature 开启时，agent 忘配密钥/密钥与库内不一致/时间戳漂移/伪造尝试
      # 都会落在 {result="rejected"}。零流量（无 agent）时 rate 为 0，表达式为假，不误报。
      # 排查：控制面日志中的 "agent-signature mismatch" / "no signing secret" / "out of skew"，
      # 以及 GET /api/v1/agents 确认该 agent 是否有 per-agent 密钥（secret 非空）。
      - alert: OpsMeshAgentSignatureRejected
        expr: rate(opsmesh_agent_signature_verifications_total{result="rejected"}[5m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "agent gRPC 请求持续被验签拒绝"
          description: "近 10 分钟持续存在被拒验签（{{ $value }} 次/秒）：agent 密钥缺失/不匹配或有人伪造上报。请核对控制面日志与 agents 表的 secret 列。"

      # 遗留算法仍在生产使用（滚动升级未收尾）：v1 不覆盖载荷，同秒内可被改写重放。
      # 仅在确实有 v1 流量时告警；升级完成（全部 v2）后自动清零。
      - alert: OpsMeshAgentSignatureLegacyAlg
        expr: rate(opsmesh_agent_signature_verifications_total{alg="v1",result="ok"}[10m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "仍有 agent 使用 v1 签名算法（不覆盖载荷）"
          description: "v1 签名不含载荷摘要，同秒内任务结果可被篡改重放已持续 30 分钟：请按构建顺序升级 agent 到 v2（控制面已兼容 v1/v2，可先升级控制面）。"

      # 全舰队预共享密钥兜底仍在被使用 = 密钥未按 agent 隔离（单机泄漏即全舰队可冒充）。
      - alert: OpsMeshAgentFleetKeyInUse
        expr: rate(opsmesh_agent_signing_key_source_total{source="fleet"}[10m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "仍有 agent 依赖全舰队预共享签名密钥"
          description: "近 30 分钟存在以 --grpc-signature-key 兜底验签通过（{{ $value }} 次/秒）：建议改用 install token + TLS 纳管，使每台 agent 持有独立密钥，实现单机吊销与轮换。"

  # ==========================================================================
  # 微服务侧业务序列（pkg/metrics 渲染）—— 2026-10-02 接入。
  #
  # 命名口径（写规则最容易搞错的一处，两套命名族在同一个栈里并存）：
  #   - 微服务**不带** opsmesh_ 前缀；控制面（internal/metrics）才带。
  #   - 事件计数在 counter 家族里，用 name 标签区分具体指标：
  #         business_metrics_total{name="task_reclaim_failures"} 12
  #   - 当前值在 gauge 家族里，同样是 name 标签：
  #         business_metrics{name="autoscaler_decision_history_entries"} 500
  #   ⇒ rate()/increase() 只能配 business_metrics_total。选错家族**不会报错**，
  #     只会得到一条恒为 no data 的规则——正是本项目反复登记的那类"静默失效"。
  #
  # 本组每条规则引用的 name 值都由 internal/controlplane/metrics_contract_test.go
  # 对账到 services/** 里真实的 Add/SetBusinessMetric 调用；而「该服务到底有没有被抓取」
  # 由 validate-deploy-assets.sh §11c 判定。两者合起来才把「配了告警其实收不到数据」堵住：
  # 此前 autoscaler-svc 在 prometheus.yml 里没有 job（却在豁免表里挂着一条已失效的理由），
  # 若当时已有下面那条 autoscaler 决策历史饱和告警，它会永远不触发且无人知晓。
  # ==========================================================================
  - name: opsmesh_microservice_business_alerts
    interval: 1m
    rules:
      # 定时任务派发的落库失败：task-svc 先改内存里的 last_fired_at 再写库，写库失败即
      # "这一分钟到底触发过没有"失去事实来源——下一分钟会重复派发，或因为不在本轮窗口而漏派。
      # 该序列由调度循环每轮就地计数（不是从别处反推），失败必须单独成列：
      # 只有 fired 时，"一轮全部失败"与"本轮无到点任务"在指标上同形。
      - alert: OpsMeshTaskScheduledFireFailed
        expr: sum by (job) (increase(business_metrics_total{name="task_scheduled_fire_failures"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "定时任务派发落库失败（{{ $labels.job }}）"
          description: "近 10 分钟有 {{ $value }} 条到点任务更新 last_fired_at 失败：这些任务的触发事实已不可信，可能重复派发或漏派。请查 task-svc 的存储后端（TASK_SVC_STORE_TYPE / TASK_SVC_DSN）与 tasks 表写入错误日志（[fire] UpdateTask failed）。"

      # 卡住的 running 任务：reclaim 是把"心跳已过期却仍 running"的任务放回 pending 的唯一出口。
      # 它失败 ⇒ 任务永久显示"执行中"，队列看起来正常但实际不再前进。
      - alert: OpsMeshTaskReclaimFailed
        expr: sum by (job) (increase(business_metrics_total{name="task_reclaim_failures"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "卡死任务回收落库失败（{{ $labels.job }}）"
          description: "近 10 分钟有 {{ $value }} 条超期 running 任务回收失败：它们会一直显示执行中，agent 已死的任务不再重新排队。请查 task-svc 存储后端与 [reclaim] UpdateTask failed 日志。"

      # 领取/回报是 agent ↔ task-svc 的两条主通道。用**占比**而不是绝对次数：
      # 绝对阈值在 20 节点的小集群永不触发、在 5000 节点上又太迟钝（同 DeviceOffline 的教训）。
      # 分母 clamp_min(...,1)：零流量时 0/0=NaN，而 NaN 在 PromQL 里等于"不评估"——静默失效。
      - alert: OpsMeshTaskClaimFailureRate
        expr: sum(increase(business_metrics_total{name="task_claim_failures"}[10m])) / clamp_min(sum(increase(business_metrics_total{name="task_claims"}[10m])) + sum(increase(business_metrics_total{name="task_claim_failures"}[10m])), 1) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "任务领取失败率 {{ $value | humanizePercentage }}"
          description: "近 10 分钟 agent 领取任务的失败占比超过 20%：常见成因是租户不匹配（领取侧按 tenant 过滤后无可领任务）、任务已被他人领取、或存储后端抖动。"

      - alert: OpsMeshTaskReportFailureRate
        expr: sum(increase(business_metrics_total{name="task_report_failures"}[10m])) / clamp_min(sum(increase(business_metrics_total{name="task_reports"}[10m])) + sum(increase(business_metrics_total{name="task_report_failures"}[10m])), 1) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "任务结果回报失败率 {{ $value | humanizePercentage }}"
          description: "近 10 分钟 agent 回报执行结果的失败占比超过 20%：结果没落库 ⇒ 控制面看到的任务状态是陈旧的，重试会重复执行副作用。"

      # 这条刻意是 critical：它对应的缺陷形态是"本地状态改成功、请求返回 200，而外部通道什么都没收到"。
      # 运维据此以为 on-call 已被呼叫，比直接返回 5xx 危险得多（此前这些调用点写作 `_ = breaker.Execute(...)`）。
      # 保留 action 标签（ack / resolve）：把 resolve 的失败说成"确认失败"会把排查方向指错。
      - alert: OpsMeshAlertExternalNotifyFailed
        expr: sum by (action) (increase(business_metrics_total{name="alert_external_notify_failures"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "告警状态已落库但外部通知失败（action={{ $labels.action }}）"
          description: "近 10 分钟有 {{ $value }} 次 action={{ $labels.action }} 的外部通知未送达（本地状态已变更、接口返回成功）：on-call 实际没被通知。ack=确认、resolve=解决，两者的排查方向不同故保留标签。请核对告警通道配置与 alert-svc 日志中的「外部通知失败」行，必要时在通道恢复后重放。"

      # 规则事件 → 通知器（带熔断器）那条路径的失败占比。与上一条同源不同路：
      # 上条是 ack/resolve 的反向同步，本条是规则触发时的正向推送。
      - alert: OpsMeshAlertNotifyFailureRate
        expr: sum by (tenant_id) (increase(business_metrics_total{name="alert_notification_failures"}[10m])) / clamp_min(sum by (tenant_id) (increase(business_metrics_total{name="alert_notifications"}[10m])) + sum by (tenant_id) (increase(business_metrics_total{name="alert_notification_failures"}[10m])), 1) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "租户 {{ $labels.tenant_id }} 的告警推送失败率 {{ $value | humanizePercentage }}"
          description: "近 10 分钟告警推送失败占比超过 20%：熔断器可能已打开（下游通道故障），此时告警只入库不外发。"

      # 内存后端的环形缓冲淘汰 = 日志已不可恢复地丢失。
      # 出厂默认 LOG_SVC_BACKEND=loki，而 initLogStore 对未知/失败后端是 Fatalf 而不是静默回落内存，
      # 所以本条触发即说明"当前确实在用内存后端"——这本身就是需要人来确认的部署事实。
      - alert: OpsMeshLogMemoryBackendDropping
        expr: sum(increase(business_metrics_total{name="log_memory_dropped"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "日志内存缓冲已淘汰 {{ $value }} 条（不可恢复）"
          description: "log-svc 的内存后端按容量截断（MemoryConfig.Capacity=5000，当前无环境变量/配置文件入口可调），被淘汰的条目在检索面上与「从未写入」同形——故有此计数。生产应改用 LOG_SVC_BACKEND=loki 或 sql；出现本告警即说明该实例正在用内存后端跑。"

      # 500 是 services/autoscaler-svc/internal/evaluator/evaluator.go 的 maxDecisionHistory。
      # 到达上限后 appendDecisionLocked 从头部丢弃：扩容/审计要用的决策历史开始静默丢失。
      # 阈值与代码常量的对账由 metrics_contract_test.go 判定，改代码不改规则会判红。
      - alert: OpsMeshAutoscalerDecisionHistorySaturated
        expr: business_metrics{name="autoscaler_decision_history_entries"} >= 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "弹性决策历史已达缓冲上限（开始丢弃最旧记录）"
          description: "autoscaler-svc 的决策历史驻留内存且上限 500 条，超出即从头丢弃。需要更长保留周期时应落库，而不是调大内存缓冲（多副本部署下内存历史还各不相同）。"

      # 基数熔断的可观测性：达到上限后新路径折进 path=":other"、新标签折进 folded=":other"。
      # 这是**故意的**（否则未鉴权入口上的任意 URL 会把注册表撑到 OOM），但副作用是按路径的
      # 面板与告警会失真，所以必须让"正在折叠"这件事本身可告警。
      #
      # 为什么是两条而不是一条并集（2026-10-02 真机跑出来的教训）：`increase()` 的结果会丢掉
      # `__name__`，所以把**同一进程上共存的两条序列**放进一个 `{__name__=~"a|b"}` 里再喂给
      # increase()，Prometheus 会报 `vector cannot contain metrics with the same labelset`
      # ——规则 health=err、永不触发，而**语法完全合法**，语法检查与引用对账都拦不住它。
      # 下面 HTTP 侧那条并集是安全的：控制面只出 `opsmesh_` 前缀名、微服务只出无前缀名，
      # 两个名字不会落在同一个 instance 上（与 HighErrorRate 同构）。
      - alert: OpsMeshMetricsCardinalityFolding
        expr: sum by (job) (increase({__name__=~"http_metrics_series_dropped_total|opsmesh_http_metrics_series_dropped_total"}[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 的 HTTP 指标基数已触顶并折叠到 :other"
          description: "近 30 分钟有 {{ $value }} 次路径写入被折叠：内存保住了，但按路径的看板与告警已失去分辨率。排查方向——谁在打未注册路由（扫描器、拼错的 SDK、把 ID 塞进路径的调用方），必要时收紧入口鉴权与限流。"

      # 业务标签侧的折叠只能单独一条：business_metrics_series_dropped_total 与 HTTP 侧那条
      # 在每个微服务上同时存在，合进一个 increase() 就会撞上面那条 labelset 冲突。
      - alert: OpsMeshBusinessMetricCardinalityFolding
        expr: sum by (job) (increase(business_metrics_series_dropped_total[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 的业务指标标签基数已触顶并折叠到 :other"
          description: "近 30 分钟有 {{ $value }} 次业务指标写入被折叠：说明 name 维度或标签值在膨胀（常见成因是把实体 ID 当标签、或把可变字符串拼进指标名）。按 name 的看板与告警此后不再可信。"
