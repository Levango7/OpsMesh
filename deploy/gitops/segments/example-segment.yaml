# 示例网段配置 — 开发/演示环境
# 与 applicationset.yaml 中 element: segment=example 对应
# 本文件作为 Helm values overlay，叠加在 deploy/helm/opsmesh/values.yaml 之上，
# 仅写差异字段，未出现字段自动回退到默认值。

# ─────────────────────────────────────────────────────────────
# 网段元数据（GitOps 自用，不传给 Helm Chart）
# ─────────────────────────────────────────────────────────────
segment:
  name: example
  cidr: 10.0.1.0/24

# ─────────────────────────────────────────────────────────────
# 控制面配置
# ─────────────────────────────────────────────────────────────
controlplane:
  # 副本数：开发环境 2 副本验证多副本选主；生产建议 3
  replicaCount: 2
  # 持久化后端：多副本必须用 mysql，避免 memory store 数据分裂
  store: mysql
  # 开发环境关闭生产模式强约束
  production: false
  # 开发环境不强制租户头，便于 curl 调试
  requireAuth: false
  # 资源：开发环境适度提升，兼顾演示流畅与成本
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # gRPC TLS：开发环境关闭，降低证书准备成本
  tls:
    enabled: false
  # Cookie Secure：开发环境 HTTP 访问，关闭以允许明文传输 Cookie
  cookieSecure: false

# ─────────────────────────────────────────────────────────────
# MySQL 配置（controlplane.store=mysql 时必需）
# ─────────────────────────────────────────────────────────────
mysql:
  enabled: true
  persistence:
    # 开发环境 10Gi 足够演示数据
    size: 10Gi

# ─────────────────────────────────────────────────────────────
# Redis 配置（状态缓存）
# ─────────────────────────────────────────────────────────────
redis:
  enabled: true
  persistence:
    size: 5Gi

# ─────────────────────────────────────────────────────────────
# Agent 配置
# ─────────────────────────────────────────────────────────────
agent:
  enabled: true
  # agent.segment 由 ApplicationSet 透传，此处可省略；显式写则覆盖透传值
  # segment: example
  # 演示模式：注册预置示例任务，便于快速体验（生产务必关闭）
  demo: true

# ─────────────────────────────────────────────────────────────
# TLS 配置（可选，开发环境关闭）
# ─────────────────────────────────────────────────────────────
tls:
  enabled: false

# ─────────────────────────────────────────────────────────────
# 联邦 peers 配置（可选，开发环境单网段关闭）
# ─────────────────────────────────────────────────────────────
federation:
  enabled: false