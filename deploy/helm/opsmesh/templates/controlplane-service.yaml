apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsmesh.controlplane.serviceName" . }}
  labels:
    {{- include "opsmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "opsmesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
