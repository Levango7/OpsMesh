{{- if .Values.observability.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "opsmesh.controlplane.serviceName" . }}
  labels:
    {{- include "opsmesh.labels" . | nindent 4 }}
spec:
  groups:
    - name: opsmesh.rules
      rules:
        # agent 离线：在线 agent 数低于期望持续 5m
        # expected 默认 1，按集群规模调整 expr 中的阈值
        - alert: OpsMeshAgentsOffline
          expr: opsmesh_agents_total < 1
          for: 5m
          labels:
            severity: critical
            component: agent
          annotations:
            summary: "OpsMesh agents offline"
            description: "在线 agent 数 ({{ "{{ $value }}" }}) 低于期望 (1) 已持续 5m，请检查 agent DaemonSet 状态与网络注册。"
        # 任务失败率高：5m 内失败率 > 30%
        - alert: OpsMeshTaskFailureRateHigh
          expr: rate(opsmesh_tasks_total{status="failed"}[5m]) / rate(opsmesh_tasks_total[5m]) > 0.3
          for: 5m
          labels:
            severity: warning
            component: controlplane
          annotations:
            summary: "OpsMesh task failure rate high"
            description: "任务失败率超过 30% 已持续 5m，请排查任务日志与 agent 执行环境。"
        # 队列堆积：队列深度 > 100 持续 5m
        - alert: OpsMeshTaskQueueBacklog
          expr: opsmesh_task_queue_depth > 100
          for: 5m
          labels:
            severity: warning
            component: controlplane
          annotations:
            summary: "OpsMesh task queue backlog"
            description: "任务队列深度超过 100 已持续 5m，请检查调度器吞吐与 agent 容量。"
        # 存储层吞错（与 deploy/monitoring/prometheus-alerts.yml 的 StoreSwallowedErrors 同一条）。
        # 名字刻意与 compose 侧**完全一致**而不是套本分组的 OpsMesh 前缀：alertname 是值班侧
        # 静默规则、抑制规则与 runbook 检索的键，两条装载路径用两个名字就等于两条不同的告警。
        # 注：这条不进 compose↔chart 的镜像测试范围（那个测试只管
        # opsmesh_microservice_business_alerts 这一组），所以它的漂移目前靠文档与人工评审拦。
        - alert: StoreSwallowedErrors
          expr: increase(opsmesh_store_write_failures_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            component: controlplane
          annotations:
            summary: "OpsMesh store swallowed errors"
            description: "存储层近 10 分钟吞掉读写错误：Store 不返回 error，表现是数据静默丢失。用 kubectl logs 抓 [store] 行，或 GET /api/v1/admin/store-failures 看按操作聚合。"
        # 独立进程插件（TD-62）：扩展点调用同步发生在请求路径上，
        # "插件不可达"的客户症状是"平台配置改不动了"（config.preSet 是 fail-closed）。
        # expr 与 compose 侧 deploy/monitoring/prometheus-alerts.yml 的 opsmesh_plugin_alerts 一致，
        # 命名也保持一致——alertname 是值班侧检索与静默规则的键。
        # 未配 --plugin-manifest 时 opsmesh_plugin_hook_calls_total 恒为 0 ⇒ 这两条不触发。
        - alert: OpsMeshPluginHookFailed
          expr: sum by (hook) (increase(opsmesh_plugin_hook_calls_total{outcome="error"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
            component: controlplane
          annotations:
            summary: '插件扩展点 {{ "{{ $labels.hook }}" }} 调用失败（近 10 分钟 {{ "{{ $value }}" }} 次）'
            description: "独立进程插件不可达/超时/返回非 2xx 或坏响应。config.preSet 与 task.preClaim 是 fail-closed（配置写入被拒 400、领取返回空）；config.postSet 只丢一次变更通知。排查：插件 /health、两侧令牌是否一致、控制面日志「插件钩子」行。"
        - alert: OpsMeshPluginHookDeniedBurst
          expr: sum by (hook) (increase(opsmesh_plugin_hook_calls_total{outcome="denied"}[15m])) > 5
          for: 5m
          labels:
            severity: warning
            component: controlplane
          annotations:
            summary: '插件在批量否决扩展点 {{ "{{ $labels.hook }}" }}'
            description: "denied 说明策略在正常工作，批量出现通常是插件策略过严或调用方在拿被挡的参数反复重试。先看插件侧日志的 reason（宿主不回吐给客户端）。"
    # ------------------------------------------------------------------
    # 微服务业务面告警（2026-10-02 接入）——与 deploy/monitoring/prometheus-alerts.yml
    # 里同名分组是**同一组规则的两份装载副本**：compose 路径由 prometheus.yml 的 rule_files
    # 读那个文件，K8s 路径由 Prometheus Operator 读这里的 PrometheusRule CR。
    # 手抄两份必然漂移，所以漂移由机器钉：internal/controlplane/metrics_contract_test.go 的
    # TestBusinessRuleMirrorBetweenComposeAndChart 逐条比对 alert 名 / expr / for / severity。
    # 未启用对应微服务（values 里 services.<name>.enabled=false）时这组规则恒为 no data——
    # 不触发也不误报，但请把「没有告警」和「健康」当成两件事。
    # 注：注解里的 PromQL 模板占位符在本文件必须写成「双花括号 + 引号包裹」的形式，
    # 否则它们在 Helm 渲染期就被执行（上面 OpsMeshAgentsOffline 就是这么写的）。
    # ------------------------------------------------------------------
    - name: opsmesh_microservice_business_alerts
      interval: 1m
      rules:
        - alert: OpsMeshTaskScheduledFireFailed
          expr: sum by (job) (increase(business_metrics_total{name="task_scheduled_fire_failures"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 定时任务派发落库失败（{{ "{{ $labels.job }}" }}）
            description: 近 10 分钟有 {{ "{{ $value }}" }} 条到点任务更新 last_fired_at 失败：这些任务的触发事实已不可信，可能重复派发或漏派。请查 task-svc 的存储后端（TASK_SVC_STORE_TYPE / TASK_SVC_DSN）与 tasks 表写入错误日志（[fire] UpdateTask failed）。
        - alert: OpsMeshTaskReclaimFailed
          expr: sum by (job) (increase(business_metrics_total{name="task_reclaim_failures"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 卡死任务回收落库失败（{{ "{{ $labels.job }}" }}）
            description: 近 10 分钟有 {{ "{{ $value }}" }} 条超期 running 任务回收失败：它们会一直显示执行中，agent 已死的任务不再重新排队。请查 task-svc 存储后端与 [reclaim] UpdateTask failed 日志。
        - alert: OpsMeshTaskClaimFailureRate
          expr: sum(increase(business_metrics_total{name="task_claim_failures"}[10m])) / clamp_min(sum(increase(business_metrics_total{name="task_claims"}[10m])) + sum(increase(business_metrics_total{name="task_claim_failures"}[10m])), 1) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 任务领取失败率 {{ "{{ $value | humanizePercentage }}" }}
            description: 近 10 分钟 agent 领取任务的失败占比超过 20%：常见成因是租户不匹配（领取侧按 tenant 过滤后无可领任务）、任务已被他人领取、或存储后端抖动。
        - alert: OpsMeshTaskReportFailureRate
          expr: sum(increase(business_metrics_total{name="task_report_failures"}[10m])) / clamp_min(sum(increase(business_metrics_total{name="task_reports"}[10m])) + sum(increase(business_metrics_total{name="task_report_failures"}[10m])), 1) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 任务结果回报失败率 {{ "{{ $value | humanizePercentage }}" }}
            description: 近 10 分钟 agent 回报执行结果的失败占比超过 20%：结果没落库 ⇒ 控制面看到的任务状态是陈旧的，重试会重复执行副作用。
        # 死信此前是静默路径：重试耗尽后任务永久不再下发，既无指标也无告警。
        # 与 deploy/monitoring/prometheus-alerts.yml 里同名规则是同一组规则的两份装载副本，
        # 漂移由 TestBusinessRuleMirrorBetweenComposeAndChart 逐条钉住。
        - alert: OpsMeshTaskDeadLettered
          expr: sum(increase(business_metrics_total{name="task_dead_lettered"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 有任务进入死信（重试已耗尽）
            description: 近 15 分钟有任务因重试次数耗尽被判死信，之后不会再被下发。请查任务结果的 exit code 与 stderr：常见成因是命令本身失败、agent 执行环境缺依赖、或 timeout 设置过短导致每次都跑到超时。
        - alert: OpsMeshAlertExternalNotifyFailed
          expr: sum by (action) (increase(business_metrics_total{name="alert_external_notify_failures"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 告警状态已落库但外部通知失败（action={{ "{{ $labels.action }}" }}）
            description: 近 10 分钟有 {{ "{{ $value }}" }} 次 action={{ "{{ $labels.action }}" }} 的外部通知未送达（本地状态已变更、接口返回成功）：on-call 实际没被通知。ack=确认、resolve=解决，两者的排查方向不同故保留标签。请核对告警通道配置与 alert-svc 日志中的「外部通知失败」行，必要时在通道恢复后重放。
        - alert: OpsMeshAlertNotifyFailureRate
          expr: sum by (tenant_id) (increase(business_metrics_total{name="alert_notification_failures"}[10m])) / clamp_min(sum by (tenant_id) (increase(business_metrics_total{name="alert_notifications"}[10m])) + sum by (tenant_id) (increase(business_metrics_total{name="alert_notification_failures"}[10m])), 1) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 租户 {{ "{{ $labels.tenant_id }}" }} 的告警推送失败率 {{ "{{ $value | humanizePercentage }}" }}
            description: 近 10 分钟告警推送失败占比超过 20%：熔断器可能已打开（下游通道故障），此时告警只入库不外发。
        - alert: OpsMeshLogMemoryBackendDropping
          expr: sum(increase(business_metrics_total{name="log_memory_dropped"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 日志内存缓冲已淘汰 {{ "{{ $value }}" }} 条（不可恢复）
            description: log-svc 的内存后端按容量截断（MemoryConfig.Capacity=5000，当前无环境变量/配置文件入口可调），被淘汰的条目在检索面上与「从未写入」同形——故有此计数。生产应改用 LOG_SVC_BACKEND=loki 或 sql；出现本告警即说明该实例正在用内存后端跑。
        - alert: OpsMeshAutoscalerDecisionHistorySaturated
          expr: business_metrics{name="autoscaler_decision_history_entries"} >= 500
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 弹性决策历史已达缓冲上限（开始丢弃最旧记录）
            description: autoscaler-svc 的决策历史驻留内存且上限 500 条，超出即从头丢弃。需要更长保留周期时应落库，而不是调大内存缓冲（多副本部署下内存历史还各不相同）。
        - alert: OpsMeshMetricsCardinalityFolding
          expr: sum by (job) (increase({__name__=~"http_metrics_series_dropped_total|opsmesh_http_metrics_series_dropped_total"}[30m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ "{{ $labels.job }}" }} 的 HTTP 指标基数已触顶并折叠到 :other'
            description: 近 30 分钟有 {{ "{{ $value }}" }} 次路径写入被折叠：内存保住了，但按路径的看板与告警已失去分辨率。排查方向——谁在打未注册路由（扫描器、拼错的 SDK、把 ID 塞进路径的调用方），必要时收紧入口鉴权与限流。
        - alert: OpsMeshBusinessMetricCardinalityFolding
          expr: sum by (job) (increase(business_metrics_series_dropped_total[30m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ "{{ $labels.job }}" }} 的业务指标标签基数已触顶并折叠到 :other'
            description: 近 30 分钟有 {{ "{{ $value }}" }} 次业务指标写入被折叠：说明 name 维度或标签值在膨胀（常见成因是把实体 ID 当标签、或把可变字符串拼进指标名）。按 name 的看板与告警此后不再可信。
{{- end -}}
