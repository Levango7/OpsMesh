{{- if .Values.controlplane.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opsmesh.fullname" . }}-controlplane
  labels:
    {{- include "opsmesh.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opsmesh.fullname" . }}-controlplane
  minReplicas: {{ .Values.controlplane.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.controlplane.autoscaling.maxReplicas | default 10 }}
  metrics:
    {{- if .Values.controlplane.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.controlplane.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.controlplane.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.controlplane.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}