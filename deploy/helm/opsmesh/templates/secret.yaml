apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsmesh.fullname" . }}-secret
  labels:
    {{- include "opsmesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  # provision-secret：B1 自动纳管 install token HMAC 签名密钥
  # 未显式提供时生成随机 32 字节十六进制（每次 helm upgrade 会轮换，多副本需 --set 显式固定）
  provision-secret: {{ default (randAlphaNum 32) .Values.controlplane.provisionSecret | quote }}
  {{- if and .Values.mysql.enabled (eq .Values.controlplane.store "mysql") }}
  # MySQL root 密码（未提供则随机生成；生产请用 --set 显式注入并妥善保管）
  mysql-root-password: {{ default (randAlphaNum 24) .Values.mysql.rootPassword | quote }}
  # MySQL 业务用户密码
  mysql-password: {{ default (randAlphaNum 24) .Values.mysql.password | quote }}
  # 拼接好的 MySQL DSN，供 controlplane 直接消费
  mysql-dsn: {{ printf "%s:%s@tcp(%s:3306)/%s?parseTime=true&multiStatements=true" .Values.mysql.user (default (randAlphaNum 24) .Values.mysql.password) (include "opsmesh.mysql.serviceName" .) .Values.mysql.database | quote }}
  {{- end }}
