{{- $secretName := printf "%s-secret" (include "opsmesh.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingJwt := "" }}
{{- $existingProvision := "" }}
{{- $existingAdminPwd := "" }}
{{- $existingMysqlPwd := "" }}
{{- $existingMysqlRootPwd := "" }}
{{- $existingEncKey := "" }}
{{- if $existingSecret }}
{{-   $existingJwt = index $existingSecret.data "jwt-secret" | default "" | b64dec }}
{{-   $existingProvision = index $existingSecret.data "provision-secret" | default "" | b64dec }}
{{-   $existingAdminPwd = index $existingSecret.data "admin-password" | default "" | b64dec }}
{{-   $existingMysqlPwd = index $existingSecret.data "mysql-password" | default "" | b64dec }}
{{-   $existingMysqlRootPwd = index $existingSecret.data "mysql-root-password" | default "" | b64dec }}
{{-   $existingEncKey = index $existingSecret.data "encryption-key" | default "" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsmesh.fullname" . }}-secret
  labels:
    {{- include "opsmesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  # provision-secret：自动纳管 install token HMAC 签名密钥。
  # 优先级与 jwt-secret 一致：显式值 > 已有 Secret（upgrade 复用，不轮换）> 首次随机。
  # 轮换会使已签发的 install token 全部失效（agent 无法再纳管），故 upgrade 必须复用。
  provision-secret: {{ if .Values.controlplane.provisionSecret }}{{ .Values.controlplane.provisionSecret | quote }}{{ else if $existingProvision }}{{ $existingProvision | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  # jwt-secret：用户中心 JWT 签发密钥（HS256，多副本须一致）。
  # 优先级：显式值 > 已有 Secret（upgrade 复用，不轮换） > 首次随机。
  # lookup 返回 data 为 base64，必须 b64dec 还原明文再放 stringData（避免双编码）。
  jwt-secret: {{ if .Values.controlplane.jwtSecret }}{{ .Values.controlplane.jwtSecret | quote }}{{ else if $existingJwt }}{{ $existingJwt | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  # admin-password：内置 admin 账号的初始口令。
  # 优先级同样为：显式值 > 已有 Secret（upgrade 复用，不轮换）> 首次随机生成。
  # 必须复用而非每次重新随机：控制面只在 admin 仍为公开弱口令 admin123 时才应用该值，
  # 若 upgrade 时换新值而库内已是旧口令，运维手里的口令就会失效（锁死）。
  # 随机值前置 "Aa1" 以保证同时含大写/小写/数字——控制面强口令校验要求，纯 randAlphaNum
  # 有约 0.4% 概率不含数字而被拒绝启动。
  admin-password: {{ if .Values.controlplane.adminPassword }}{{ .Values.controlplane.adminPassword | quote }}{{ else if $existingAdminPwd }}{{ $existingAdminPwd | quote }}{{ else }}{{ printf "Aa1%s" (randAlphaNum 28) | quote }}{{ end }}
  # encryption-key：kubeconfig AES-256-GCM 静态加密密钥（base64 编码的 32 字节；生产必须非空，
  # 否则控制面 Validate 拒绝启动）。优先级与 jwt-secret 同构：显式值 > 已有 Secret（upgrade 复用）
  # > 首次随机。严禁轮换——已加密 kubeconfig 只能用同一密钥解密，换值=被托管主机全部失控。
  # randBytes 32 的输出即 base64(32 随机字节)（sprig 内部做了 base64 编码），恰好满足控制面
  # "base64 解码后必须为 32 字节" 的校验；不可用 randAlphaNum（解码后长度不足 32）。
  encryption-key: {{ if .Values.controlplane.encryptionKey }}{{ .Values.controlplane.encryptionKey | quote }}{{ else if $existingEncKey }}{{ $existingEncKey | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
  {{- if and .Values.mysql.enabled (eq .Values.controlplane.store "mysql") }}
  # MySQL 密码同样 upgrade 复用：MySQL 容器密码仅在数据目录首次初始化时生效，
  # 升级若轮换密码，控制面将拿新 DSN 连已初始化的旧库 → 认证失败、生产不可用。
  {{- $mysqlPassword := "" }}
  {{- $mysqlRootPassword := "" }}
  {{- if .Values.mysql.password }}
  {{-   $mysqlPassword = .Values.mysql.password }}
  {{- else if $existingMysqlPwd }}
  {{-   $mysqlPassword = $existingMysqlPwd }}
  {{- else }}
  {{-   $mysqlPassword = randAlphaNum 24 }}
  {{- end }}
  {{- if .Values.mysql.rootPassword }}
  {{-   $mysqlRootPassword = .Values.mysql.rootPassword }}
  {{- else if $existingMysqlRootPwd }}
  {{-   $mysqlRootPassword = $existingMysqlRootPwd }}
  {{- else }}
  {{-   $mysqlRootPassword = randAlphaNum 24 }}
  {{- end }}
  # MySQL root 密码（首次随机生成并随 Secret 持久复用；生产建议 --set 显式注入并妥善保管）
  mysql-root-password: {{ $mysqlRootPassword | quote }}
  # MySQL 业务用户密码
  mysql-password: {{ $mysqlPassword | quote }}
  # 拼接好的 MySQL DSN，供 controlplane 直接消费
  mysql-dsn: {{ printf "%s:%s@tcp(%s:3306)/%s?parseTime=true&multiStatements=true" .Values.mysql.user $mysqlPassword (include "opsmesh.mysql.serviceName" .) .Values.mysql.database | quote }}
  {{- end }}
