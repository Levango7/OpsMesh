{{- if and .Values.agent.enabled .Values.agent.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsmesh.agent.serviceName" . }}
  labels:
    {{- include "opsmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "opsmesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
{{- end -}}
