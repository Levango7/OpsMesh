## @section ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

## @section Ingress（可选）
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opsmesh.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

## @section Observability
podAnnotations: {}
podLabels: {}

## @section Observability
observability:
  # Prometheus Operator ServiceMonitor（控制面 /metrics:9091 采集）
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  # Prometheus Operator PrometheusRule（内置告警规则：agent 离线 / 任务失败率高 / 队列堆积）
  prometheusRule:
    enabled: false
  # 网络策略（可选，默认关闭）：控制面入站 + agent 出站，限缩 Pod 间网络访问
  networkPolicy:
    enabled: false  
