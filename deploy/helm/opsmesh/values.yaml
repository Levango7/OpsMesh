        memory: 256Mi
    env: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  config_svc:
    # 配置/密钥/通知通道服务（config-svc/pkg/config：CONFIG_SVC_HTTP_PORT 8083 / GRPC 50054）
    enabled: false
    image:
      repository: ghcr.io/levango7/config-svc
      tag: "latest"
      digest: ""
