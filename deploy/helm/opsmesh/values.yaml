    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  alert_svc:
    # 告警服务（alert-svc/pkg/config：ALERT_SVC_HTTP_PORT 8080 / GRPC 50051）
    enabled: false
    image:
