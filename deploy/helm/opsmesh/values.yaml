# OpsMesh Helm Chart 默认值（开发/体验环境）
# 生产环境请使用 -f values-production.yaml 覆盖关键项。
# 文档：https://github.com/opsmesh/opsmesh  端口约定 HTTP 8080 / gRPC 9090 / metrics 9091

## @section Global
global:
  # 镜像仓库前缀，空表示使用 Docker Hub 公共镜像；私有环境填 registry.example.com/
  imageRegistry: ""
  # 镜像拉取凭证（私有仓库必填）
  imagePullSecrets: []
  #  name: myregistrykey
  # 存储类，空表示使用集群默认 StorageClass
  storageClass: ""

## @section Controlplane
controlplane:
  image:
    repository: opsmesh/opsmesh
    # 镜像 tag：开发环境用 latest；生产环境用 --set controlplane.image.tag=<sha> 或 GitOps 写回
    tag: "latest"
    # 镜像 digest（完整形式 "sha256:<hex>"）：非空时优先于 tag，引用不可变镜像。
    # 由 CI（build-push-action digest 输出）经 GitOps 写回；digest 钉死后 tag 仅作可读标记。
    digest: ""
    pullPolicy: IfNotPresent
  # 控制面副本数；>1 时务必设置 store=mysql，否则 memory 多副本数据分裂
  replicaCount: 1
  # 持久化后端：memory（默认零依赖） | mysql（数据本地化，多副本必需）
  store: memory
  # 生产模式：默认开启 require-auth，并对 store=memory 强告警
  production: false
  # 要求网关注入 X-Tenant-ID，缺失则拒绝（生产 hardening）
  requireAuth: false
  # 控制面对外 HTTP 地址（拼接 bootstrap 安装命令）；空则回退 127.0.0.1:<http-port>
  advertiseAddr: ""
  # gRPC TLS / mTLS
  tls:
    enabled: false
    # 证书需以 Secret 形式预置，键名 tls.crt / tls.key / ca.crt
    secretName: opsmesh-tls
  # 任务租约租期秒；超期未上报结果则复位重调度
  taskLeaseSec: 300
  # 任务失败重试上限；超出置 failed（死信）
  taskMaxRetries: 3
  # 选主租约秒
  leaderTTLSec: 15
  leaderTickSec: 5
  # F5 离线超龄自动归档阈值（分钟）
  archiveAgeMin: 1440
  # 自动纳管 install token 的 HMAC 签名密钥；空则本实例随机生成（多副本需一致）
  provisionSecret: ""
  # 用户中心 JWT 签发密钥（HS256，多副本必须一致）。空=helm 首次安装随机生成并固化。
  # 生产务必 --set 注入，长度≥32 字节。
  jwtSecret: ""
  # Cookie Secure 标志：控制 at/rt HttpOnly Cookie 的 Secure 属性。
  # true=Cookie 仅经 HTTPS 传输（防中间人窃取会话）；false=Cookie 亦经 HTTP 传输（明文内网/本地开发需要）。
  # 开发默认 false；生产模式（production=true）下代码侧会自动回退 true，但建议显式设置以便审计。
  cookieSecure: false
  # M7 告警 Webhook
  alertWebhookURL: ""
  alertNotifierType: generic
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Pod 水平自动扩缩容（可选）
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80  # 可选
  # 节点选择器/亲和/容忍
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # 额外环境变量（透传到 OPSMESH_* 配置）
  extraEnv: []
  #  name: OPSMESH_DEMO
  #  value: "true"

## @section Agent
agent:
  enabled: true
  image:
    repository: opsmesh/opsmesh-agent
    # 镜像 tag：开发环境用 latest；生产环境用 --set agent.image.tag=<sha> 或 GitOps 写回
    tag: "latest"
    # 镜像 digest（完整形式 "sha256:<hex>"）：非空时优先于 tag，引用不可变镜像。
    digest: ""
    pullPolicy: IfNotPresent
  # agent 所属网段
  segment: default
  # agent 任务 worker 池并发度
  workerConcurrency: 4
  # agent 单任务执行超时
  taskTimeout: 120s
  # agent 身份文件目录（agent.id 落盘于此，重启沿用）。
  # 注意：DaemonSet 使用 hostPath（DirectoryOrCreate 由 kubelet 以 root 创建），
  # 且 K8s 的 fsGroup 对 hostPath 卷不生效——容器 runAsUser=65532 对该目录无写权限时，
  # agent.id 落盘静默回退内存 ID（重启即换新 ID，控制面出现碎片化设备记录，不致命）。
  # 需要身份持久化时：宿主机预建目录并 chown 65532:65532，或为 Pod 增加 initContainer chown。
  dataDir: /var/lib/opsmesh
  # 演示模式：每个 agent 注册预置示例任务（生产务必关闭）
  demo: false
  # 管理节点容忍：让 agent 调度到 control-plane/etcd 节点（单节点体验集群必需）
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # headless Service（供控制面反向连接 agent）
  service:
    enabled: true
  extraEnv: []

## @section MySQL（数据本地化）
mysql:
  enabled: true
  image: mysql:8
  imagePullPolicy: IfNotPresent
  # 数据库与用户名（密码走 Secret）
  database: opsmesh
  user: opsmesh
  # 持久化
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # MySQL 定期备份（渲染 templates/mysql-backup-cronjob.yaml）。
  # 启用条件：mysql.enabled && controlplane.store==mysql && mysql.backup.enabled。
  # 默认开启：store=mysql 时每天 02:00 全库快照到专用 PVC，保留 7 天（DR 基线）。
  backup:
    enabled: true
    schedule: "0 2 * * *"        # 每天 02:00（节点本地时区）
    retentionDays: 7             # 容器内 find -mtime 清理阈值
    historyLimit: 7              # 保留最近 7 个成功 Job 历史
    backoffLimit: 2
    activeDeadlineSeconds: 1800  # 单次最多跑 30 分钟
    storageSize: 20Gi
    storageClass: ""             # 空=集群默认（回退 global.storageClass）

## @section Redis（状态缓存）
redis:
  enabled: true
  image: redis:7
  imagePullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []

## @section Microservices（微服务，默认全部禁用）
# services/ 下 18 个微服务默认不经 Helm 部署——所有子项 enabled=false，
# templates/microservices.yaml 渲染为空，存量 chart 行为 100% 不变（兼容红线）。
# 键名统一用下划线（auth_svc 而非 auth-svc）：规避 helm --set 与模板 range 的连字符键坑。
# 开启单个服务：helm upgrade <release> ./deploy/helm/opsmesh --set services.task_svc.enabled=true
# 端口/健康路径均对照各服务 pkg/config/config.go 与 cmd/*/main.go 源码默认值。
# 镜像名对照 .github/workflows/release.yml matrix 实际推送名：ghcr.io/<owner>/<service>，
# 三连 tag：v<version>（发布）/ <github.sha>（可追溯）/ latest（浮动）。
services:
  auth_svc:
    # 默认 false：不部署。改为 true 渲染 Deployment + Service（HTTP/gRPC 双端口）
    enabled: false
    image:
      repository: ghcr.io/levango7/auth-svc
      tag: "latest"
      # digest（"sha256:<hex>"）非空时优先于 tag，引用不可变镜像（供应链钉死）
      digest: ""
      pullPolicy: IfNotPresent
    # HTTP 端口（=AUTH_SVC_HTTP_PORT 代码默认 8081，健康检查亦在此端口）
    httpPort: 8081
    # gRPC 端口（=AUTH_SVC_GRPC_PORT 代码默认 50052）；纯 HTTP 服务填 0（不渲染 gRPC 端口）
    grpcPort: 50052
    replicas: 1
    # 环境变量前缀（auth-svc/pkg/config/config.go）：模板渲染 <前缀>_STORE_TYPE / <前缀>_DSN
    storeEnvPrefix: "AUTH_SVC"
    # 存储后端：memory（零依赖） | sql（接 MySQL，DSN 自动从 chart Secret mysql-dsn 注入，
    # 需 controlplane.store=mysql 且 mysql.enabled=true，否则渲染空 DSN 回退 memory）
    storeType: "memory"
    probe:
      # auth-svc 健康路径：cmd/auth-svc/main.go mux.HandleFunc("/health", ...)
      path: /health
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 3
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # 额外环境变量（键=env 变量名，值须为字符串；STORE_TYPE/DSN 由 storeEnvPrefix/storeType 自动派生，勿重复填）
    env: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    # 容器级 securityContext：默认空。镜像 USER 为非数字用户名 svc，
    # 设置 runAsNonRoot=true 会导致 kubelet 无法校验（non-numeric user）而拒绝启动，慎用。
    securityContext: {}

  device_svc:
    # 设备/CMDB/纳管发现服务（device-svc/pkg/config：DEVICE_SVC_HTTP_PORT 8081 / GRPC 50052）
    enabled: false
    image:
      repository: ghcr.io/levango7/device-svc
      tag: "latest"
      digest: ""
      pullPolicy: IfNotPresent
    httpPort: 8081
    grpcPort: 50052
    replicas: 1
    storeEnvPrefix: "DEVICE_SVC"
    storeType: "memory"
    probe:
      # device-svc/cmd/device-svc/main.go 健康路径 /health
      path: /health
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 3
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  task_svc:
    # 任务编排/调度服务（task-svc/pkg/config：TASK_SVC_HTTP_PORT 8081 / GRPC 50052）
    enabled: false
    image:
      repository: ghcr.io/levango7/task-svc
