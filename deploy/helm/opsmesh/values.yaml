    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  plugin_svc:
    # 插件市场服务（纯 HTTP，无 gRPC；plugin-svc/pkg/config：PLUGIN_SVC_HTTP_PORT 8082）
    enabled: false
    image:
      repository: ghcr.io/levango7/plugin-svc
