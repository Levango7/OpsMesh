# OpsMesh Helm Chart 默认值（开发/体验环境）
# 生产环境请使用 -f values-production.yaml 覆盖关键项。
# 文档：https://github.com/opsmesh/opsmesh  端口约定 HTTP 8080 / gRPC 9090 / metrics 9091

## @section Global
global:
  # 镜像仓库前缀，空表示使用 Docker Hub 公共镜像；私有环境填 registry.example.com/
  imageRegistry: ""
  # 镜像拉取凭证（私有仓库必填）
  imagePullSecrets: []
  #  name: myregistrykey
  # 存储类，空表示使用集群默认 StorageClass
  storageClass: ""

## @section Controlplane
controlplane:
  image:
    repository: opsmesh/opsmesh
    # 镜像 tag：开发环境用 latest；生产环境用 --set controlplane.image.tag=<sha> 或 GitOps 写回
    tag: "latest"
    pullPolicy: IfNotPresent
  # 控制面副本数；>1 时务必设置 store=mysql，否则 memory 多副本数据分裂
  replicaCount: 1
  # 持久化后端：memory（默认零依赖） | mysql（数据本地化，多副本必需）
  store: memory
  # 生产模式：默认开启 require-auth，并对 store=memory 强告警
  production: false
  # 要求网关注入 X-Tenant-ID，缺失则拒绝（生产 hardening）
  requireAuth: false
  # 控制面对外 HTTP 地址（拼接 bootstrap 安装命令）；空则回退 127.0.0.1:<http-port>
  advertiseAddr: ""
  # gRPC TLS / mTLS
  tls:
    enabled: false
    # 证书需以 Secret 形式预置，键名 tls.crt / tls.key / ca.crt
    secretName: opsmesh-tls
  # 任务租约租期秒；超期未上报结果则复位重调度
  taskLeaseSec: 300
  # 任务失败重试上限；超出置 failed（死信）
  taskMaxRetries: 3
  # 选主租约秒
  leaderTTLSec: 15
  leaderTickSec: 5
  # F5 离线超龄自动归档阈值（分钟）
  archiveAgeMin: 1440
  # 自动纳管 install token 的 HMAC 签名密钥；空则本实例随机生成（多副本需一致）
  provisionSecret: ""
  # 用户中心 JWT 签发密钥（HS256，多副本必须一致）。空=helm 首次安装随机生成并固化。
  # 生产务必 --set 注入，长度≥32 字节。
  jwtSecret: ""
  # Cookie Secure 标志：控制 at/rt HttpOnly Cookie 的 Secure 属性。
  # true=Cookie 仅经 HTTPS 传输（防中间人窃取会话）；false=Cookie 亦经 HTTP 传输（明文内网/本地开发需要）。
  # 开发默认 false；生产模式（production=true）下代码侧会自动回退 true，但建议显式设置以便审计。
  cookieSecure: false
  # M7 告警 Webhook
  alertWebhookURL: ""
  alertNotifierType: generic
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Pod 水平自动扩缩容（可选）
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80  # 可选
  # 节点选择器/亲和/容忍
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # 额外环境变量（透传到 OPSMESH_* 配置）
  extraEnv: []
  #  name: OPSMESH_DEMO
  #  value: "true"

## @section Agent
agent:
  enabled: true
  image:
    repository: opsmesh/opsmesh-agent
    # 镜像 tag：开发环境用 latest；生产环境用 --set agent.image.tag=<sha> 或 GitOps 写回
    tag: "latest"
    pullPolicy: IfNotPresent
  # agent 所属网段
  segment: default
  # agent 任务 worker 池并发度
  workerConcurrency: 4
  # agent 单任务执行超时
  taskTimeout: 120s
  # agent 身份文件目录（agent.id 落盘于此，重启沿用）
  dataDir: /var/lib/opsmesh
  # 演示模式：每个 agent 注册预置示例任务（生产务必关闭）
  demo: false
  # 管理节点容忍：让 agent 调度到 control-plane/etcd 节点（单节点体验集群必需）
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # headless Service（供控制面反向连接 agent）
  service:
    enabled: true
  extraEnv: []

## @section MySQL（数据本地化）
mysql:
  enabled: true
  image: mysql:8
  imagePullPolicy: IfNotPresent
  # 数据库与用户名（密码走 Secret）
  database: opsmesh
  user: opsmesh
  # 持久化
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # MySQL 定期备份（渲染 templates/mysql-backup-cronjob.yaml）。
  # 启用条件：mysql.enabled && controlplane.store==mysql && mysql.backup.enabled。
  # 默认开启：store=mysql 时每天 02:00 全库快照到专用 PVC，保留 7 天（DR 基线）。
  backup:
    enabled: true
    schedule: "0 2 * * *"        # 每天 02:00（节点本地时区）
    retentionDays: 7             # 容器内 find -mtime 清理阈值
    historyLimit: 7              # 保留最近 7 个成功 Job 历史
    backoffLimit: 2
    activeDeadlineSeconds: 1800  # 单次最多跑 30 分钟
    storageSize: 20Gi
    storageClass: ""             # 空=集群默认（回退 global.storageClass）

## @section Redis（状态缓存）
redis:
  enabled: true
  image: redis:7
  imagePullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []

## @section ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

## @section Ingress（可选）
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opsmesh.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

## @section Observability
podAnnotations: {}
podLabels: {}

## @section Observability
observability:
  # Prometheus Operator ServiceMonitor（控制面 /metrics:9091 采集）
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  # Prometheus Operator PrometheusRule（内置告警规则：agent 离线 / 任务失败率高 / 队列堆积）
  prometheusRule:
    enabled: false