        memory: 256Mi
    # 日志后端：memory | sql | loki | es（LOG_SVC_BACKEND，cmd/log-svc/main.go）
    env:
      LOG_SVC_BACKEND: "memory"
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  deploy_svc:
    # 部署/模板/策略/金丝雀服务（deploy-svc/pkg/config：DEPLOY_SVC_HTTP_PORT 8081 / GRPC 50052）
    enabled: false
    image:
      repository: ghcr.io/levango7/deploy-svc
