    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  log_svc:
    # 日志检索服务（gRPC 9090，HTTP 健康检查 8080）。
    # 注意：log-svc 无 <前缀>_STORE_TYPE/DSN env——后端选择走 LOG_SVC_BACKEND（见 env），
    # 故 storeEnvPrefix 留空、storeType 不生效；DSN 需挂配置文件，当前镜像未挂载。
    enabled: false
    image:
      repository: ghcr.io/levango7/log-svc
      tag: "latest"
      digest: ""
      pullPolicy: IfNotPresent
    httpPort: 8080
    grpcPort: 9090
    replicas: 1
    storeEnvPrefix: ""
    storeType: "memory"
    probe:
      # log-svc/cmd/log-svc/main.go newHealthServer 注册的是 /healthz（唯一非 /health 的服务）
      path: /healthz
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 30
