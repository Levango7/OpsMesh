    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}

  aio_svc:
    # AIOps 引擎（纯 HTTP；cmd/aio-svc/main.go：AIO_SVC_PORT 默认 8100）
    enabled: false
    image:
      repository: ghcr.io/levango7/aio-svc
