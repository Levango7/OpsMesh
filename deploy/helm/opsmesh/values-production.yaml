# OpsMesh 生产环境 overlay
# 用法：helm install opsmesh ./deploy/helm/opsmesh -f deploy/helm/opsmesh/values-production.yaml -n opsmesh
# 关键差异：3 副本 + mysql 持久化 + TLS + require-auth + 资源放大

## @section Global
global:
  imageRegistry: ""
  imagePullSecrets: []
  # 生产推荐使用 fast SSD 存储类
  storageClass: ""

## @section Controlplane
controlplane:
  image:
    repository: ghcr.io/levango7/opsmesh-binary
    # 生产环境必须用精确 sha 或 semver：--set controlplane.image.tag=<sha>
    # 或通过 GitOps 写回（ci.yml 闭环，需配置 GITOPS_REPO/GITOPS_PAT secret）。
    # 此处钉死 0.9.0（与 Chart.yaml version 对齐）；禁止改回 latest——latest 不可变追踪，
    # 滚回 / 审计 / 供应链溯源均失效。
    # 版本标签的出处（2026-09-26 起）：打 tag `vX.Y.Z` 时 CI 会推
    # ghcr.io/levango7/opsmesh-binary:X.Y.Z（剥前导 v）+ :latest + :<sha>，与此处口径一致；
    # **注意 0.9.0/0.9.1 当时没有版本标签镜像**（那次 release 的镜像矩阵全灭，见报告 §19），
    # 所以本 overlay 的默认值要在下一次发版（v0.9.2+）后同步更新。
    tag: "0.9.0"
    # 镜像 digest（完整形式 "sha256:<hex>"）：生产强烈建议由 CI 经 GitOps 写回。
    # 非空时优先于 tag 引用不可变镜像，实现部署内容位级可追溯。
    digest: ""
    pullPolicy: IfNotPresent
  # 生产 3 副本 + leader 选举
  replicaCount: 3
  # 生产必须 mysql（多副本数据一致）
  store: mysql
  production: true
  # 生产强制鉴权
  requireAuth: true
  # 控制面对外可达地址（按需改为 Ingress/LB 域名）
  advertiseAddr: ""
  # 生产强制 TLS / mTLS
  tls:
    enabled: true
    secretName: opsmesh-tls
  # Web/REST（8080）监听协议：off = 本 chart 的生产形态——TLS 由 Ingress/LB 终止，
  # 8080 仅 ClusterIP 内可达（kubelet 探针走明文 httpGet）。控制面自身不启 HTTPS，
  # 避免与 Ingress 后端协议冲突。若不用 Ingress 而让控制面直供 HTTPS，改 on
  # （证书 SAN 须含访问域名；探针自动转 HTTPS）。
  # 注意：off 时若把 8080 以 NodePort/LoadBalancer 直接暴露，即为明文传输口令与会话。
  httpTLS: "off"
  taskLeaseSec: 300
  taskMaxRetries: 3
  leaderTTLSec: 15
  leaderTickSec: 5
  archiveAgeMin: 1440
  # provisionSecret 务必显式注入（多副本需一致），建议 helm install --set controlplane.provisionSecret=$(openssl rand -hex 32)
  provisionSecret: ""
  # jwtSecret 务必显式注入（多副本需一致），与 provisionSecret 同法：
  # helm install ... --set controlplane.jwtSecret=$(openssl rand -hex 32)
  jwtSecret: ""
  # adminPassword：内置 admin 初始口令。留空=helm 首次安装随机生成并写入 Secret（upgrade 复用）；
  # 生产推荐显式注入：--set controlplane.adminPassword="$(openssl rand -base64 24)"
  # 读取随机值：kubectl get secret <release>-secret -o jsonpath='{.data.admin-password}' | base64 -d; echo
  adminPassword: ""
  # adminPasswordForceReset：口令遗失时置 true + adminPassword 覆盖（一次性用，用完请改回 false）。
  adminPasswordForceReset: false
  # encryptionKey：kubeconfig 静态加密密钥（等保三级）。留空=首次安装随机生成 32 字节并固化进
  # Secret（upgrade 复用）；生产建议显式注入并离线备份：
  #   --set controlplane.encryptionKey="$(openssl rand 32 | base64 -w0)"
  # 该值丢失或轮换 → 已加密 kubeconfig 无法解密，被托管主机需重新纳管。
  encryptionKey: ""
  # sessionStore：多副本会话共享（本 overlay 3 副本 + HPA 2~10，必须有共享后端，
  # 否则控制面 Validate 直接拒绝启动）。留空=模板自动指向 chart 内置 Redis（推荐，无密码、
  # NetworkPolicy 隔离）；外部/带密码 Redis 改用 controlplane.extraEnv 注入
  # OPSMESH_SESSION_STORE（secretKeyRef），extraEnv 同名可覆盖此默认。
  sessionStore: ""
  # logBackend/lokiEndpoint：控制面日志检索。生产建议 loki——本 chart 不含 Loki 实例，
  # 需自备（如 kube-prometheus-stack 之外的 loki-stack）并把内部地址填入 lokiEndpoint；
  # 留 memory 时控制面重启即丢日志。logBackend=loki 而未填 lokiEndpoint 会在 helm 渲染期报错。
  logBackend: "memory"
  lokiEndpoint: ""
  # Cookie Secure 标志：生产强制 true——HTTPS 反代终止 TLS 时控制面虽收 HTTP，
  # 但对外是 HTTPS，Cookie 须 Secure 防中间人窃取会话。
  cookieSecure: true
  alertWebhookURL: ""
  alertNotifierType: generic
  # 生产资源放大
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # 生产启用 HPA：2~10 副本按 CPU 自动扩缩
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80  # 可选
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: opsmesh
                app.kubernetes.io/component: controlplane
            topologyKey: kubernetes.io/hostname
  tolerations: []
  extraEnv: []

## @section Agent
agent:
  enabled: true
  image:
    repository: ghcr.io/levango7/opsmesh-agent
    # 与 controlplane 同版本发布（与 Chart.yaml 0.9.0 对齐）；禁止 latest。
    tag: "0.9.0"
    # 镜像 digest：同 controlplane，生产建议 CI 写回，非空优先于 tag。
    digest: ""
    pullPolicy: IfNotPresent
  segment: default
  workerConcurrency: 8
  taskTimeout: 300s
  dataDir: /var/lib/opsmesh
  demo: false
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    enabled: true
  extraEnv: []

## @section MySQL
mysql:
  enabled: true
  image: mysql:8
  imagePullPolicy: IfNotPresent
  database: opsmesh
  user: opsmesh
  persistence:
    # 生产 100Gi
    size: 100Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # 生产备份：每天快照保留 14 天、PVC 30Gi（DR runbook RPO=24h 基线）。
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 14
    historyLimit: 14
    backoffLimit: 2
    activeDeadlineSeconds: 1800
    storageSize: 30Gi
    storageClass: ""

## @section Redis
redis:
  enabled: true
  image: redis:7
  imagePullPolicy: IfNotPresent
  persistence:
    # 生产 20Gi
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []

## @section Microservices（微服务，生产默认同样全部禁用）
# 与 values.yaml 相同：services.* 默认 enabled=false，templates/microservices.yaml 渲染为空，
# 存量生产部署零行为变化。生产启用微服务时的推荐覆盖项（示例以 task_svc 为准，未启用不生效）：
# services:
#   task_svc:
#     enabled: true
#     image:
#       repository: ghcr.io/levango7/task-svc
#       # 生产禁止 latest：钉 semver 或由 CI GitOps 写回 digest（非空优先于 tag）。
#       # 标签格式为 release.yml 的 ${GITHUB_REF_NAME#v}（v0.9.0 → 0.9.0），无 v 前缀。
#       tag: "0.9.0"
#       digest: ""
#     replicas: 2
#     # 生产接 MySQL（需 controlplane.store=mysql + mysql.enabled=true，
#     # 自动渲染 TASK_SVC_DSN，复用 Secret 键 mysql-dsn——与控制面同库同凭据）
#     storeType: "sql"
#     resources:
#       requests:
#         cpu: 200m
#         memory: 256Mi
#       limits:
#         cpu: 1000m
#         memory: 512Mi
#     env: {}
services: {}

## @section ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

## @section Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opsmesh.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

## @section Observability
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9091"
podLabels: {}

## @section Observability
observability:
  # 生产启用 ServiceMonitor（需集群已部署 Prometheus Operator）
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  # 生产启用 PrometheusRule 内置告警
  prometheusRule:
    enabled: true