# OpsMesh 生产环境 overlay
# 用法：helm install opsmesh ./deploy/helm/opsmesh -f deploy/helm/opsmesh/values-production.yaml -n opsmesh
# 关键差异：3 副本 + mysql 持久化 + TLS + require-auth + 资源放大

## @section Global
global:
  imageRegistry: ""
  imagePullSecrets: []
  # 生产推荐使用 fast SSD 存储类
  storageClass: ""

## @section Controlplane
controlplane:
  image:
    repository: opsmesh/opsmesh
    # 生产环境必须用精确 sha 或 semver：--set controlplane.image.tag=<sha>
    # 或通过 GitOps 写回（ci.yml 闭环，需配置 GITOPS_REPO/GITOPS_PAT secret）。
    # 此处钉死 0.7.0（当前发布版本）；禁止改回 latest——latest 不可变追踪，
    # 滚回 / 审计 / 供应链溯源均失效。
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  # 生产 3 副本 + leader 选举
  replicaCount: 3
  # 生产必须 mysql（多副本数据一致）
  store: mysql
  production: true
  # 生产强制鉴权
  requireAuth: true
  # 控制面对外可达地址（按需改为 Ingress/LB 域名）
  advertiseAddr: ""
  # 生产强制 TLS / mTLS
  tls:
    enabled: true
    secretName: opsmesh-tls
  taskLeaseSec: 300
  taskMaxRetries: 3
  leaderTTLSec: 15
  leaderTickSec: 5
  archiveAgeMin: 1440
  # provisionSecret 务必显式注入（多副本需一致），建议 helm install --set controlplane.provisionSecret=$(openssl rand -hex 32)
  provisionSecret: ""
  # jwtSecret 务必显式注入（多副本需一致），与 provisionSecret 同法：
  # helm install ... --set controlplane.jwtSecret=$(openssl rand -hex 32)
  jwtSecret: ""
  # Cookie Secure 标志：生产强制 true——HTTPS 反代终止 TLS 时控制面虽收 HTTP，
  # 但对外是 HTTPS，Cookie 须 Secure 防中间人窃取会话。
  cookieSecure: true
  alertWebhookURL: ""
  alertNotifierType: generic
  # 生产资源放大
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # 生产启用 HPA：2~10 副本按 CPU 自动扩缩
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80  # 可选
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: opsmesh
                app.kubernetes.io/component: controlplane
            topologyKey: kubernetes.io/hostname
  tolerations: []
  extraEnv: []

## @section Agent
agent:
  enabled: true
  image:
    repository: opsmesh/opsmesh-agent
    # 与 controlplane 同版本发布（CHANGELOG 当前 0.7.0）；禁止 latest。
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  segment: default
  workerConcurrency: 8
  taskTimeout: 300s
  dataDir: /var/lib/opsmesh
  demo: false
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    enabled: true
  extraEnv: []

## @section MySQL
mysql:
  enabled: true
  image: mysql:8
  imagePullPolicy: IfNotPresent
  database: opsmesh
  user: opsmesh
  persistence:
    # 生产 100Gi
    size: 100Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # 生产备份：每天快照保留 14 天、PVC 30Gi（DR runbook RPO=24h 基线）。
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 14
    historyLimit: 14
    backoffLimit: 2
    activeDeadlineSeconds: 1800
    storageSize: 30Gi
    storageClass: ""

## @section Redis
redis:
  enabled: true
  image: redis:7
  imagePullPolicy: IfNotPresent
  persistence:
    # 生产 20Gi
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []

## @section ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

## @section Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opsmesh.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

## @section Observability
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9091"
podLabels: {}

## @section Observability
observability:
  # 生产启用 ServiceMonitor（需集群已部署 Prometheus Operator）
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  # 生产启用 PrometheusRule 内置告警
  prometheusRule:
    enabled: true