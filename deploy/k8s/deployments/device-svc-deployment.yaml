# device-svc —— 本地 Kind 开发样例清单（非生产；生产用 deploy/helm/opsmesh）。
#
# 端口 / 探针 / env 名逐项对照源码核实（2026-09-25）：
#   - HTTP 端口：DEVICE_SVC_HTTP_PORT，默认 8081（services/device-svc/pkg/config/config.go）
#   - gRPC 端口：DEVICE_SVC_GRPC_PORT，默认 50052
#   - 探针路径：/health、/ready（cmd/device-svc/main.go）
#   - 暴露 /metrics（mux.Handle("/metrics", metrics.GetHandler())）——在【HTTP 端口】上，
#     无独立 metrics 端口，故 prometheus.io/port 取 8081。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-svc
  namespace: opsmesh
  labels:
    app: device-svc
    component: device
spec:
  replicas: 2
  selector:
    matchLabels:
      app: device-svc
  template:
    metadata:
      labels:
        app: device-svc
        component: device
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: device-svc
          image: opsmesh/device-svc:0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: grpc
              containerPort: 50052
              protocol: TCP
          env:
            - name: DEVICE_SVC_HTTP_PORT
              value: "8081"
            - name: DEVICE_SVC_GRPC_PORT
              value: "50052"
            - name: DEVICE_SVC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opsmesh-secrets
                  key: jwt-secret
            - name: DEVICE_SVC_PROVISION_SECRET
              valueFrom:
                secretKeyRef:
                  name: opsmesh-secrets
                  key: provision-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: device-svc
  namespace: opsmesh
  labels:
    app: device-svc
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
  selector:
    app: device-svc
