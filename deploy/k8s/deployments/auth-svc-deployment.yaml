# auth-svc —— 本地 Kind 开发样例清单（非生产；生产用 deploy/helm/opsmesh）。
#
# 本文件的端口 / 探针 / env 名逐项对照源码核实（2026-09-25），
# 与生产形态的差异：单机 memory 存储、无 TLS、无资源隔离，仅用于本地联调。
#   - HTTP 端口：AUTH_SVC_HTTP_PORT，默认 8081（services/auth-svc/pkg/config/config.go）
#   - gRPC 端口：AUTH_SVC_GRPC_PORT，默认 50052
#   - 探针路径：/health、/ready（services/auth-svc/cmd/auth-svc/main.go）
#   - auth-svc 不注册 /metrics（仅 device-svc / task-svc / alert-svc 注册该路径）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: opsmesh
  labels:
    app: auth-svc
    component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
        component: auth
    spec:
      containers:
        - name: auth-svc
          image: opsmesh/auth-svc:0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: grpc
              containerPort: 50052
              protocol: TCP
          env:
            - name: AUTH_SVC_HTTP_PORT
              value: "8081"
            - name: AUTH_SVC_GRPC_PORT
              value: "50052"
            # JWT 校验密钥：与控制面同源（Secret 键 jwt-secret）。
            # 缺失时 auth-svc 会退回代码内置弱密钥 "default-jwt-secret-change-in-production"（可伪造令牌）。
            - name: AUTH_SVC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opsmesh-secrets
                  key: jwt-secret
            # 初始 admin 口令：与控制面 OPSMESH_ADMIN_PASSWORD 同一交付通道
            # （生产模式缺失即拒绝启动，此处由 create-secret 随机生成并打印）。
            - name: AUTH_SVC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmesh-secrets
                  key: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: opsmesh
  labels:
    app: auth-svc
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
  selector:
    app: auth-svc
