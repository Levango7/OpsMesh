# alert-svc —— 本地 Kind 开发样例清单（非生产；生产用 deploy/helm/opsmesh）。
#
# 端口 / 探针逐项对照源码核实（2026-09-25）：
#   - HTTP 端口：ALERT_SVC_HTTP_PORT，默认 8080（services/alert-svc/pkg/config/config.go）
#   - gRPC 端口：ALERT_SVC_GRPC_PORT，默认 50051
#   - 探针路径：/health、/ready（cmd/alert-svc/main.go）
#   - 暴露 /metrics（在 HTTP 端口上，无独立 metrics 端口）
#   - HTTP 路由仅 /api/v1/escalation/* 与 /api/v1/oncall/*（internal/server/escalation_http.go），
#     无 /api/v1/alerts 路由（Ingress 路径据此配置）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-svc
  namespace: opsmesh
  labels:
    app: alert-svc
    component: alert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-svc
  template:
    metadata:
      labels:
        app: alert-svc
        component: alert
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: alert-svc
          image: opsmesh/alert-svc:0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: ALERT_SVC_HTTP_PORT
              value: "8080"
            - name: ALERT_SVC_GRPC_PORT
              value: "50051"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: alert-svc
  namespace: opsmesh
  labels:
    app: alert-svc
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    app: alert-svc
