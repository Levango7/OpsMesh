# task-svc —— 本地 Kind 开发样例清单（非生产；生产用 deploy/helm/opsmesh）。
#
# 端口 / 探针 / env 名逐项对照源码核实（2026-09-25）：
#   - HTTP 端口：TASK_SVC_HTTP_PORT，默认 8081（services/task-svc/pkg/config/config.go）
#   - gRPC 端口：TASK_SVC_GRPC_PORT，默认 50052
#   - 探针路径：/health、/ready（cmd/task-svc/main.go）
#   - 暴露 /metrics（在 HTTP 端口上，无独立 metrics 端口）
#   - JWT 校验密钥 env 名为裸 JWT_SECRET（services/task-svc/pkg/config 读此名，非 TASK_SVC_ 前缀）
#   - 多副本选主默认是进程内 stub（cmd/task-svc/main.go: leader.NewStub()），
#     不访问 K8s API；改用 K8s Lease 选举时需另行授予 coordination.k8s.io/leases 权限。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-svc
  namespace: opsmesh
  labels:
    app: task-svc
    component: task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-svc
  template:
    metadata:
      labels:
        app: task-svc
        component: task
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: task-svc
          image: opsmesh/task-svc:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: grpc
              containerPort: 50052
              protocol: TCP
          env:
            - name: TASK_SVC_HTTP_PORT
              value: "8081"
            - name: TASK_SVC_GRPC_PORT
              value: "50052"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opsmesh-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: task-svc
  namespace: opsmesh
  labels:
    app: task-svc
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
  selector:
    app: task-svc
