# gpu-svc —— 本地 Kind 开发样例清单（非生产；生产用 deploy/helm/opsmesh）。
#
# 端口 / 探针逐项对照源码核实（2026-09-25）：
#   - HTTP 端口：GPU_SVC_HTTP_PORT，默认 8090（services/gpu-svc/pkg/config/config.go）
#   - gpu-svc 无 gRPC 端口（config 无 GRPCPort），故不声明 grpc
#   - 探针路径：/health、/ready（cmd/gpu-svc/main.go）
#   - gpu-svc 不注册 /metrics
#
# 与生产形态的差异（本样例可在无 GPU 的本地集群直接起）：
#   原清单锁定 accelerator=nvidia 节点 + 申请 nvidia.com/gpu，Kind 集群无此节点 →
#   Pod 永远 Pending。样例移除该约束；接真实 GPU 节点时按下方注释恢复。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-svc
  namespace: opsmesh
  labels:
    app: gpu-svc
    component: gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-svc
  template:
    metadata:
      labels:
        app: gpu-svc
        component: gpu
    spec:
      # 真实 GPU 节点上恢复以下约束（并给 resources 加 nvidia.com/gpu: 1）：
      # nodeSelector:
      #   accelerator: nvidia
      # tolerations:
      #   - key: nvidia.com/gpu
      #     operator: Exists
      #     effect: NoSchedule
      containers:
        - name: gpu-svc
          image: opsmesh/gpu-svc:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: GPU_SVC_HTTP_PORT
              value: "8090"
            # GPU 指标采集目标（默认 http://localhost:11434）；无 Ollama 时可留空。
            - name: GPU_SVC_OLLAMA_URL
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-svc
  namespace: opsmesh
  labels:
    app: gpu-svc
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    app: gpu-svc
