kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: opsmesh-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
    extraMounts:
      - hostPath: /dev/null
        containerPath: /tmp/kind-shared
  - role: worker
    extraMounts:
      - hostPath: /dev/null
        containerPath: /tmp/kind-shared
  - role: worker
    extraMounts:
      - hostPath: /dev/null
        containerPath: /tmp/kind-shared
networking:
  disableDefaultCNI: false
  kubeProxyMode: "iptables"
  serviceSubnet: "10.96.0.0/12"
  podSubnet: "10.244.0.0/16"
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]
