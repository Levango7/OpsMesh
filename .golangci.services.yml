# OpsMesh services/operator 子模块 golangci-lint 配置（v2，与根 .golangci.yml 分离）
#
# 为什么不直接用根配置（两个原因，2026-09-27 实测）：
# 1. 路径误配对：根配置的豁免规则按根模块相对路径编写（path: internal/agent/...），
#    而从 services/<svc> 目录运行 lint 时，服务自己的文件相对路径也叫 internal/...——
#    根的豁免会**静默命中服务的同名路径**，豁免语义完全失控。
# 2. 存量债节奏不同：根模块经多轮治理全绿；services 存量债（TD-71/72）按类偿清，
#    每清完一类即把该类 linter 收编进 enable——2026-09-27 已收编 gosec/staticcheck/
#    govet/unused/ineffassign；errcheck 于 2026-09-28 全量收编（含收紧档
#    check-blank + check-type-assertions：80 处逐点修复 + 19 处按类豁免，见下）。
#
# 正确性门禁不缩水：ci.yml services job 另行跑 go vet ./... 与 go test -race。

version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - bodyclose        # http.Response.Body 必须 Close
    - copyloopvar      # 循环变量拷贝检查（Go 1.22 loopvar 兼容）
    - errcheck         # 未检查的错误返回（2026-09-28 含收紧档 check-blank/type-assertions）
    - gosec            # 安全静态分析（豁免见 rules，逐条有据）
    - ineffassign      # 无效赋值
    - misspell         # 注释/字符串拼写
    - revive           # 风格检查（exported 关闭，与根配置一致）
    - sqlclosecheck    # sql.Rows/Stmt/Conn 必须 Close
    - staticcheck      # 含 ST1003 命名等（QF/SA 修复后收编）
    - unused           # 未使用符号（TD-72 死代码清偿后收编）
    - govet            # enable-all 除 shadow/fieldalignment（与根一致）
  settings:
    errcheck:
      # 2026-09-28 收官：收紧档（check-blank + check-type-assertions）开启后全量勘验——
      # 80 处逐点修复（RowsAffected/LastInsertId ×41、Unmarshal 行扫描 ×39、ReadAll ×6、
      # limit/硬件解析 ×9、handler Decode→400 ×7 等；失败均记日志或显式降级，行为与
      # 原 `_` 语义一致），19 处 best-effort 按类豁免登记在下方 exclusions.rules
      #（失败仅影响可观测性/旁路能力/降级路径，不影响主流程）。
      check-blank: true
      check-type-assertions: true
      exclude-functions:
        - (*bufio.Writer).WriteString
        - (*bytes.Buffer).Write
        - (io.Writer).Write
        # 序列化失败仅遇 channel/func 等不支持类型，仓库模型均为纯数据结构。
        - encoding/json.Marshal
        # HTTP 响应写回：状态码已发出后调用方无法补救（CLI stdout 同理）。
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        - (*encoding/csv.Writer).Write
        # task-svc 事件总线：内存总线发布失败无补救路径（订阅者各自兜底），
        # 与根配置 best-effort 通知类豁免同理由（TD-71，2026-09-28）。
        - (github.com/Levango7/OpsMesh/services/task-svc/internal/events.EventBus).Publish
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件放宽（与根配置同款）：常故意忽略 err / 弱口令 fixture / 测试构造
      # 结构体给未读字段赋值（govet unusedwrite）。
      - linters:
          - errcheck
          - gosec
          - unparam
          - wastedassign
        path: _test\.go
      - linters:
          - govet
        path: _test\.go
        text: "unusedwrite:"
      # unusedwrite（非测试）：rows.Scan 的目标结构体字段是完整行映射，
      # 部分字段由 JSON 序列化在别的链路读取——静态分析不可见，属 scan 惯用法。
      - linters:
          - govet
        text: "unusedwrite:"
      # G115：值域安全转换——protobuf 兼容层/端口/长度字段（值域有界），
      # 与根配置 internal/(grpcx|agent|controlplane) 同款理由，扩展到 services。
      - linters:
          - gosec
        text: "G115"
      # G404 弱随机数：grafana-bridge 是模拟数据源（随机性即职责）、gpu-svc
      # metrics 模拟兜底——与根配置 cmd/device-sim、pkg/retry 豁免同理由。
      # services 内全部 G404 均为模拟数据场景（2026-09-27 逐点核实）。
      - linters:
          - gosec
        text: "G404"
      # G101：cookie 名称常量（opsmesh_at/rt）非凭据，误报——根配置同款。
      # services 内 G101 仅 auth-svc cookie 常量一处（2026-09-27 核实）。
      - linters:
          - gosec
        text: "G101"
      # G124：cookie Secure 由配置显式控制（TLS 推断/显式注入）——根配置同款。
      # services 内 G124 仅 auth-svc setCookie 一处（2026-09-27 核实）。
      - linters:
          - gosec
        text: "G124"
      # G202：SQL 拼接——各服务 list 查询只拼固定 WHERE 结构片段（列名字面量），
      # 值一律走 ? 占位符（args...），与根配置 internal/(store|logstore) 豁免同理由。
      - linters:
          - gosec
        text: "G202"
      # G118：后台 goroutine 刻意脱离请求 ctx（job 自带超时兜底），
      # 与根配置 agent/deploy 豁免同理由。services 内仅 device/workflow 各一处。
      - linters:
          - gosec
        text: "G118"
      # G204：runbook runner 的职责就是执行脚本命令（受信内容），与根配置
      # agent/helm 豁免同理由。services 内仅 runbook runner 一处。
      - linters:
          - gosec
        text: "G204"
      # SA1019：grpc.CustomCodec 整个 1.x 均支持（官方注明），替换属行为变更，
      # 与根配置 grpc.DialContext 豁免同理由。
      - linters:
          - staticcheck
        text: "SA1019: .*CustomCodec is deprecated"
      # tx.Rollback：Go 惯用法（Commit 后为 no-op），根配置同款。
      - linters:
          - errcheck
        text: "tx.Rollback"
      # main 退出路径的 defer shutdown：进程即将退出，返回值无从补救——
      # 根配置 cmd/opsmesh/main.go 同款豁免（main.go 范围内 errcheck 整体豁免，
      # Encode 等已由 exclude-functions 覆盖，其余为退出路径输出）。
      - linters:
          - errcheck
        path: cmd/[a-z-]+/main\.go
      # tf-provider：Terraform SDK 惯用法——d.Get 类型断言由 schema 契约保证、
      # d.Set 失败= schema 键拼错属开发期错误（155 处），整模块豁免 errcheck。
      # 该模块为工具链二进制，非运行时服务。
      - linters:
          - errcheck
        path: tf-provider/
      # ===== errcheck 收紧档（check-blank/check-type-assertions）19 处豁免 =====
      # 均为 best-effort 语义：失败仅影响可观测性/旁路能力/降级路径，不影响主流程。
      # 2026-09-28 逐点勘验（TD-71）；其余 80 处已改为显式检查（记日志/400/降级），
      # 两批合计与收紧档测量值 99 处一一对应。path 为服务相对路径（CI 从各服务
      # 目录运行 lint，见 ci.yml services job）。
      # alert-svc：notifier/breaker 为注入的接口实现，通知失败=旁路降级，不阻断主流程。
      - linters:
          - errcheck
        path: internal/service/service\.go
        text: 's\.(notifier\.(TriggerEvent|AcknowledgeEvent|ResolveEvent)|breaker\.Execute)'
      # alert-svc：escalation 的 notifyFn 是 func 字段，errcheck 无法给出被调名（通用
      # 文案）；该文件仅此 3 处，逐点核对均为通知旁路。
      - linters:
          - errcheck
        path: internal/escalation/escalation\.go
        text: 'Error return value is not checked'
      # auth-svc：会话创建/吊销/登出为 Redis 降级设计——失败回落 JWT/本地清理，
      # 接口本身无错误返回契约，主流程照常（根配置 auth 同理由）。
      - linters:
          - errcheck
        path: internal/http/gateway\.go
        text: 'sessions\.(Create|Revoke)|svc\.Logout|Store\)\.UpdateUser'
      - linters:
          - errcheck
        path: internal/cache/session\.go
        text: 's\.save|baseCmd\)\.Err'
      # task-svc：webhook/回调入口允许空 body（best-effort 解析，空值走默认分支），
      # 与 handler 其他入口的 400 严格契约不同（此处为回调协议，非用户输入）。
      - linters:
          - errcheck
        path: internal/http/gateway\.go
        text: 'json\.Decoder\)\.Decode'
      # device-svc：注册后用量计量失败不回滚注册（根配置 pkg/tenant 调用同理由）。
      - linters:
          - errcheck
        path: internal/service/service\.go
        text: 'TrackUsage'
      # bot-svc：DrainBody 刻意排空响应体（保证连接复用），读取错误无补救路径。
      - linters:
          - errcheck
        path: internal/client/client\.go
        text: 'io\.Copy'
    paths:
      - .*\.gen\.go$
      - .*\.pb\.go$
      - vendor
      - docs
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Levango7/OpsMesh
  exclusions:
    generated: lax
    paths:
      - .*\.gen\.go$
      - .*\.pb\.go$

