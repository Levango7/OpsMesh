<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="opsMeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e6ad2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#533afd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007cf0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="url(#opsMeshGrad)" />
  
  <!-- 运维网格：六边形蜂窝结构 -->
  <!-- 中心节点 -->
  <circle cx="16" cy="16" r="3" fill="#ffffff" filter="url(#glow)" />
  
  <!-- 六个顶点节点 -->
  <circle cx="16" cy="7" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="23.5" cy="11.5" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="23.5" cy="20.5" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="16" cy="25" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="8.5" cy="20.5" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="8.5" cy="11.5" r="2" fill="#ffffff" opacity="0.9" />
  
  <!-- 连接线：中心到顶点 -->
  <line x1="16" y1="16" x2="16" y2="7" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  <line x1="16" y1="16" x2="23.5" y2="11.5" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  <line x1="16" y1="16" x2="23.5" y2="20.5" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  <line x1="16" y1="16" x2="16" y2="25" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  <line x1="16" y1="16" x2="8.5" y2="20.5" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  <line x1="16" y1="16" x2="8.5" y2="11.5" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  
  <!-- 连接线：顶点间（六边形边） -->
  <line x1="16" y1="7" x2="23.5" y2="11.5" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="23.5" y1="11.5" x2="23.5" y2="20.5" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="23.5" y1="20.5" x2="16" y2="25" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="16" y1="25" x2="8.5" y2="20.5" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="8.5" y1="20.5" x2="8.5" y2="11.5" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="8.5" y1="11.5" x2="16" y2="7" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
</svg>