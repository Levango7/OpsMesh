# buf 代码生成配置。
# buf.gen.yaml v2：用 buf remote 插件（无需本机安装 protoc-gen-go/protoc-gen-go-grpc）。
# 生成目标：../internal/grpcx/pb（相对 proto/ 目录），与手写 service.go 并存。
# paths=source_relative：输出文件名与 .proto 同名（registration.pb.go / registration_grpc.pb.go）。
# require_unimplemented_methods=false：服务端不强制实现 UnimplementedRegistrationServer
#   （兼容期由 grpcx.StubAdapter 桥接到现有 grpcx.RegistrationServer 实现，无需嵌入 Unimplemented）。
version: v2
managed:
  enabled: true
  # go_package 已在 .proto option 中显式声明（opsmesh/internal/grpcx/pb;pbv1），
  # managed mode 不会覆盖；此处仅启用以备未来统一管理。
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../internal/grpcx/pb
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../internal/grpcx/pb
    opt:
      - paths=source_relative
      - require_unimplemented_methods=false