# buf 模块配置（proto/ 目录根）。
# buf.yaml v2：lint 用 STANDARD 规则集（字段下划线命名/枚举前缀等），
# breaking 用 FILE 策略（按文件粒度检测破坏性变更：禁止删字段/改类型/改字段号/改字段名）。
# FILE 比 WIRE 更严格：WIRE 只守二进制兼容，FILE 还守源码兼容（更早暴露破坏性变更）。
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  # 除默认忽略外，本模块允许：
  # - PACKAGE_VERSION_SUFFIX：包名 opsmesh.v1 / opsmesh.task.v1 已带版本后缀。
  # - 命名风格类规则（SERVICE_SUFFIX / RPC_*_STANDARD_NAME / RPC_REQUEST_RESPONSE_UNIQUE）：
  #   proto 契约已冻结——agent 端直接调用 /opsmesh.v1.Registration/Register 等方法路径，
  #   重命名 Service/RPC/消息会破坏 gRPC 方法契约与所有已部署 agent 兼容性。
  #   buf STANDARD 的其余正确性规则（字段下划线命名/枚举前缀/唯一性等）仍强制。
  # 注（2026-10-07）：原 DIRECTORY_SAME_PACKAGE 例外已移除——模块内两个目录各只含一个包，
  # 规则本就满足；留着等于给未来"同目录多包"预置免检面。移除后实测 lint 仍为 0。
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE