# 安全 E2E 专用栈（roadmap 4.5）：require-auth / 租户越权 / mTLS / 任务取消。
# 与 docker-compose.yaml 的区别：
#   - controlplane 开启 --require-auth（缺失身份拒绝 401）
#   - controlplane 开启 gRPC mTLS（--tls-cert/key + --client-ca 要求客户端证书）
#   - agent 携带客户端证书注册（mTLS 双向认证通过）
# 证书由 CI e2e-sec job 用 openssl 生成后挂载（见 .github/workflows/ci.yml e2e-sec 段）。
# 注意：本项目复用主 compose 的 mysql/redis/controlplane/agent 镜像（build 一次即可）。

services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsmesh/controlplane:dev
    command:
      - --mode=controlplane
      - --store=mysql
      - --mysql-dsn=${MYSQL_USER:-opsmesh}:${MYSQL_PASSWORD:-opsmesh}@tcp(mysql:3306)/opsmesh?parseTime=true
      - --redis-addr=redis:6379
      - --advertise-addr=http://controlplane:8080
      - --demo
      # ── 安全 E2E 专项 ──
      - --require-auth
      - --tls-cert=/certs/server.crt
      - --tls-key=/certs/server.key
      - --client-ca=/certs/ca.crt
      # --http-tls=off：本栈测的是 require-auth / 租户越权 / mTLS 契约（gRPC 侧），
      # 整栈夹具（CI 的 curl 健康检查、Playwright E2E_BASE_URL、agent 的
      # --control-addr=http://controlplane:8080）都按明文 HTTP 访问 B/S 端口。
      # 而 --http-tls 默认 auto = 「配了证书即 HTTPS」——上面的 --tls-cert/--tls-key
      # 是为 gRPC mTLS 配的，会让 8080 一并变成 HTTPS：明文请求被 Go 直接以
      # 400（Client sent an HTTP request to an HTTPS server）拒绝，实测即此现象。
      # 本栈以 --demo 运行、非生产，故显式关闭 B/S 侧 TLS 保持夹具语义一致。
      # 生产部署不要照抄：那里应让 auto 生效，或由上游反代终止 TLS 后再 off。
      - --http-tls=off
    ports:
      - "8080:8080"   # HTTP API（require-auth 生效）
      - "9090:9090"   # gRPC（mTLS 生效）
      - "9091:9091"   # Prometheus metrics
    environment:
      OPSMESH_JWT_SECRET: ${OPSMESH_JWT_SECRET:-ci-e2e-sec-jwt-secret-key-min-32-bytes-0123456789abcdef}
      OPSMESH_COOKIE_SECURE: "false"
      OPSMESH_PUBLIC_REGISTER: "false"
    volumes:
      - ./e2e-certs:/certs:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/opsmesh", "--health"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: opsmesh
      MYSQL_USER: opsmesh
      MYSQL_PASSWORD: opsmesh
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: opsmesh/agent:dev
    command:
      - --mode=agent
      - --control-addr=http://controlplane:8080
      - --segment=default
      # mTLS：携带客户端证书访问控制面 9090（无证书会被拒——见 security.spec.js mTLS 用例）
      - --tls-cert=/certs/client.crt
      - --tls-key=/certs/client.key
      - --client-ca=/certs/ca.crt
      # 显式白名单 = 出厂默认（defaultAgentShellWhitelist） + sleep。
      # security.spec.js「任务取消全链路」用 `sleep 30`/`sleep 60` 制造长任务，才能验
      # pending 拦截与 running 强杀；而 sleep 不在默认白名单（仅只读诊断命令）内，
      # 不放开则 agent 侧 checkShellWhitelist 立即拒绝（ExitCode=-1）、任务在 cancel
      # 之前就进入 failed——cancel 对终态任务返回 404（server_tasks.go:566），
      # 用例会以 "expect([200,201]).toContain(404)" 误判为取消链路故障。
      # 本栈是安全场景夹具（--demo、非生产），显式放开 sleep 只为让取消语义可测。
      - --agent-shell-whitelist=ls,cat,echo,date,whoami,hostname,pwd,free,df,uptime,top,ps,netstat,ss,ipconfig,systeminfo,sleep
    volumes:
      - ./e2e-certs:/certs:ro
    depends_on:
      controlplane:
        condition: service_healthy
