# MySQL 主从集群
# 使用方法：docker compose -f docker-compose.mysql.yml up -d
version: "3.8"

services:
  mysql-master:
    image: mysql:8.0.33
    container_name: mysql-master
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: opsmesh
      MYSQL_USER: opsmesh
      MYSQL_PASSWORD: opsmesh123
    volumes:
      - mysql-master-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - mysql-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-slave-1:
    image: mysql:8.0.33
    container_name: mysql-slave-1
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_ROOT_HOST: "%"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_REPLICATION_MODE: slave
      MYSQL_REPLICATION_MASTER_HOST: mysql-master
      MYSQL_REPLICATION_MASTER_PORT: 3306
      MYSQL_REPLICATION_MASTER_USER: root
      MYSQL_REPLICATION_MASTER_PASSWORD: root1234
    ports:
      - "3307:3306"
    depends_on:
      - mysql-master
    networks:
      - mysql-net

  mysql-slave-2:
    image: mysql:8.0.33
    container_name: mysql-slave-2
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_ROOT_HOST: "%"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_REPLICATION_MODE: slave
      MYSQL_REPLICATION_MASTER_HOST: mysql-master
      MYSQL_REPLICATION_MASTER_PORT: 3306
      MYSQL_REPLICATION_MASTER_USER: root
      MYSQL_REPLICATION_MASTER_PASSWORD: root1234
    ports:
      - "3308:3306"
    depends_on:
      - mysql-master
    networks:
      - mysql-net

networks:
  mysql-net:
    driver: bridge

volumes:
  mysql-master-data:
