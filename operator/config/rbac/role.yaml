---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: opsmesh-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["opsmesh.io"]
    resources: ["opsmeshinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["opsmesh.io"]
    resources: ["opsmeshinstances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["opsmesh.io"]
    resources: ["opsmeshinstances/finalizers"]
    verbs: ["update"]