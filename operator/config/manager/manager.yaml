---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsmesh-controller-manager
  namespace: opsmesh-system
  labels:
    app.kubernetes.io/name: opsmesh
    app.kubernetes.io/component: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmesh-controller-manager
  namespace: opsmesh-system
  labels:
    app.kubernetes.io/name: opsmesh
    app.kubernetes.io/component: controller-manager
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsmesh
        control-plane: controller-manager
    spec:
      serviceAccountName: opsmesh-controller-manager
      containers:
        - name: manager
          # `make deploy` rewrites this image via `kustomize edit set image controller=${IMG}`.
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --leader-election-id=opsmesh-operator.opsmesh.io
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opsmesh-controller-manager-metrics
  namespace: opsmesh-system
  labels:
    app.kubernetes.io/name: opsmesh
    app.kubernetes.io/component: controller-manager
spec:
  ports:
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: metrics
  selector:
    control-plane: controller-manager